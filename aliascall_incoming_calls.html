<style>
:root{
  --ink:#12302E; --ink-soft:#3E5654; --paper:#B8D3BE; --card:#FFFFFF;
  --teal:#1F6F6B; --teal-deep:#123F3D; --teal-tint:#E4EFEE;
  --coral:#E8734A; --coral-tint:#FDEAE1;
  --line:#DCE3DE; --danger:#C1483A; --found:#2E7D4F;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{ height:100%; }

/* ── PC(넓은 화면) 대응: 콘텐츠는 폰 폭 그대로 유지하되, 가운데 정렬 + 카드 느낌으로 ── */
@media (min-width:760px){
  body{
    background:
      radial-gradient(circle at 15% 20%, rgba(31,111,107,.06), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(232,115,74,.06), transparent 40%),
      var(--paper);
    display:flex; justify-content:center;
  }
  .app-shell{
    max-width:520px; width:100%; min-height:100vh;
    background:var(--paper); box-shadow:0 0 60px rgba(18,48,46,.08);
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }
}

body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; word-break:keep-all; }
h1,h2{ font-family:'Space Grotesk',sans-serif; margin:0; }
.mono{ font-family:'IBM Plex Mono',monospace; }

header{ padding:18px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:var(--card); }
.brand-row{ display:flex; align-items:center; gap:8px; }
.brand-mark{ width:26px; height:26px; border-radius:7px; background:var(--teal); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; font-family:'Space Grotesk',sans-serif; }
.brand-name{ font-size:15px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--coral); }
.listen-badge{ font-size:11px; font-weight:700; color:var(--found); background:rgba(46,125,79,.1); border-radius:20px; padding:5px 11px; display:flex; align-items:center; gap:5px; }
.listen-badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--found); }

main{ max-width:480px; margin:0 auto; padding:26px 20px 60px; }
.page-title{ font-size:20px; margin-bottom:4px; }
.page-desc{ font-size:12.5px; color:var(--ink-soft); margin-bottom:22px; line-height:1.6; }
.login-needed{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13.5px; }

.empty-wait{ text-align:center; padding:70px 20px; color:var(--ink-soft); }
.empty-wait .big{ font-size:40px; margin-bottom:14px; }
.empty-wait p{ font-size:13px; line-height:1.6; }
.missed-card{ background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
.missed-card .m-top{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
.missed-card .m-text{ font-size:13.5px; line-height:1.6; background:var(--paper); border-radius:10px; padding:11px 13px; }

.session-view{ display:none; position:fixed; inset:0; z-index:60; background:var(--paper); flex-direction:column; }
.session-view.show{ display:flex; }
.session-topbar{ flex-shrink:0; max-height:42vh; overflow-y:auto; background:var(--teal-deep); color:#fff; padding:20px 22px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.ring-avatar{ width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-size:27px; margin-bottom:10px; animation:ringPulse 1.2s ease-in-out infinite; flex-shrink:0; }
@keyframes ringPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,.3); } 50%{ box-shadow:0 0 0 14px rgba(255,255,255,0); } }
.session-topbar h3{ font-size:15.5px; margin:0 0 3px; }
.session-topbar p{ font-size:11.5px; color:rgba(255,255,255,.75); margin:0 0 14px; }
.ring-btns{ display:flex; gap:14px; }
.ring-btn{ width:48px; height:48px; border-radius:50%; border:none; font-size:19px; cursor:pointer; flex-shrink:0; }
.ring-btn.accept{ background:var(--found); color:#fff; }
.ring-btn.decline{ background:var(--danger); color:#fff; }

.call-video-area{ visibility:hidden; height:0; overflow:hidden; position:relative; width:100%; max-width:200px; aspect-ratio:3/4; background:#000; border-radius:12px; margin-bottom:0; }
.call-video-area.show{ visibility:visible; height:auto; margin-bottom:10px; }
.call-video-area video{ width:100%; height:100%; object-fit:cover; }
#remoteVideo{ position:absolute; inset:0; }
#localVideo{ position:absolute; width:60px; height:80px; right:8px; bottom:8px; border-radius:8px; border:2px solid rgba(255,255,255,.6); object-fit:cover; }
.voice-avatar{ display:none; width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.14); align-items:center; justify-content:center; font-size:24px; margin-bottom:10px; flex-shrink:0; }
.voice-avatar.show{ display:flex; }
.call-controls{ display:none; gap:12px; margin-top:4px; }
.call-controls.show{ display:flex; }
.ctrl-btn{ width:44px; height:44px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:17px; background:rgba(255,255,255,.14); color:#fff; }
.ctrl-btn.active-off{ background:var(--coral); }
.ctrl-btn.hangup{ background:var(--danger); }
.unmute-btn{ display:none; margin-top:12px; background:rgba(255,255,255,.15); color:#fff; border:1.5px solid rgba(255,255,255,.4); border-radius:18px; padding:8px 14px; font-size:11.5px; font-weight:700; cursor:pointer; }
.unmute-btn.show{ display:inline-block; }

/* 2026-08-19 (2차 수정): 통화 중엔 채팅이 자동으로 안 뜨고 작은 토글 버튼으로만 열리도록
   되돌림 — 음성/영상통화 진행 중 채팅창까지 같이 뜨면 오히려 혼선을 준다는 판단 반영.
   "문자 채팅" 요청(call_type='chat')일 때만 통화 UI 없이 순수 채팅 화면으로 전체 표시함. */
.session-chat{ display:none; flex:1; flex-direction:column; min-height:0; background:var(--paper); }
.session-chat.show{ display:flex; }
.chat-only-header{ display:none; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--card); flex-shrink:0; }
.chat-only-header b{ font-size:14px; }
.chat-only-header button{ background:var(--danger); color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
.chat-mini-toggle{ display:none; position:fixed; right:18px; bottom:18px; width:50px; height:50px; border-radius:50%; background:var(--teal); color:#fff; border:none; font-size:19px; cursor:pointer; z-index:65; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(18,48,46,.25); }
.chat-messages{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
.chat-bubble{ max-width:75%; padding:9px 13px; border-radius:14px; font-size:13px; line-height:1.5; }
.chat-bubble.me{ align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:4px; }
.chat-bubble.them{ align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
.chat-bubble.photo{ padding:4px; background:none !important; border:none !important; }
.chat-photo{ max-width:170px; max-height:220px; border-radius:12px; display:block; cursor:pointer; object-fit:cover; }
.chat-input-row{ display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line); background:var(--card); flex-shrink:0; align-items:center; }
.chat-input-row input{ flex:1; border:1.5px solid var(--line); border-radius:20px; padding:11px 16px; font-size:13.5px; }
.chat-input-row button{ background:var(--teal); color:#fff; border:none; border-radius:50%; width:42px; height:42px; font-size:16px; cursor:pointer; flex-shrink:0; }
.chat-attach-btn{ background:var(--teal-tint) !important; color:var(--teal-deep) !important; font-size:18px !important; }
.chat-closed-note{ display:none; text-align:center; padding:10px 14px; font-size:11.5px; color:var(--ink-soft); background:var(--paper); border-top:1px solid var(--line); }
.chat-closed-note.show{ display:block; }

.back-btn{ background:none; border:none; font-size:18px; color:var(--ink); cursor:pointer; padding:2px 4px 2px 0; line-height:1; }
.brand-home-link{ display:flex; align-items:center; gap:9px; text-decoration:none; color:inherit; }
.sound-unlock-banner{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--amber-tint, #FBF1DE); border:1px solid #E9CE94; border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:12.5px; color:#8a6416; }
.sound-unlock-banner button{ background:#8a6416; color:#fff; border:none; border-radius:16px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0; }
.sound-unlock-banner.hide{ display:none; }

/* 2026-08-19 (2차): 통합 알림설정 — "통화·문자 알림음" + "긴급 알림" ON/OFF 슬라이드 스위치 */
.notify-settings{ background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:6px 16px; }
.notify-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 0; }
.notify-row + .notify-row{ border-top:1px solid var(--line); }
.notify-label{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.notify-label b{ font-size:13.5px; }
.notify-sub{ font-size:11.5px; color:var(--ink-soft); line-height:1.4; }
.toggle-switch{ position:relative; width:46px; height:26px; border-radius:14px; border:none; background:#C7D0CC; cursor:pointer; flex-shrink:0; padding:0; transition:background .15s ease; }
.toggle-switch.on{ background:var(--teal); }
.toggle-switch:disabled{ opacity:.5; cursor:not-allowed; }
.toggle-knob{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s ease; }
.toggle-switch.on .toggle-knob{ left:23px; }
.notify-pc-note{ font-size:11px; color:var(--ink-soft); padding:10px 0 12px; border-top:1px solid var(--line); line-height:1.5; }
</style>

<div class="app-shell">

       항상 열려있음. 통화 UI(session-topbar)는 "채팅 요청"모드에선 아예 숨김. -->
  <div class="session-chat" id="chatPanel">

<script>
const SUPABASE_URL = "https://qmwaraittiurkynszjts.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2FyYWl0dGl1cmt5bnN6anRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODQ5OTUsImV4cCI6MjEwMjM2MDk5NX0.9Qr2vFzDCSKS54N6C5QN44BvCzIPTMQyVz7nX3GqT9Y";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// Metered.ca TURN 서버 연동 (2026-08-17, Free 500MB 플랜, Global 리전) —
// STUN만으로 연결 안 되는 이동통신사 데이터망 등에서 이 TURN 서버가 중계를 맡아줌
const RTC_CONFIG = { iceServers: [
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'turn:global.relay.metered.ca:80', username: '22592e7bcf44337c9065129a', credential: '2c10L34CH/qNmG0z' },
  { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: '22592e7bcf44337c9065129a', credential: '2c10L34CH/qNmG0z' },
  { urls: 'turn:global.relay.metered.ca:443', username: '22592e7bcf44337c9065129a', credential: '2c10L34CH/qNmG0z' },
  { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: '22592e7bcf44337c9065129a', credential: '2c10L34CH/qNmG0z' },
] };

let myRegistrationIds = [];
let pendingSession = null;
let pc = null, localStream = null, rtChannel = null;
// (2026-08-20: chatChannel 변수는 사건(case) 시스템 도입으로 더 이상 필요 없어짐 — currentCaseId/caseRealtimeChannel로 대체됨)
let answerResendInterval = null; // 2026-08-19: answer도 offer처럼 연결될 때까지 반복 재전송 (아래 참고)

// ── chrome://webrtc-internals 안 찾아다녀도, 연결 실패시 후보쌍(candidate-pair) 정보를
// 콘솔에 바로 찍어주는 진단 함수 — 어떤 경로(직접연결 host/srflx, 또는 TURN relay)로
// 시도했다가 왜 실패했는지 여기서 바로 확인 가능 ──
async function logIceCandidatePairs(pcRef){
  try {
    const stats = await pcRef.getStats();
    console.log('%c[webrtc] ── candidate-pair 진단 시작 ──', 'color:#E8734A;font-weight:bold;');
    const candidates = {};
    stats.forEach((report) => {
      if (report.type === 'local-candidate' || report.type === 'remote-candidate') {
        candidates[report.id] = report;
      }
    });
    let pairCount = 0;
    stats.forEach((report) => {
      if (report.type === 'candidate-pair') {
        pairCount++;
        const local = candidates[report.localCandidateId];
        const remote = candidates[report.remoteCandidateId];
        console.log(
          '[webrtc] pair 상태:', report.state,
          '| 로컬:', local ? local.candidateType + '(' + local.protocol + ')' : '?',
          '| 원격:', remote ? remote.candidateType + '(' + remote.protocol + ')' : '?',
          '| nominated:', report.nominated
        );
      }
    });
    if (pairCount === 0) console.warn('[webrtc] candidate-pair가 하나도 없음 — ICE 후보 자체가 상대와 전혀 매칭 안 됨');
    console.log('%c[webrtc] ── candidate-pair 진단 끝 ──', 'color:#E8734A;font-weight:bold;');
  } catch (e) {
    console.error('[webrtc] getStats 진단 실패', e);
  }
}

// ── "딩동" 초인종 알림음 — 외부 음원 없이 코드로 합성 (Web Audio API) ──
// 2026-08-19 (2차): 재생 전 aliascallIsSoundEnabled()로 켜져있는지 확인 (통합 토글, aliascall_push.js)
let sharedAudioCtx = null;

function getAudioCtx(){
  if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return sharedAudioCtx;
}

function playDoorbell(){
  if (!aliascallIsSoundEnabled()) return;
  try {
    const ctx = getAudioCtx();
    const ding = (freq, startTime, duration) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.3, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    };
    const now = ctx.currentTime;
    ding(880, now, 0.26); ding(659, now + 0.28, 0.34);
    ding(880, now + 0.80, 0.26); ding(659, now + 1.08, 0.34);
  } catch (e) { console.warn('[notify] 초인종 소리 재생 실패', e); }
}

// 2026-08-19: 채팅 메시지 도착 알림음 — 통화벨/딩동과 헷갈리지 않도록 짧은 "핑" 한 번으로 구분
function playChatPing(){
  if (!aliascallIsSoundEnabled()) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1046; // 딩동(880/659)보다 높고 짧게 -> 채팅 전용 소리라는 느낌
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.22, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.22);
  } catch (e) { console.warn('[notify] 채팅 알림음 재생 실패', e); }
}

// ── 실제 음성/영상 연결 요청이 왔을 때 울리는 "전화벨" — 문자 알림음(딩동)과는 별개로,
// 응답할 때까지 계속 반복해서 울림 (수락/거절/타임아웃 시 stopRingtone으로 멈춤) ──
let ringtoneInterval = null;

function ringOnce(){
  if (!aliascallIsSoundEnabled()) return;
  try {
    const ctx = getAudioCtx();
    const ring = (freq, startTime, duration) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.28, startTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    };
    const now = ctx.currentTime;
    ring(740, now, 0.35); ring(740, now + 0.40, 0.35);
    ring(740, now + 1.00, 0.35); ring(740, now + 1.40, 0.35);
  } catch (e) { console.warn('[notify] 벨소리 재생 실패', e); }
}

function startRingtone(){
  stopRingtone();
  ringOnce();
  ringtoneInterval = setInterval(ringOnce, 2200);
}

function stopRingtone(){
  if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { document.getElementById('loginNeeded').style.display = 'block'; return; }

  document.getElementById('loginNeeded').style.display = 'none';
  document.getElementById('waitContent').style.display = 'block';
  document.getElementById('listenBadge').style.display = 'flex';
  renderNotifySettings(sb, 'notifySettingsContainer'); // 2026-08-19 (2차): 통합 알림설정 렌더링

  // 2026-08-19: 이 화면이 실제로 알림을 받아야 하는 화면이므로, 서비스워커를 미리 등록해둠.
  // (알림 켜기 버튼은 마이페이지/등록완료화면에 있고, 여기서는 그냥 SW가 준비돼있는지만 보장)
  registerAliascallServiceWorker();

  const { data: regs } = await sb.from('registrations').select('id').eq('user_id', session.user.id);
  myRegistrationIds = (regs || []).map((r) => r.id);
  if (myRegistrationIds.length === 0) return;

  loadMissedMessages();

  // 2026-08-19 (3차 — 중복코드 통합): index.html/my_account.html에서 "수락"을 누르면
  // 그 화면들은 실제 연결을 처리하지 않고 여기로 ?autoaccept=<session_token>과 함께 넘어옴.
  // 이 화면이 유일하게 실제 통화 응답(WebRTC)을 처리하는 곳이라, 도착하자마자 해당 세션을
  // 직접 조회해서 자동으로 이어받음 (사용자가 여기서 다시 수락 버튼을 누를 필요 없음).
  const autoacceptToken = new URLSearchParams(window.location.search).get('autoaccept');
  if (autoacceptToken) {
    try {
      const { data: row } = await sb.from('webrtc_sessions').select('*').eq('session_token', autoacceptToken).maybeSingle();
      if (row && myRegistrationIds.includes(row.registration_id) && !row.ended_at) {
        if (row.call_type === 'chat') {
          openCaseChat(row.case_id); // 2026-08-20: 채팅 분기는 사건(case) 시스템으로 바로 열어줌
        } else {
          pendingSession = row;
          await answerCall(row); // 음성/영상은 링 UI 없이 바로 이어받아 응답 처리
        }
      }
    } catch (e) {
      console.error('[webrtc] autoaccept 처리 실패', e);
    }
    // URL을 깨끗하게 정리 (새로고침해도 같은 세션을 또 자동수락하지 않도록)
    window.history.replaceState({}, '', window.location.pathname);
  }

  // 2026-08-20 신설: 마이페이지 "사건함"에서 특정 사건을 클릭해서 들어온 경우
  // (?case=<caseId> — 링잉/webrtc_sessions와 무관하게 언제든 직접 대화 이어보기 가능)
  const directCaseId = new URLSearchParams(window.location.search).get('case');
  if (directCaseId) {
    openCaseChat(directCaseId);
    window.history.replaceState({}, '', window.location.pathname);
  }

  sb.channel('incoming-calls')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'webrtc_sessions' }, (payload) => {
      const row = payload.new;
      // ⚠ call_type이 'message'면 "문자만 보내기"로 생성된 행이라 실제 통화 요청이 아님 —
      // 전화벨 대신 딩동 소리 + 부재중 메시지 목록만 새로고침함
      if (!myRegistrationIds.includes(row.registration_id)) return;
      if (row.call_type === 'message') { playDoorbell(); loadMissedMessages(); return; }
      showIncomingCall(row);
    })
    .subscribe();

  // ⚠ 2026-08-19 (2차) 신설: 실시간(postgres_changes)이 이론상으로는 즉시 반영돼야 하지만,
  // 탭이 한동안 백그라운드에 있었거나 네트워크가 잠깐 끊겼다 재연결된 경우 등, 브라우저가
  // 웹소켓을 잠시 쉬게 했다가 다시 켜는 사이의 이벤트를 놓칠 수 있음(놓친 이벤트는 재전송되지
  // 않는 게 Realtime의 특성). "문자메시지를 남겼는데 상대 화면엔 새로고침해야 뜨는" 문제의
  // 안전장치로, (1) 탭이 다시 보일 때, (2) 45초마다 주기적으로 목록을 다시 확인해서
  // 자동으로 최신 상태를 반영함.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadMissedMessages();
  });
  setInterval(() => {
    if (!document.hidden) loadMissedMessages();
  }, 45000);
}

async function loadMissedMessages(){
  // ⚠ 예전엔 left_message가 있는 것만 걸러서 보여줬는데, 그러면 "문자 없이 음성통화만 걸었다가
  // 응답 못 받은 경우"가 화면에서 아예 안 보였음(DB엔 있는데 필터링당해서 숨겨짐).
  // 이제는 등록물로 온 모든 연결시도를 다 보여주고, 상태별로 라벨만 다르게 표시함.
  const { data, error } = await sb.from('webrtc_sessions')
    .select('id, left_message, call_type, created_at, registration_id, owner_read_at, owner_joined_at')
    .in('registration_id', myRegistrationIds)
    .order('created_at', { ascending: false })
    .limit(30);
  if (error || !data || data.length === 0) return;

  const container = document.getElementById('missedMessages');
  document.getElementById('emptyWait').style.display = 'none';
  container.innerHTML = '<div class="page-title" style="font-size:15px; margin-bottom:12px;">📞 연결 기록</div>' +
    data.map((m) => {
      let label;
      if (m.call_type === 'message') {
        label = '💬 문자 메시지';
      } else {
        const typeName = m.call_type === 'video' ? '영상' : '음성';
        label = m.owner_joined_at ? ('☎️ ' + typeName + ' 통화 (연결 후 종료됨)') : ('📵 부재중 ' + typeName + ' 통화');
      }
      return `
      <div class="missed-card">
        <div class="m-top">${new Date(m.created_at).toLocaleString('ko-KR')} · ${label}</div>
        ${m.left_message ? '<div class="m-text">' + m.left_message + '</div>' : ''}
      </div>
    `;
    }).join('');

  // 이 화면을 연 시점 = 읽은 것으로 간주 -> 아직 안읽은 것들 읽음처리 (홈/마이페이지 배지 카운트가 이걸로 줄어듦)
  const unreadIds = data.filter((m) => !m.owner_read_at).map((m) => m.id);
  if (unreadIds.length > 0) {
    await sb.from('webrtc_sessions').update({ owner_read_at: new Date().toISOString() }).in('id', unreadIds);
  }
}

const CATEGORY_EMOJI = { vehicle:'🚗', lost_item:'🎒', vulnerable_person:'🧑‍🦳', pet:'🐾', callback_contact:'📮', misc_incident:'❓' };

async function showIncomingCall(row){
  pendingSession = row;

  // 2026-08-19 (2차): "문자 채팅하기"로 온 요청(call_type='chat')은 통화 UI 자체가 없는
  // 순수 채팅 화면으로 바로 열림 (수락/거절 절차 없음 — 마이크/카메라 권한이 필요 없는
  // 비침습적 수단이라 굳이 승인받을 필요가 없음). 음성/영상은 기존 수락/거절 흐름 그대로.
  // 2026-08-20: 채팅 내용은 이제 사건(case) 시스템에 영구 저장됨 — openCaseChat()에 위임
  if (row.call_type === 'chat') {
    playDoorbell(); // 링(전화벨) 대신 도착 알림만 짧게
    openCaseChat(row.case_id);
    return;
  }

  document.getElementById('ringSub').textContent = row.call_type === 'video' ? '영상으로 연결 요청' : '음성으로 연결 요청';
  document.getElementById('sessionView').classList.add('show');
  document.getElementById('sessionTopbar').style.display = 'flex';
  document.getElementById('chatOnlyHeader').style.display = 'none';
  document.getElementById('chatPanel').classList.remove('show');
  document.getElementById('chatToggleMiniBtn').style.display = 'flex';
  document.getElementById('ringState').style.display = 'block';
  document.getElementById('incallState').style.display = 'none';
  startRingtone();

  // webrtc_sessions엔 카테고리 정보가 없어서, 알림에 표시할 아이콘은 registrations를 별도 조회
  try {
    const { data: reg } = await sb.from('registrations').select('category').eq('id', row.registration_id).maybeSingle();
    document.getElementById('ringAvatar').textContent = CATEGORY_EMOJI[reg?.category] || '📞';
  } catch (e) {
    document.getElementById('ringAvatar').textContent = '📞';
  }
}

// ── 2026-08-20 신설: 사건(case) 시스템 기반 채팅 — 영구 저장 + 사진 + 소유자 답장까지 지원 ──
let currentCaseId = null;
let caseRealtimeChannel = null;

function subscribeCaseRealtime(caseId){
  if (caseRealtimeChannel) { try { sb.removeChannel(caseRealtimeChannel); } catch (e) {} }
  caseRealtimeChannel = sb.channel('case-' + caseId, { config: { broadcast: { self: false } } });
  caseRealtimeChannel
    .on('broadcast', { event: 'new-message' }, ({ payload }) => {
      appendChatMessage(payload, 'them');
      playChatPing();
    })
    .subscribe();
}
function unsubscribeCaseRealtime(){
  if (caseRealtimeChannel) { try { sb.removeChannel(caseRealtimeChannel); } catch (e) {} caseRealtimeChannel = null; }
}

// 사건 대화창 열기 — 링잉 알림(showIncomingCall)에서든, 마이페이지 "사건함"에서 직접 클릭해서든
// (?case=<caseId>) 둘 다 이 함수로 들어옴
async function openCaseChat(caseId){
  if (!caseId) { console.error('[case] caseId가 없어서 대화창을 열 수 없음'); return; }
  currentCaseId = caseId;

  document.getElementById('sessionView').classList.add('show');
  document.getElementById('sessionTopbar').style.display = 'none';
  document.getElementById('chatOnlyHeader').style.display = 'flex';
  document.getElementById('chatToggleMiniBtn').style.display = 'none';
  document.getElementById('chatPanel').classList.add('show');
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('chatClosedNote').classList.remove('show');
  document.getElementById('chatInput').disabled = false;
  document.getElementById('chatSendBtn').disabled = false;

  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-case-messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ caseId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '대화 불러오기 실패');

    document.getElementById('chatOnlyHeader').querySelector('b').textContent = '💬 ' + (data.registrationTitle || '문자 채팅');
    (data.messages || []).forEach((m) => appendChatMessage(m, m.sender === 'owner' ? 'me' : 'them'));

    if (data.status === 'closed') {
      document.getElementById('chatClosedNote').classList.add('show');
      document.getElementById('chatInput').disabled = true;
      document.getElementById('chatSendBtn').disabled = true;
    }
  } catch (e) {
    console.error('[case] 대화 불러오기 실패', e);
  }

  subscribeCaseRealtime(caseId);
}

document.getElementById('declineBtn').addEventListener('click', async () => {
  stopRingtone();
  document.getElementById('sessionView').classList.remove('show');
  unsubscribeCaseRealtime();
  document.getElementById('chatMessages').innerHTML = '';
  if (pendingSession) {
    // 거절 신호를 발견자에게 즉시 보내서, 25초 타임아웃까지 안 기다리고 바로 "메시지 남기기"로 넘어가게 함
    const declineChannel = sb.channel('webrtc-' + pendingSession.session_token, { config: { broadcast: { self: false } } });
    declineChannel.subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        declineChannel.send({ type: 'broadcast', event: 'declined', payload: {} });
        setTimeout(() => sb.removeChannel(declineChannel), 600);
      }
    });
  }
  pendingSession = null;
});

document.getElementById('acceptBtn').addEventListener('click', async () => {
  stopRingtone();
  document.getElementById('ringState').style.display = 'none';
  document.getElementById('incallState').style.display = 'block';
  if (!pendingSession) { console.error('[webrtc] pendingSession이 비어있어 수락 처리를 진행할 수 없음'); return; }
  await answerCall(pendingSession);
});

// ⚠ 일부 모바일 브라우저는 srcObject를 비동기 콜백 안에서 늦게 할당하면 autoplay 속성만으로는
// 오디오 재생을 조용히 막아버림. 명시적으로 .play()를 시도하고, 그마저 막히면(NotAllowedError)
// "탭하여 소리 켜기" 버튼을 노출시켜 실제 클릭(사용자 제스처)으로 재생을 강제함.
function tryPlayRemote(remoteEl){
  const playPromise = remoteEl.play();
  if (playPromise && playPromise.catch) {
    playPromise.catch((err) => {
      console.warn('[webrtc] 원격 오디오 자동재생 실패, 수동 재생 버튼 노출', err);
      document.getElementById('unmuteBtn').classList.add('show');
    });
  }
}
document.getElementById('unmuteBtn').addEventListener('click', () => {
  const audioEl = document.getElementById('remoteAudio');
  audioEl.play().catch((err) => console.error('[webrtc] 수동 재생도 실패', err));
  document.getElementById('unmuteBtn').classList.remove('show');
});

async function answerCall(session){
  const mode = session.call_type;
  // 2026-08-19 (3차): acceptBtn을 거치지 않고 autoaccept로 바로 호출되는 경우(index.html 등에서
  // 넘어온 경우)도 있어서, 여기서 직접 sessionView/incallState를 켜줌 (중복 호출은 무해함)
  document.getElementById('sessionView').classList.add('show');
  document.getElementById('sessionTopbar').style.display = 'flex';
  document.getElementById('ringState').style.display = 'none';
  document.getElementById('incallState').style.display = 'block';
  document.getElementById('chatOnlyHeader').style.display = 'none';
  document.getElementById('chatToggleMiniBtn').style.display = 'flex';
  document.getElementById('inCallStatus').textContent = '연결 확인 중…';
  document.getElementById('inCallSub').textContent = '';
  if (mode === 'video') document.getElementById('callVideoArea').classList.add('show');
  else document.getElementById('voiceAvatar').classList.add('show');

  await sb.from('webrtc_sessions').update({ owner_joined_at: new Date().toISOString(), owner_read_at: new Date().toISOString() }).eq('id', session.id); // 실제로 받은 통화는 그 자체로 '확인함' 처리 -> 배지에 안 뜸

  rtChannel = sb.channel('webrtc-' + session.session_token, { config: { broadcast: { self: false } } });
  // ⚠ 상대방 ICE 후보가 setRemoteDescription 끝나기 전에 먼저 도착하면 조용히 유실되던 문제 —
  // 일단 큐에 담아뒀다가 준비되면 한꺼번에 적용함
  let pendingIceCandidates = [];
  rtChannel
    .on('broadcast', { event: 'offer' }, async ({ payload }) => {
      console.log('[webrtc] ① offer 수신됨');
      // ⚠ 발신자가 응답받을 때까지 offer를 반복 재전송하도록 바꿨는데(유실 방지),
      // 이미 처리 중인 offer라면 중복으로 새 연결을 또 만들지 않도록 방어
      if (pc && pc.signalingState !== 'closed') { console.log('[webrtc] (중복 offer, 이미 처리중이라 무시)'); return; }
      pc = new RTCPeerConnection(RTC_CONFIG);
      console.log('[webrtc] ② RTCPeerConnection 생성됨');
      pc.onicecandidate = (e) => { if (e.candidate) { console.log('[webrtc] 내 ICE 후보 전송:', e.candidate.type); rtChannel.send({ type:'broadcast', event:'ice-candidate', payload:{ candidate: e.candidate } }); } else { console.log('[webrtc] 내 ICE 후보 수집 완료(null candidate)'); } };
      pc.ontrack = (e) => {
        console.log('[webrtc] ⑦ 상대방 트랙 수신됨:', e.track.kind);
        // ⚠ 일부 브라우저(삼성 인터넷 등)는 <video> 태그로 오디오 전용 스트림을 재생할 때
        // 오디오 트랙을 놓치는 경우가 있어서, 별도의 <audio> 태그에도 동일 스트림을 연결해
        // 오디오 재생을 이중으로 보장함 (video는 muted 처리해서 소리는 audio 태그에서만 남).
        document.getElementById('remoteVideo').srcObject = e.streams[0];
        const audioEl = document.getElementById('remoteAudio');
        audioEl.srcObject = e.streams[0];
        tryPlayRemote(audioEl);
      };
      // ⚠ 연결이 끊겨도 서로에게 알리는 수단이 없어서 한쪽이 계속 "연결됨"으로 남아있던 문제 —
      // 연결 상태를 직접 감시해서 끊기면 자동으로 통화 종료 처리함
      pc.onconnectionstatechange = () => {
        if (!pc) return;
        console.log('[webrtc] connectionState:', pc.connectionState);
        if (pc.connectionState === 'connected') {
          document.getElementById('inCallStatus').textContent = '연결됨';
          if (answerResendInterval) { clearInterval(answerResendInterval); answerResendInterval = null; } // 2026-08-19
        }
        if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
          console.warn('[webrtc] 연결 상태 이상 감지:', pc.connectionState);
          if (pc.connectionState === 'failed') logIceCandidatePairs(pc);
          hangup(true);
        }
      };
      pc.oniceconnectionstatechange = () => {
        if (!pc) return;
        console.log('[webrtc] iceConnectionState:', pc.iceConnectionState);
        if ((pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') && document.getElementById('inCallStatus').textContent !== '연결됨') {
          document.getElementById('inCallStatus').textContent = '연결됨';
          if (answerResendInterval) { clearInterval(answerResendInterval); answerResendInterval = null; } // 2026-08-19
        }
      };
      pc.onicegatheringstatechange = () => { console.log('[webrtc] iceGatheringState:', pc?.iceGatheringState); };
      console.log('[webrtc] ③ 이벤트 핸들러 등록 완료, getUserMedia 요청 시작');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
      // 에코 제거·잡음 억제·음량 자동조절을 켜서 통화 음질을 개선함 (기본값 audio:true만 쓰면 꺼져있는 브라우저가 있음)
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: mode === 'video',
    });
      } catch (e) {
        console.error('[webrtc] ④ 마이크 권한 실패:', e);
        alert('마이크(또는 카메라) 권한이 필요합니다.');
        hangup(true);
        return;
      }
      console.log('[webrtc] ④ getUserMedia 성공, 트랙 개수:', localStream.getTracks().length);
      localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
      if (mode === 'video') document.getElementById('localVideo').srcObject = localStream;

      await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
      console.log('[webrtc] ⑤ setRemoteDescription 완료, 대기중이던 ICE 후보', pendingIceCandidates.length, '개 적용');
      for (const candidate of pendingIceCandidates) {
        try { await pc.addIceCandidate(candidate); } catch (e) { console.error('[webrtc] 지연 ICE 후보 추가 오류', e); }
      }
      pendingIceCandidates = [];
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      console.log('[webrtc] ⑥ answer 생성 및 설정 완료, 발신 시작');
      sendAnswerNow();

      // ⚠ 2026-08-19: 발신자 쪽 offer가 응답받을 때까지 반복 재전송하도록 되어있는 것과
      // 대칭으로, answer도 딱 한 번만 보내면 그 한 번이 네트워크 순간 끊김 등으로 유실됐을 때
      // 발신자가 영원히 응답을 못 받는 문제가 있었음(발신자는 계속 offer를 재전송해도, 이미
      // pc를 만들어버린 소유자 쪽은 452번 줄 방어로직 때문에 중복 offer를 무시하고 다시 응답
      // 안 하기 때문). 연결(connectionState 'connected')이 확인될 때까지 2.5초 간격으로
      // answer를 계속 재전송함 — 발신자 쪽은 이미 중복 answer를 안전하게 무시하는 방어가 있어서
      // (signalingState !== 'have-local-offer'면 무시) 재전송해도 문제 없음.
      if (answerResendInterval) clearInterval(answerResendInterval);
      answerResendInterval = setInterval(sendAnswerNow, 2500);

      function sendAnswerNow(){
        rtChannel.send({ type:'broadcast', event:'answer', payload:{ sdp: answer } });
      }
    })
    .on('broadcast', { event: 'ice-candidate' }, async ({ payload }) => {
      if (!pc || !pc.remoteDescription) { console.log('[webrtc] 상대 ICE 후보 도착(대기열에 저장):', payload.candidate.type); pendingIceCandidates.push(payload.candidate); return; }
      console.log('[webrtc] 상대 ICE 후보 즉시 적용:', payload.candidate.type);
      try { await pc.addIceCandidate(payload.candidate); } catch (e) { console.error('[webrtc] ICE 추가 오류', e); }
    })
    // ⚠ 2026-08-19: 채팅은 이제 별도 chatChannel(chat-{token})로 완전히 분리됨 — 여기서는 처리 안 함
    .on('broadcast', { event: 'hangup' }, () => hangup(true))
    .subscribe();
}

let callEnding = false; // pc.close() 자체가 connectionstatechange('closed')를 다시 유발해서 재귀호출되는 것 방지

function hangup(silent){
  if (callEnding) return;
  callEnding = true;
  if (answerResendInterval) { clearInterval(answerResendInterval); answerResendInterval = null; } // 2026-08-19
  if (rtChannel && !silent) rtChannel.send({ type:'broadcast', event:'hangup', payload:{} });
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; }
  unsubscribeCaseRealtime(); // 2026-08-20: 통화/채팅 종료와 함께 사건 실시간 채널도 정리
  currentCaseId = null;
  document.getElementById('sessionView').classList.remove('show');
  document.getElementById('callVideoArea').classList.remove('show');
  document.getElementById('voiceAvatar').classList.remove('show');
  document.getElementById('chatPanel').classList.remove('show');
  document.getElementById('chatToggleMiniBtn').style.display = 'none';
  document.getElementById('chatOnlyHeader').style.display = 'none';
  document.getElementById('chatClosedNote').classList.remove('show');
  document.getElementById('chatInput').disabled = false;
  document.getElementById('chatSendBtn').disabled = false;
  document.getElementById('chatMessages').innerHTML = '';
  pendingSession = null;
  callEnding = false;
}
document.getElementById('hangupBtn').addEventListener('click', () => hangup(false));
document.getElementById('chatOnlyEndBtn').addEventListener('click', async () => {
  // 2026-08-20: "채팅 종료" 버튼은 이제 사건 자체를 종료함 (양쪽 다 다시 메시지 못 보냄)
  if (currentCaseId && confirm('이 대화를 종료하시겠어요? 종료하면 더 이상 메시지를 주고받을 수 없어요.')) {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        await fetch(`${SUPABASE_URL}/functions/v1/aliascall-case-close`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
          body: JSON.stringify({ caseId: currentCaseId }),
        });
      }
    } catch (e) { console.warn('[case] 사건 종료 요청 실패', e); }
  }
  hangup(false);
});
document.getElementById('chatToggleMiniBtn').addEventListener('click', () => {
  document.getElementById('chatPanel').classList.toggle('show');
});

let isMuted = false;
document.getElementById('muteBtn').addEventListener('click', () => {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach((t) => (t.enabled = !isMuted));
  const btn = document.getElementById('muteBtn');
  btn.textContent = isMuted ? '🔇' : '🎤';
  btn.classList.toggle('active-off', isMuted);
});

// ── 사진 첨부 (2026-08-20 신설) ──
document.getElementById('chatAttachBtn').addEventListener('click', () => document.getElementById('chatPhotoInput').click());
document.getElementById('chatPhotoInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !currentCaseId) return;
  if (file.size > 8 * 1024 * 1024) { alert('사진 용량이 너무 커요 (최대 8MB).'); return; }

  const attachBtn = document.getElementById('chatAttachBtn');
  attachBtn.disabled = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('로그인이 필요합니다.');

    const base64Data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const uploadRes = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-case-photo-upload`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ caseId: currentCaseId, base64Data, contentType: file.type }),
    });
    const uploadData = await uploadRes.json();
    if (!uploadRes.ok) throw new Error(uploadData.error || '업로드 실패');

    const msgRes = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-case-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ caseId: currentCaseId, photoUrl: uploadData.url }),
    });
    const msgData = await msgRes.json();
    if (!msgRes.ok) throw new Error(msgData.error || '전송 실패');

    appendChatMessage({ message_type: 'photo', content: uploadData.url }, 'me');
  } catch (e) {
    console.error('[case] 사진 전송 실패', e);
    alert('사진을 보내지 못했어요. 잠시 후 다시 시도해주세요.');
  } finally {
    attachBtn.disabled = false;
  }
});

function appendChatMessage(msg, who){
  const el = document.createElement('div');
  const isPhoto = msg.message_type === 'photo';
  el.className = 'chat-bubble ' + who + (isPhoto ? ' photo' : '');
  if (isPhoto) {
    const img = document.createElement('img');
    img.src = msg.content;
    img.className = 'chat-photo';
    img.addEventListener('click', () => window.open(msg.content, '_blank'));
    el.appendChild(img);
  } else {
    el.textContent = msg.content;
  }
  const list = document.getElementById('chatMessages');
  list.appendChild(el);
  list.scrollTop = list.scrollHeight;
}
async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentCaseId) return;
  const sendBtn = document.getElementById('chatSendBtn');
  sendBtn.disabled = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('로그인이 필요합니다.');
    const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-case-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ caseId: currentCaseId, text }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '전송 실패');
    appendChatMessage({ message_type: 'text', content: text }, 'me');
    input.value = '';
  } catch (e) {
    console.error('[case] 메시지 전송 실패', e);
    alert('메시지를 보내지 못했어요. 잠시 후 다시 시도해주세요.');
  } finally {
    sendBtn.disabled = false;
  }
}
document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });

init();
</script>
