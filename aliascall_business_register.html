<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업체 공개 등록 — Aliascall</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#12302E; --ink-soft:#3E5654; --paper:#B8D3BE; --card:#FFFFFF;
  --teal:#1F6F6B; --teal-deep:#123F3D; --teal-tint:#E4EFEE;
  --coral:#E8734A; --coral-tint:#FDEAE1;
  --line:#DCE3DE; --danger:#C1483A; --found:#2E7D4F; --brass:#C9A24B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; word-break:keep-all; }
h1,h2{ font-family:'Space Grotesk',sans-serif; margin:0; }

.topbar{ background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:10px; }
.topbar a.back{ text-decoration:none; color:var(--ink-soft); font-size:18px; }
.topbar .logo{ font-size:15px; font-weight:700; font-family:'Space Grotesk',sans-serif; }
.topbar .logo em{ font-style:normal; color:var(--coral); }

.wrap{ max-width:560px; margin:0 auto; padding:20px 16px 60px; }
h1{ font-size:20px; margin-bottom:6px; }
.desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.75; margin-bottom:18px; }

.card{ background:#fff; border-radius:14px; padding:17px; margin-bottom:14px; }
.card h2{ font-size:14.5px; margin-bottom:10px; }
label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:12px 0 5px; }
label:first-of-type{ margin-top:0; }
input[type=text], select, textarea{
  width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:10px;
  padding:11px 12px; font-size:13.5px; font-family:inherit; color:var(--ink); background:#fff;
}
textarea{ min-height:96px; resize:vertical; line-height:1.7; }
.hint{ font-size:11px; color:var(--ink-soft); line-height:1.65; margin-top:5px; }
.btn{ display:block; width:100%; border:none; border-radius:11px; padding:13px;
      background:var(--teal-deep); color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:16px; }
.btn:disabled{ opacity:.5; cursor:default; }
.btn.ghost{ background:var(--teal-tint); color:var(--teal-deep); }

.warn{ background:var(--coral-tint); border-radius:11px; padding:13px; font-size:11.5px; color:#8A3D1F; line-height:1.75; margin-top:12px; }
.warn b{ color:#7A2E12; }
.ok-box{ background:var(--teal-tint); border-radius:11px; padding:13px; font-size:12px; color:var(--teal-deep); line-height:1.75; }

.doc{ display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line); }
.doc:first-child{ border-top:none; }
.doc .di{ flex:1; min-width:0; }
.doc .dn{ font-size:13px; font-weight:700; }
.doc .ds{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.doc .st{ font-size:10.5px; font-weight:700; border-radius:20px; padding:3px 9px; white-space:nowrap; }
.st.pending{ background:#FDF0D5; color:#8A6A1F; }
.st.approved{ background:var(--teal-tint); color:var(--found); }
.st.rejected{ background:#FCE9E6; color:var(--danger); }

.upload{ border:2px dashed var(--line); border-radius:11px; padding:16px; text-align:center; cursor:pointer; }
.upload:hover{ border-color:var(--teal); }
.upload .u1{ font-size:13px; font-weight:700; }
.upload .u2{ font-size:11px; color:var(--ink-soft); margin-top:4px; line-height:1.6; }
input[type=file]{ display:none; }

.pub{ display:flex; align-items:center; gap:12px; }
.pub .pi{ flex:1; }
.pub .pt{ font-size:14px; font-weight:700; }
.pub .ps{ font-size:11.5px; color:var(--ink-soft); line-height:1.65; margin-top:3px; }
.sw{ width:50px; height:29px; border-radius:20px; background:var(--line); position:relative; cursor:pointer; flex-shrink:0; transition:.15s; }
.sw.on{ background:var(--found); }
.sw::after{ content:''; position:absolute; left:3px; top:3px; width:23px; height:23px; border-radius:50%; background:#fff; transition:.15s; }
.sw.on::after{ left:24px; }

.link-row{ display:flex; gap:8px; margin-top:11px; }
.link-row input{ flex:1; font-size:12px; background:var(--teal-tint); }
.link-row button{ border:none; border-radius:9px; padding:10px 14px; background:var(--teal); color:#fff; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }

.state{ text-align:center; padding:44px 20px; color:var(--ink-soft); font-size:13px; line-height:1.9; }
.msg{ font-size:12px; margin-top:10px; min-height:16px; }
.msg.err{ color:var(--danger); }
.msg.ok{ color:var(--found); }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="aliascall_hotline_manage.html">←</a>
  <span class="logo">Alias<em>call</em></span>
</div>

<div class="wrap" id="wrap">
  <div class="state">불러오는 중…</div>
</div>

<script>
const SUPABASE_URL = "https://qmwaraittiurkynszjts.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2FyYWl0dGl1cmt5bnN6anRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODQ5OTUsImV4cCI6MjEwMjM2MDk5NX0.9Qr2vFzDCSKS54N6C5QN44BvCzIPTMQyVz7nX3GqT9Y";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ⚠ 서류는 절대 공개 버킷에 올리면 안 됩니다.
//   면허증에는 면허번호·주민등록번호·주소가 들어 있습니다.
//   'aliascall-verify' 버킷을 public=false 로 만들어 두어야 합니다.
const VERIFY_BUCKET = 'aliascall-verify';

let subId = null;
let biz = null;
let cats = [];

async function waitForSession(maxMs = 3000){
  const t0 = Date.now();
  while (Date.now() - t0 < maxMs) {
    const { data: { session } } = await sb.auth.getSession();
    if (session) return session;
    await new Promise((r) => setTimeout(r, 120));
  }
  const { data: { session } } = await sb.auth.getSession();
  return session || null;
}

async function init(){
  const wrap = document.getElementById('wrap');
  const session = await waitForSession();
  if (!session) {
    wrap.innerHTML = '<div class="state">로그인이 필요합니다.<br><a href="aliascall_my_account.html">로그인하러 가기 ›</a></div>';
    return;
  }

  const urlSub = new URLSearchParams(window.location.search).get('sub');
  const { data: subs } = await sb.rpc('my_subscriptions_summary');
  if (!subs || subs.length === 0) {
    wrap.innerHTML = '<div class="state">전문관리용 구독이 없습니다.<br><a href="index.html#msg">상품 보러 가기 ›</a></div>';
    return;
  }
  subId = (urlSub && subs.some((x) => x.id === urlSub)) ? urlSub : subs[0].id;

  try {
    const { data } = await sb.from('business_categories')
      .select('code, label_ko, requires_license, license_name_ko, sort_order').order('sort_order');
    cats = data || [];
  } catch (e) { console.warn('[biz-reg] 업종 조회 실패', e); }

  await load();
}

async function load(){
  const { data, error } = await sb.rpc('get_my_business', { p_subscription_id: subId });
  if (error || !data || !data.ok) {
    document.getElementById('wrap').innerHTML =
      '<div class="state">' + ((data && data.error) || '불러오지 못했습니다.') + '</div>';
    return;
  }
  biz = data;
  render();
}

function render(){
  const wrap = document.getElementById('wrap');
  const cat = cats.find((c) => c.code === biz.category);
  const needLicense = cat ? cat.requires_license : false;
  const docs = biz.docs || [];
  const hasBiz = docs.some((d) => d.docType === 'business_license' && d.status === 'approved');
  const hasLic = docs.some((d) => d.docType === 'professional_license' && d.status === 'approved');

  wrap.innerHTML = '';

  const h = document.createElement('div');
  h.innerHTML = '<h1>📣 업체 공개 등록</h1>' +
    '<div class="desc">상호를 공개 목록에 올려, 아직 모르는 분들이 찾아와 문의하실 수 있게 합니다.<br>' +
    '<b>사업자등록증 확인</b>이 필요하며, 법률·세무·회계·의료 등은 <b>해당 자격증까지</b> 확인합니다.</div>';
  wrap.appendChild(h);

  // ── 업체 정보 ──
  const c1 = document.createElement('div');
  c1.className = 'card';
  c1.innerHTML =
    '<h2>1. 업체 정보</h2>' +
    '<label>상호 <span style="color:var(--danger)">*</span></label>' +
    '<input type="text" id="fName" maxlength="40" placeholder="예: 김상익법률사무소" ' +
    'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' +
    '<div class="hint">⚠ 사업자등록증의 상호와 같아야 합니다. 나중에 바꾸시면 확인을 다시 받으셔야 합니다.</div>' +
    '<label>업종 <span style="color:var(--danger)">*</span></label>' +
    '<select id="fCat"></select>' +
    '<div class="hint" id="catHint"></div>' +
    '<label>소개</label>' +
    '<textarea id="fIntro" maxlength="500" placeholder="어떤 일을 하시는지, 어떤 분들이 찾으시면 좋을지 적어주세요."></textarea>' +
    '<label>지역</label>' +
    '<input type="text" id="fRegion" maxlength="30" placeholder="예: 경기 수원시" ' +
    'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' +
    '<div class="hint">⚠ 상세 주소는 적지 마세요. 시·군·구까지면 충분합니다.</div>' +
    '<label>운영시간</label>' +
    '<input type="text" id="fHours" maxlength="40" placeholder="예: 평일 09:00~18:00" ' +
    'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' +
    '<button type="button" class="btn" id="saveBtn">저장하기</button>' +
    '<div class="msg" id="saveMsg"></div>';
  wrap.appendChild(c1);

  const sel = document.getElementById('fCat');
  sel.innerHTML = '<option value="">— 골라주세요 —</option>';
  cats.forEach((c) => {
    const o = document.createElement('option');
    o.value = c.code; o.textContent = c.label_ko;
    if (c.code === biz.category) o.selected = true;
    sel.appendChild(o);
  });
  document.getElementById('fName').value = biz.name || '';
  document.getElementById('fIntro').value = biz.intro || '';
  document.getElementById('fRegion').value = biz.region || '';
  document.getElementById('fHours').value = biz.hours || '';
  updateCatHint();
  sel.addEventListener('change', updateCatHint);
  document.getElementById('saveBtn').addEventListener('click', save);

  // ── 서류 ──
  const c2 = document.createElement('div');
  c2.className = 'card';
  c2.innerHTML = '<h2>2. 서류 제출</h2>' +
    '<div class="warn">🔒 <b>제출하신 서류는 공개되지 않습니다.</b> 관리자만 확인하며, ' +
    '목록에는 "확인됨" 표시만 붙습니다.<br>' +
    '⚠ 면허증에는 면허번호·주민등록번호가 들어 있으니, ' +
    '<b>가리셔도 되는 부분은 가리고</b> 올려주세요.</div>' +
    '<div id="docList" style="margin-top:12px;"></div>' +
    '<div id="uploadArea" style="margin-top:12px;"></div>' +
    '<div class="msg" id="upMsg"></div>';
  wrap.appendChild(c2);
  renderDocs(needLicense, cat);

  // ── 공개 ──
  const c3 = document.createElement('div');
  c3.className = 'card';
  const canPub = biz.canGoPublic && biz.canGoPublic.ok;
  c3.innerHTML = '<h2>3. 공개하기</h2>';

  const pub = document.createElement('div');
  pub.className = 'pub';
  const pi = document.createElement('div');
  pi.className = 'pi';
  pi.innerHTML = '<div class="pt">공개 목록에 올리기</div>' +
    '<div class="ps">' + (canPub
      ? '준비가 끝났습니다. 켜시면 목록과 배너에 나타납니다.'
      : reasonText(biz.canGoPublic)) + '</div>';
  pub.appendChild(pi);

  const sw = document.createElement('div');
  sw.className = 'sw' + (biz.isPublic ? ' on' : '');
  // ⚠ 관리자 확인 전에는 켤 수 없습니다. 화면뿐 아니라 서버에서도 막습니다.
  if (!canPub && !biz.isPublic) sw.style.opacity = '.4';
  sw.addEventListener('click', () => togglePublic(!biz.isPublic));
  pub.appendChild(sw);
  c3.appendChild(pub);

  if (biz.slug) {
    const lr = document.createElement('div');
    lr.className = 'link-row';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.readOnly = true;
    inp.value = window.location.origin + '/aliascall_business.html?b=' + encodeURIComponent(biz.slug);
    const cp = document.createElement('button');
    cp.type = 'button'; cp.textContent = '복사';
    cp.addEventListener('click', () => {
      navigator.clipboard.writeText(inp.value).then(() => {
        cp.textContent = '복사됨'; setTimeout(() => { cp.textContent = '복사'; }, 1400);
      });
    });
    lr.appendChild(inp); lr.appendChild(cp);
    c3.appendChild(lr);
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.innerHTML = '⭐ <b>이 주소를 직접 알리시는 것이 가장 중요합니다.</b><br>' +
      '블로그 · 인스타그램 · 명함 · 가게 QR에 붙여두세요. 목록보다 이쪽으로 훨씬 많이 들어옵니다.';
    c3.appendChild(hint);
  }

  // 자동 승인
  const auto = document.createElement('div');
  auto.className = 'pub';
  auto.style.marginTop = '16px';
  auto.style.paddingTop = '14px';
  auto.style.borderTop = '1px solid var(--line)';
  const ai = document.createElement('div');
  ai.className = 'pi';
  ai.innerHTML = '<div class="pt">문의를 자동으로 받기</div>' +
    '<div class="ps">켜면 문의가 오는 즉시 대화가 열립니다. ' +
    '끄시면 확인하신 뒤에 열립니다.<br>⚠ 식당·상점은 켜두시는 편이 편하고, ' +
    '법률·의료는 꺼두시는 편이 안전합니다.</div>';
  auto.appendChild(ai);
  const asw = document.createElement('div');
  asw.className = 'sw' + (biz.autoApprove ? ' on' : '');
  asw.addEventListener('click', () => toggleAuto(!biz.autoApprove));
  auto.appendChild(asw);
  c3.appendChild(auto);
  wrap.appendChild(c3);
}

function reasonText(chk){
  if (!chk) return '먼저 업체 정보를 저장해주세요.';
  const r = chk.reason;
  if (r === 'no_name') return '상호를 입력해주세요.';
  if (r === 'no_category') return '업종을 골라주세요.';
  if (r === 'need_business_license') return '사업자등록증을 올려주세요.';
  if (r === 'need_professional_license') return (chk.license_name || '자격증') + '을(를) 올려주세요.';
  if (r === 'pending_review') return '서류를 확인하고 있습니다. 잠시만 기다려주세요.';
  if (r === 'expired') return '구독이 만료되었습니다.';
  return '아직 준비가 끝나지 않았습니다.';
}

function updateCatHint(){
  const code = document.getElementById('fCat').value;
  const c = cats.find((x) => x.code === code);
  const el = document.getElementById('catHint');
  if (!c) { el.textContent = ''; return; }
  el.innerHTML = c.requires_license
    ? '⚠ 이 업종은 <b>' + c.license_name_ko + '</b>까지 확인합니다.'
    : '사업자등록증만 확인합니다.';
}

async function save(){
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('saveMsg');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '저장 중…';
  try {
    const { data, error } = await sb.rpc('set_business_info', {
      p_subscription_id: subId,
      p_name: document.getElementById('fName').value,
      p_category: document.getElementById('fCat').value,
      p_intro: document.getElementById('fIntro').value,
      p_region: document.getElementById('fRegion').value,
      p_hours: document.getElementById('fHours').value,
      p_auto_approve: null,
    });
    if (error) throw error;
    if (!data.ok) { msg.className = 'msg err'; msg.textContent = data.error; btn.disabled = false; return; }
    msg.className = 'msg ok'; msg.textContent = '✓ 저장했습니다.';
    await load();
  } catch (e) {
    console.error('[biz-reg] 저장 실패', e);
    msg.className = 'msg err'; msg.textContent = '저장하지 못했습니다.';
  }
  btn.disabled = false;
}

function renderDocs(needLicense, cat){
  const list = document.getElementById('docList');
  const area = document.getElementById('uploadArea');
  const docs = biz.docs || [];
  list.innerHTML = '';

  const label = { business_license: '사업자등록증',
                  professional_license: (cat && cat.license_name_ko) || '자격증' };
  const stName = { pending: '확인 중', approved: '확인됨', rejected: '반려' };

  docs.forEach((d) => {
    const el = document.createElement('div');
    el.className = 'doc';
    const di = document.createElement('div');
    di.className = 'di';
    const dn = document.createElement('div');
    dn.className = 'dn'; dn.textContent = label[d.docType] || d.docType;
    const ds = document.createElement('div');
    ds.className = 'ds';
    ds.textContent = d.status === 'rejected' && d.rejectReason
      ? ('반려 사유: ' + d.rejectReason)
      : (d.originalName || '');
    di.appendChild(dn); di.appendChild(ds);
    const st = document.createElement('span');
    st.className = 'st ' + d.status;
    st.textContent = stName[d.status] || d.status;
    el.appendChild(di); el.appendChild(st);
    list.appendChild(el);
  });

  // 아직 안 낸(또는 반려된) 서류만 올릴 수 있게 합니다.
  area.innerHTML = '';
  const need = ['business_license'].concat(needLicense ? ['professional_license'] : []);
  need.forEach((type) => {
    const done = docs.some((d) => d.docType === type && d.status !== 'rejected');
    if (done) return;
    const box = document.createElement('label');
    box.className = 'upload';
    box.style.display = 'block';
    box.style.marginBottom = '9px';
    box.innerHTML = '<div class="u1">📎 ' + label[type] + ' 올리기</div>' +
      '<div class="u2">사진 또는 PDF · 10MB 이하</div>';
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*,application/pdf';
    inp.addEventListener('change', () => uploadDoc(type, inp.files[0]));
    box.appendChild(inp);
    area.appendChild(box);
  });
}

async function uploadDoc(docType, file){
  const msg = document.getElementById('upMsg');
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    msg.className = 'msg err'; msg.textContent = '10MB 이하로 올려주세요.'; return;
  }
  msg.className = 'msg'; msg.textContent = '올리는 중…';
  try {
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
    const path = subId + '/' + docType + '_' + Date.now() + '.' + ext;
    // ⚠ 반드시 비공개 버킷입니다. 공개 버킷에 올리면 면허번호가 그대로 노출됩니다.
    const { error: upErr } = await sb.storage.from(VERIFY_BUCKET)
      .upload(path, file, { contentType: file.type || 'application/octet-stream' });
    if (upErr) throw upErr;

    const { error: insErr } = await sb.from('business_verifications').insert({
      subscription_id: subId, doc_type: docType,
      file_path: path, original_name: file.name,
    });
    if (insErr) throw insErr;

    msg.className = 'msg ok'; msg.textContent = '✓ 올렸습니다. 확인까지 하루 이틀 걸립니다.';
    await load();
  } catch (e) {
    console.error('[biz-reg] 업로드 실패', e);
    msg.className = 'msg err';
    msg.textContent = '올리지 못했습니다. 잠시 후 다시 시도해주세요.';
  }
}

async function togglePublic(next){
  try {
    const { data, error } = await sb.rpc('set_business_public', {
      p_subscription_id: subId, p_public: next,
    });
    if (error) throw error;
    if (!data.ok) { alert(reasonText(data)); return; }
    await load();
  } catch (e) {
    console.error('[biz-reg] 공개 전환 실패', e);
    alert('처리하지 못했습니다.');
  }
}

async function toggleAuto(next){
  try {
    const { data, error } = await sb.rpc('set_business_info', {
      p_subscription_id: subId,
      p_name: biz.name, p_category: biz.category, p_intro: biz.intro,
      p_region: biz.region, p_hours: biz.hours, p_auto_approve: next,
    });
    if (error) throw error;
    if (!data.ok) { alert(data.error); return; }
    await load();
  } catch (e) {
    console.error('[biz-reg] 자동승인 변경 실패', e);
    alert('처리하지 못했습니다.');
  }
}

init();
</script>
