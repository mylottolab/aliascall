<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aliascall — 핫라인</title>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="aliascall_e2ee.js"></script>
<script src="aliascall_emoji.js"></script>
<script src="aliascall_image_compress.js"></script>
<script src="aliascall_zoom_lightbox.js"></script>
<script src="aliascall_camera_capture.js"></script>
<script src="aliascall_push.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12302E; --ink-soft:#3E5654; --paper:#B8D3BE; --card:#FFFFFF;
  --teal:#1F6F6B; --teal-deep:#123F3D; --teal-tint:#E4EFEE;
  --coral:#E8734A; --coral-tint:#FDEAE1;
  --line:#DCE3DE; --danger:#C1483A; --found:#2E7D4F;
  --brass:#C9A24B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{ height:100%; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; word-break:keep-all; display:flex; flex-direction:column; }
@media (min-width:760px){ body{ align-items:center; } .app-shell{ max-width:430px; width:100%; box-shadow:0 0 60px rgba(0,0,0,.15); height:100vh; background:var(--paper); display:flex; flex-direction:column; } }
h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; font-weight:600; }
.mono{ font-family:'IBM Plex Mono',monospace; }

.room-header{ padding:14px 18px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.room-title{ font-size:14.5px; font-weight:700; }
.room-meta{ font-size:11px; color:var(--ink-soft); }
#moreMenuBtn{ background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; padding:4px 8px; }

/* 2026-08-22 신설: 더보기 메뉴 */
.more-menu-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; }
.more-menu-overlay.show{ display:block; }
.more-menu-sheet{ position:absolute; top:56px; right:14px; background:var(--card); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.2); overflow:hidden; min-width:170px; }
.more-menu-item{ display:block; width:100%; text-align:left; background:none; border:none; padding:13px 16px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line); }
.more-menu-item:last-child{ border-bottom:none; }
.more-menu-item.close{ color:var(--ink-soft); }

/* 2026-08-22 신설: 목표(D-DAY) 스트립 */
.goals-strip{ display:flex; gap:8px; padding:10px 14px; overflow-x:auto; background:var(--paper); border-bottom:1px solid var(--line); flex-shrink:0; }
.goal-chip{ flex-shrink:0; background:var(--card); border:1.5px solid var(--teal); border-radius:20px; padding:7px 13px; font-size:11.5px; font-weight:700; color:var(--teal-deep); white-space:nowrap; display:flex; align-items:center; gap:6px; }
.goal-chip .goal-days{ font-family:'IBM Plex Mono',monospace; }
.goal-chip .goal-del{ background:none; border:none; color:var(--ink-soft); font-size:11px; cursor:pointer; padding:0 0 0 2px; }
.goal-add-chip{ flex-shrink:0; background:none; border:1.5px dashed var(--line); border-radius:20px; padding:7px 14px; font-size:11.5px; color:var(--ink-soft); cursor:pointer; }

/* 2026-08-22 신설: 답장 미리보기 바 */
.reply-bar{ display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--teal-tint); border-top:1px solid var(--line); }
.reply-bar-content{ flex:1; overflow:hidden; }
.reply-bar-label{ font-size:10.5px; font-weight:700; color:var(--teal-deep); }
.reply-bar-text{ font-size:11.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#replyBarCancel{ background:none; border:none; font-size:14px; color:var(--ink-soft); cursor:pointer; flex-shrink:0; }

#voiceInputBtn{ background:var(--teal-tint); }
#voiceInputBtn.listening{ background:var(--danger); color:#fff; animation:voicePulse 1s ease-in-out infinite; }
@keyframes voicePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.5; } }

/* 2026-08-22 신설: 메시지 작업 메뉴(답장/즐겨찾기/메모/수정/삭제) */
.action-sheet-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:210; align-items:flex-end; }
.action-sheet-overlay.show{ display:flex; }
.action-sheet{ background:var(--card); width:100%; border-radius:16px 16px 0 0; overflow:hidden; padding-bottom:env(safe-area-inset-bottom,0); }
.action-sheet-item{ display:block; width:100%; text-align:left; background:none; border:none; padding:15px 20px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--line); }
.action-sheet-item.danger{ color:var(--danger); }
.action-sheet-item.close{ color:var(--ink-soft); border-bottom:none; }

/* 2026-08-22 신설: 목표 추가 모달 */
.modal-overlay-hl{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:220; align-items:center; justify-content:center; padding:20px; }
.modal-overlay-hl.show{ display:flex; }
.modal-box-hl{ background:var(--card); border-radius:16px; padding:22px; width:100%; max-width:340px; }
.modal-box-hl input{ width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; font-size:13px; margin-bottom:10px; }
.goal-mode-tabs{ display:flex; gap:6px; margin-bottom:16px; }
.goal-mode-tab{ flex:1; border:1.5px solid var(--line); background:var(--card); border-radius:8px; padding:9px 4px; font-size:11px; font-weight:700; cursor:pointer; color:var(--ink-soft); }
.goal-mode-tab.active{ border-color:var(--teal); background:var(--teal-tint); color:var(--teal-deep); }
#goalSaveBtn{ width:100%; background:var(--teal); color:#fff; border:none; border-radius:10px; padding:12px; font-weight:700; font-size:13px; cursor:pointer; margin-bottom:8px; }
.modal-cancel-btn{ width:100%; background:none; border:none; color:var(--ink-soft); padding:8px; font-size:12.5px; cursor:pointer; }

/* 2026-08-22 신설: 즐겨찾기/메모함 패널 */
.panel-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:220; align-items:flex-end; }
.panel-overlay.show{ display:flex; }
.panel-sheet{ background:var(--card); width:100%; max-height:75vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; }
.panel-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; font-weight:700; font-size:14px; border-bottom:1px solid var(--line); }
.panel-close{ background:none; border:none; font-size:16px; color:var(--ink-soft); cursor:pointer; }
.panel-list{ overflow-y:auto; padding:10px 14px; flex:1; }
.panel-empty{ text-align:center; color:var(--ink-soft); font-size:12px; padding:30px 10px; }
.panel-item{ display:flex; align-items:flex-start; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
.panel-item-text{ flex:1; font-size:12.5px; }
.panel-item-meta{ font-size:10px; color:var(--ink-soft); margin-top:3px; }
.panel-item-del{ background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; flex-shrink:0; }
.keep-add-row{ display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--line); }
.keep-add-row input{ flex:1; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:12px; }
.keep-add-row button{ background:var(--teal); color:#fff; border:none; border-radius:10px; padding:0 14px; font-size:12px; font-weight:700; cursor:pointer; }

/* 2026-08-22 신설: 말풍선 안의 답장 인용 미리보기 / 수정됨·삭제됨 표시 / 즐겨찾기 별 */
.bubble-reply-quote{ font-size:10.5px; opacity:.75; border-left:2px solid currentColor; padding:3px 8px; margin-bottom:5px; border-radius:4px; background:rgba(0,0,0,.06); }
.bubble-edited-tag{ font-size:9.5px; opacity:.6; margin-left:4px; }
.bubble-favorite-star{ position:absolute; top:-6px; right:-6px; font-size:11px; }
.chat-bubble{ position:relative; }
.chat-bubble.deleted{ font-style:italic; opacity:.5; }
.bubble-action-trigger{ position:absolute; top:-8px; background:var(--card); border:1px solid var(--line); border-radius:50%; width:22px; height:22px; font-size:12px; cursor:pointer; color:var(--ink-soft); line-height:1; box-shadow:0 1px 4px rgba(0,0,0,.12); }
.chat-bubble.me .bubble-action-trigger{ left:-8px; }
.chat-bubble.them .bubble-action-trigger{ right:-8px; }

.state{ display:none; flex:1; overflow:hidden; flex-direction:column; }
.state.show{ display:flex; }
.loading-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px; }

.chat-messages{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:6px; }
.chat-bubble{ max-width:78%; padding:9px 13px; border-radius:14px; font-size:13px; line-height:1.5; }
.chat-bubble.me{ align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:4px; }
.chat-bubble.them{ align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
.chat-bubble.photo, .chat-bubble.video, .chat-bubble.document{ padding:4px; background:none !important; border:none !important; }
.sender-label{ font-size:10.5px; color:var(--ink-soft); margin:2px 4px; align-self:flex-start; }
.chat-photo{ max-width:180px; max-height:230px; border-radius:12px; display:block; cursor:pointer; object-fit:cover; }
.chat-video{ max-width:200px; border-radius:12px; display:block; }
.chat-doc{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; text-decoration:none; color:var(--ink); font-size:12.5px; max-width:220px; }
.chat-system-note{ align-self:center; font-size:11px; color:var(--ink-soft); background:var(--line); padding:5px 12px; border-radius:12px; margin:4px 0; }
.chat-system-note.partner-divider{ font-weight:700; color:var(--teal-deep); background:none; margin:14px 0 6px; }

.chat-input-row{ display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line); background:var(--card); flex-shrink:0; align-items:center; }
.chat-input-row input[type="text"]{ flex:1; border:1.5px solid var(--line); border-radius:20px; padding:11px 16px; font-size:13.5px; }
.chat-input-row button{ background:var(--teal); color:#fff; border:none; border-radius:50%; width:42px; height:42px; font-size:16px; cursor:pointer; flex-shrink:0; }
#emojiBtn{ background:var(--teal-tint); }

/* 2026-08-22 신설: 이모지 선택 패널 — 애니메이션 GIF 이미지 그리드 */
.emoji-panel{ display:none; flex-direction:column; padding:8px 8px 4px; background:var(--card); border-top:1px solid var(--line); max-height:270px; flex-shrink:0; }
.emoji-panel.show{ display:flex; }
.aliascall-emoji-tabs{ display:flex; gap:2px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px; border-bottom:1px solid var(--line); flex-shrink:0; }
.aliascall-emoji-tab{ background:none; border:none; font-size:17px; padding:5px 9px; border-radius:8px; cursor:pointer; opacity:.45; flex-shrink:0; }
.aliascall-emoji-tab.active{ opacity:1; background:var(--teal-tint); }
.aliascall-emoji-grid{ display:grid; grid-template-columns:repeat(8,1fr); gap:2px; overflow-y:auto; max-height:190px; }
.aliascall-emoji-btn{ background:none; border:none; padding:5px; cursor:pointer; border-radius:8px; line-height:1; font-size:20px; }
.aliascall-emoji-btn img{ width:26px; height:26px; display:block; margin:0 auto; }
.aliascall-emoji-btn:active{ background:var(--teal-tint); }
.aliascall-emoji-credit{ text-align:center; font-size:9px; color:var(--ink-soft); padding:6px 0 2px; flex-shrink:0; }
.emoji-sticker-bubble{ padding:4px !important; display:flex; gap:2px; }
.emoji-sticker{ width:52px; height:52px; }
.call-area{ flex:1; background:var(--teal-deep); display:flex; flex-direction:column; padding:16px; overflow-y:auto; }
.call-status{ text-align:center; color:#fff; font-size:12.5px; margin-bottom:14px; }
.tiles-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.peer-tile{ position:relative; background:rgba(255,255,255,.06); border-radius:12px; overflow:hidden; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; }
.peer-tile video{ width:100%; height:100%; object-fit:cover; }
.peer-tile .avatar-fallback{ font-size:28px; color:rgba(255,255,255,.7); }
.peer-tile .tile-label{ position:absolute; bottom:6px; left:8px; font-size:10.5px; color:#fff; background:rgba(0,0,0,.4); padding:2px 8px; border-radius:10px; }
.local-tile{ position:fixed; bottom:150px; right:20px; width:80px; height:110px; border-radius:10px; overflow:hidden; z-index:60; box-shadow:0 4px 14px rgba(0,0,0,.3); }
.local-tile video{ width:100%; height:100%; object-fit:cover; }

.call-controls{ display:flex; justify-content:center; gap:16px; padding:16px 0; }
.call-btn{ width:52px; height:52px; border-radius:50%; border:none; font-size:20px; cursor:pointer; background:rgba(255,255,255,.15); color:#fff; }
.call-btn.hangup{ background:var(--danger); }
.call-btn.active-off{ background:var(--danger); }

/* 2026-08-22 신설: "같이 듣기" */
.music-area{ flex:1; background:var(--teal-deep); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
#musicEmptyState{ text-align:center; width:100%; max-width:320px; }
#musicUrlInput{ width:100%; box-sizing:border-box; border:1.5px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; border-radius:10px; padding:12px 14px; font-size:12.5px; margin-bottom:10px; }
#musicUrlInput::placeholder{ color:rgba(255,255,255,.4); }
#musicLoadBtn{ width:100%; background:var(--teal); color:#fff; border:none; border-radius:10px; padding:12px; font-weight:700; font-size:13px; cursor:pointer; }
.music-or-divider{ text-align:center; color:rgba(255,255,255,.4); font-size:11px; margin:14px 0; }
.music-file-btn{ width:100%; background:rgba(255,255,255,.1); color:#fff; border:1.5px dashed rgba(255,255,255,.3); border-radius:10px; padding:12px; font-weight:700; font-size:12.5px; cursor:pointer; }
#musicAudioVisual{ width:100%; aspect-ratio:16/9; border-radius:12px; background:rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center; font-size:44px; margin-bottom:12px; }
#musicPlayerWrap{ width:100%; max-width:340px; }
#musicYoutubePlayer{ width:100%; aspect-ratio:16/9; border-radius:12px; overflow:hidden; margin-bottom:12px; }
.music-now{ text-align:center; color:#fff; font-size:11.5px; opacity:.7; margin-bottom:14px; }
.music-controls{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.music-ctrl-btn{ width:44px; height:44px; border-radius:50%; border:none; font-size:16px; cursor:pointer; background:rgba(255,255,255,.15); color:#fff; flex-shrink:0; }
#musicSeekBar{ flex:1; }
.music-change-btn{ width:100%; background:rgba(255,255,255,.1); color:#fff; border:none; border-radius:10px; padding:10px; font-size:12px; cursor:pointer; }

.bottom-nav{ display:flex; background:var(--card); border-top:1.5px solid var(--line); box-shadow:0 -2px 12px rgba(18,48,46,.08); flex-shrink:0; }
.bottom-nav-btn{ flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:9px 2px 8px; font-size:10.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
.bottom-nav-btn .bn-icon{ font-size:19px; line-height:1; }
.bottom-nav-btn.active{ color:var(--teal); }

.lightbox{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:300; align-items:center; justify-content:center; padding:20px; }
.lightbox.show{ display:flex; }
.lightbox img, .lightbox video{ max-width:100%; max-height:85vh; border-radius:8px; }
.lightbox-close{ position:absolute; top:20px; right:20px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:18px; cursor:pointer; }
</style>
</head>
<body>
<div class="app-shell">

<div class="room-header">
  <div>
    <div class="room-title" id="roomTitle">핫라인</div>
    <div class="room-meta" id="roomMeta"></div>
  </div>
  <button type="button" id="moreMenuBtn" title="더보기">⋯</button>
</div>

<!-- 2026-08-22 신설: 더보기 메뉴(즐겨찾기/메모함) -->
<div class="more-menu-overlay" id="moreMenuOverlay">
  <div class="more-menu-sheet">
    <button type="button" class="more-menu-item" id="openFavoritesBtn">⭐ 즐겨찾기 보기</button>
    <button type="button" class="more-menu-item" id="openKeepBtn">📌 내 메모함</button>
    <button type="button" class="more-menu-item close" id="moreMenuCloseBtn">닫기</button>
  </div>
</div>

<div class="state show" id="stateLoading"><div class="loading-state">불러오는 중…</div></div>
<div class="state" id="stateError"><div class="loading-state" id="errorMsg">접근할 수 없습니다.</div></div>

<!-- 2026-08-21 신설: 암호화 상품인데 열쇠(키)가 없을 때 — 직접 입력할 수 있게 함 -->
<div class="state" id="stateKeyNeeded">
  <div class="loading-state" style="text-align:left;">
    <div style="font-size:32px; text-align:center; margin-bottom:10px;">🔒</div>
    <p style="text-align:center; margin-bottom:16px;">이 대화방은 암호화되어 있어요.<br>초대링크에 포함된 열쇠가 필요합니다.</p>
    <input type="text" id="manualKeyInput" placeholder="열쇠(#k= 뒷부분)를 붙여넣으세요" style="width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:10px; padding:12px; font-size:12.5px; margin-bottom:10px;">
    <button id="manualKeySubmitBtn" style="width:100%; background:var(--teal); color:#fff; border:none; border-radius:10px; padding:12px; font-weight:700; cursor:pointer;">입장하기</button>
  </div>
</div>

<div class="state" id="stateChat">
  <!-- 2026-08-22 신설: 목표(D-DAY) 스트립 — 여행/기념일 등 참가자 누구나 등록 가능 -->
  <div class="goals-strip" id="goalsStrip"></div>
  <div class="chat-messages" id="chatMessages"></div>
  <!-- 2026-08-22 신설: 이모지 선택 패널 (무료 유니코드 이모지만 씀 — 카톡 캐릭터 이모티콘 같은
       저작권 있는 건 안 씀) -->
  <div class="emoji-panel" id="emojiPanel"></div>
  <!-- 2026-08-22 신설: 답장/수정 중일 때 보이는 미리보기 바 -->
  <div class="reply-bar" id="replyBar" style="display:none;">
    <div class="reply-bar-content">
      <div class="reply-bar-label" id="replyBarLabel"></div>
      <div class="reply-bar-text" id="replyBarText"></div>
    </div>
    <button type="button" id="replyBarCancel">✕</button>
  </div>
  <div class="chat-input-row">
    <input type="file" id="fileInput" style="display:none;" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip">
    <button type="button" id="attachBtn" title="파일 첨부">📎</button>
    <button type="button" id="cameraBtn" title="사진 촬영">📷</button>
    <button type="button" id="emojiBtn" title="이모지">😊</button>
    <button type="button" id="voiceInputBtn" title="음성으로 입력">🎙️</button>
    <input type="text" id="chatInput" placeholder="메시지 입력…">
    <button id="chatSendBtn">➤</button>
  </div>
</div>

<!-- 2026-08-22 신설: 메시지를 눌렀을 때 나오는 작업 메뉴(답장/즐겨찾기/메모/수정/삭제) -->
<div class="action-sheet-overlay" id="actionSheetOverlay">
  <div class="action-sheet">
    <button type="button" class="action-sheet-item" id="actionReply">↩️ 답장</button>
    <button type="button" class="action-sheet-item" id="actionFavorite">⭐ 즐겨찾기</button>

    // 2026-08-22 신설: "같이 듣기" 현재 재생 상태를 화면에 반영해둠(음악 탭 눌렀을 때 바로 이어짐)
    if (data.music) applyMusicSync({ action: (data.music.youtubeId || data.music.audioUrl) ? 'load-silent' : 'stop', youtubeId: data.music.youtubeId, audioUrl: data.music.audioUrl, positionSeconds: data.music.positionSeconds, isPlaying: data.music.isPlaying, updatedAt: data.music.updatedAt, setByNickname: data.music.setByNickname });

    currentGoals = data.goals || [];
    renderGoalsStrip();
    myFavoriteMessageIds = new Set(data.myFavoriteMessageIds || []);

    for (const m of (data.messages || [])) { await appendChatMessage(m); renderedMsgIds.add(m.id); }

// 2026-08-21 신설: "열쇠 직접 입력" 화면의 입장 버튼 — URL에 열쇠를 붙인 뒤 처음부터 다시 시도함

function subscribeChat(){
  if (chatChannel) { try { sb.removeChannel(chatChannel); } catch (e) {} }
  chatChannel = sb.channel('hotline-' + hotlineId, { config: { broadcast: { self: false } } });
  chatChannel
    .on('broadcast', { event: 'new-message' }, async ({ payload }) => {
      if (renderedMsgIds.has(payload.id)) return;
      renderedMsgIds.add(payload.id);
      await appendChatMessage(payload);
      if (payload.sender_anon_id !== mySenderAnonId) playChatPing();
    })
    .on('broadcast', { event: 'music-sync' }, ({ payload }) => applyMusicSync(payload)) // 2026-08-22 신설
    .on('broadcast', { event: 'message-edited' }, ({ payload }) => applyMessageEdited(payload)) // 2026-08-22 신설
    .on('broadcast', { event: 'message-deleted' }, ({ payload }) => applyMessageDeleted(payload)) // 2026-08-22 신설
    .on('broadcast', { event: 'goal-created' }, ({ payload }) => { currentGoals.push(payload); renderGoalsStrip(); }) // 2026-08-22 신설
    .on('broadcast', { event: 'goal-deleted' }, ({ payload }) => { currentGoals = currentGoals.filter((g) => g.id !== payload.id); renderGoalsStrip(); }) // 2026-08-22 신설
    .subscribe();
}

let currentSegmentIndex = 0; // 2026-08-21: 상대방이 바뀔 때마다 늘어남 — 구간별 배경색 구분에 씀
const SEGMENT_COLORS = ['#FFFFFF', '#EAF3F1', '#FDEFE7', '#F0EDE3', '#E9EEF6']; // 흰색(기본) 포함 5색 순환

let roomIsSecure = false;
let roomKey = null; // CryptoKey 객체 — 암호화 상품일 때만 채워짐

// 2026-08-21 신설: 암호화 파일(사진/동영상/문서)을 내려받아 복호화한 뒤, 화면에 쓸 수 있는
// blob: URL로 만들어서 돌려줌. 암호화 상품이 아니면 원래 URL을 그대로 반환.
async function resolveMediaUrl(url, mimeType){
  if (!roomIsSecure) return url;
  try {
    const res = await fetch(url);
    const encryptedBytes = new Uint8Array(await res.arrayBuffer());
    const decryptedBuf = await e2eeDecryptBytes(roomKey, encryptedBytes);
    const blob = new Blob([decryptedBuf], { type: mimeType || 'application/octet-stream' });
    return URL.createObjectURL(blob);
  } catch (e) {
    console.error('[hotline-room] 파일 복호화 실패', e);
    return null;
  }
}

let messageCache = new Map(); // 2026-08-22 신설: id -> { sender_nickname, sender_anon_id, message_type, previewText, deleted } — 답장 인용에 씀
let myFavoriteMessageIds = new Set();
let replyingToMessageInfo = null; // { id, sender_nickname, previewText } | null
let editingMessageId = null;
let currentActionMessageId = null;

async function appendChatMessage(msg){
  const list = document.getElementById('chatMessages');
  const isMe = msg.sender_anon_id === mySenderAnonId;

  // 2026-08-21 신설: 상대방 교체 표시 — 구간 나누는 선 + 색깔이 여기서부터 바뀜
  if (msg.message_type === 'partner_joined' || msg.message_type === 'partner_left') {
    if (msg.message_type === 'partner_joined') currentSegmentIndex++;
    const sysEl = document.createElement('div');
    sysEl.className = 'chat-system-note partner-divider';
    sysEl.textContent = (msg.message_type === 'partner_joined' ? '─── ' : '─── ') + msg.content + ' ───';
    list.appendChild(sysEl);
    list.scrollTop = list.scrollHeight;
    return;
  }

  if (msg.message_type === 'call_log') {
    const sysEl = document.createElement('div');
    sysEl.className = 'chat-system-note';
    sysEl.textContent = msg.content;
    list.appendChild(sysEl);
    list.scrollTop = list.scrollHeight;
    return;
  }

  if (!isMe) {
    const label = document.createElement('div');
    label.className = 'sender-label';
    label.textContent = msg.sender_nickname;
    list.appendChild(label);
  }

  const el = document.createElement('div');
  el.className = 'chat-bubble ' + (isMe ? 'me' : 'them') + ' ' + msg.message_type;
  el.dataset.messageId = msg.id;
  // 개설자 화면에서만 의미 있음(내 메시지는 항상 같은 색 유지) — 상대방(them) 말풍선만 구간별로 색이 다름
  if (!isMe) el.style.background = SEGMENT_COLORS[currentSegmentIndex % SEGMENT_COLORS.length];

  // 2026-08-22 신설: 삭제된 메시지 — 내용은 안 보여주고 자리만 남겨둠
  if (msg.deleted_at) {
    el.classList.add('deleted');
    el.textContent = '삭제된 메시지입니다';
    messageCache.set(msg.id, { sender_nickname: msg.sender_nickname, sender_anon_id: msg.sender_anon_id, message_type: msg.message_type, previewText: '삭제된 메시지', deleted: true });
    list.appendChild(el);
    list.scrollTop = list.scrollHeight;
    return;
  }

  // 2026-08-22 신설: 답장(꼬리물기) 인용 미리보기
  if (msg.reply_to_message_id) {
    const quoted = messageCache.get(msg.reply_to_message_id);
    const quoteEl = document.createElement('div');
    quoteEl.className = 'bubble-reply-quote';
    quoteEl.textContent = quoted ? (quoted.sender_nickname + ': ' + quoted.previewText) : '(원본 메시지)';
    el.appendChild(quoteEl);
  }

  let previewText = '';

  if (msg.message_type === 'photo') {
    previewText = '📷 사진';
    const img = document.createElement('img');
    img.className = 'chat-photo';
    img.alt = '사진';
    const src = await resolveMediaUrl(msg.content, msg.original_mime_type);
    if (!src) { el.appendChild(document.createTextNode('🔒 복호화 실패 (열쇠가 안 맞는 것 같아요)')); }
    else {
      img.src = src;
      img.addEventListener('click', () => openZoomableLightbox(src));
      el.appendChild(img);
    }
  } else if (msg.message_type === 'video') {
    previewText = '🎥 동영상';
    const src = await resolveMediaUrl(msg.content, msg.original_mime_type);
    if (!src) { el.appendChild(document.createTextNode('🔒 복호화 실패 (열쇠가 안 맞는 것 같아요)')); }
    else {
      const vid = document.createElement('video');
      vid.src = src; vid.className = 'chat-video'; vid.controls = true;
      el.appendChild(vid);
    }
  } else if (msg.message_type === 'document') {
    const fileName = roomIsSecure ? await safeDecryptText(msg.file_name) : (msg.file_name || '문서 파일');
    previewText = '📄 ' + (fileName || '문서');
    // 문서는 클릭하는 순간에 복호화(미리 다 받아두면 낭비라서) — 클릭 핸들러 안에서 처리
    const a = document.createElement('a');
    a.href = 'javascript:void(0)'; a.className = 'chat-doc';
    a.innerHTML = '📄 <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (fileName || '문서 파일') + '</span>';
    a.addEventListener('click', async () => {
      a.style.opacity = '.5';
      const src = await resolveMediaUrl(msg.content, msg.original_mime_type);
      a.style.opacity = '1';
      if (!src) { alert('복호화에 실패했어요.'); return; }
      const dl = document.createElement('a');
      dl.href = src; dl.download = fileName || '문서파일'; dl.click();
    });
    el.appendChild(a);
  } else {
    const text = roomIsSecure ? await safeDecryptText(msg.content) : msg.content;
    previewText = (text || '').slice(0, 40);
    // 2026-08-22 신설: 메시지가 이모지 1~3개로만 이루어져 있으면 큰 애니메이션 스티커로 표시
    const emojiOnly = aliascallExtractEmojiOnly(text);
    if (emojiOnly) {
      el.classList.add('emoji-sticker-bubble');
      el.style.background = 'none';
      emojiOnly.forEach((item) => {
        const img = document.createElement('img');
        img.src = item.url; img.alt = item.char; img.className = 'emoji-sticker';
        img.onerror = () => { img.replaceWith(document.createTextNode(item.char)); };
        el.appendChild(img);
      });
    } else {
      const textSpan = document.createElement('span');
      textSpan.textContent = text;
      el.appendChild(textSpan);
    }
    if (msg.edited_at) {
      const editTag = document.createElement('span');
      editTag.className = 'bubble-edited-tag';
      editTag.textContent = '(수정됨)';
      el.appendChild(editTag);
    }
  }

  // 2026-08-22 신설: 즐겨찾기 별 표시
  if (myFavoriteMessageIds.has(msg.id)) {
    const star = document.createElement('span');
    star.className = 'bubble-favorite-star';
    star.textContent = '⭐';
    el.appendChild(star);
  }

  // 2026-08-22 신설: 메시지 작업 메뉴(답장/즐겨찾기/메모/수정/삭제) 여는 버튼
  const actionBtn = document.createElement('button');
  actionBtn.type = 'button';
  actionBtn.className = 'bubble-action-trigger';
  actionBtn.textContent = '⋯';
  actionBtn.addEventListener('click', (e) => { e.stopPropagation(); openActionSheet(msg.id); });
  el.appendChild(actionBtn);

  list.appendChild(el);
  list.scrollTop = list.scrollHeight;

  messageCache.set(msg.id, { sender_nickname: msg.sender_nickname, sender_anon_id: msg.sender_anon_id, message_type: msg.message_type, previewText, deleted: false });
}

// 복호화 실패해도 화면이 안 깨지게 감싸는 헬퍼
async function safeDecryptText(cipherB64){
  if (!cipherB64) return cipherB64;
  try { return await e2eeDecryptText(roomKey, cipherB64); }
  catch (e) { console.error('[hotline-room] 문자 복호화 실패', e); return '🔒 복호화 실패 (열쇠가 안 맞는 것 같아요)'; }
}

function openLightbox(html){
  document.getElementById('lightboxContent').innerHTML = html;
  document.getElementById('lightbox').classList.add('show');
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !hotlineId) return;
  input.value = '';

  // 2026-08-22 신설: 수정 모드였으면 새 메시지가 아니라 "수정" API를 호출함
  if (editingMessageId) {
    const targetId = editingMessageId;
    cancelEdit();
    try {
      const payloadText = roomIsSecure ? await e2eeEncryptText(roomKey, text) : text;
      const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-message-edit`, {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ messageId: targetId, newContent: payloadText, memberAnonId: accessToken ? undefined : hotlineAnonId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      applyMessageEdited({ id: targetId, content: payloadText, edited_at: data.editedAt });
    } catch (e) {
      console.error('[hotline-room] 수정 실패', e);
      alert('수정하지 못했어요.');
    }
    return;
  }

  const replyToMessageId = replyingToMessageInfo ? replyingToMessageInfo.id : undefined;
  if (replyingToMessageInfo) cancelReply();

  try {
    // 2026-08-21 신설: 암호화 상품이면 서버로 보내기 전에 브라우저에서 먼저 암호화함
    const payloadText = roomIsSecure ? await e2eeEncryptText(roomKey, text) : text;
    const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-message`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ hotlineId, text: payloadText, replyToMessageId, memberAnonId: accessToken ? undefined : hotlineAnonId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    // ⚠ 화면에 바로 보여줄 때도 암호문(payloadText)을 넘김 — appendChatMessage가 암호화 상품이면
    // 항상 복호화를 시도하므로, 평문을 그대로 넘기면 오히려 복호화 실패로 처리됨
    await appendChatMessage({ id: data.messageId, sender_anon_id: mySenderAnonId, sender_nickname: myNickname, message_type: 'text', content: payloadText, reply_to_message_id: replyToMessageId });
    renderedMsgIds.add(data.messageId);
  } catch (e) {
    console.error('[hotline-room] 메시지 전송 실패', e);
    alert('메시지를 보내지 못했어요.');
  }
}
document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);

// ── 답장 ──
function startReply(messageId){
  const cached = messageCache.get(messageId);
  if (!cached) return;
  replyingToMessageInfo = { id: messageId, sender_nickname: cached.sender_nickname, previewText: cached.previewText };
  document.getElementById('replyBarLabel').textContent = '↩️ ' + cached.sender_nickname + '님에게 답장';
  document.getElementById('replyBarText').textContent = cached.previewText;
  document.getElementById('replyBar').style.display = 'flex';
  document.getElementById('chatInput').focus();
}
function cancelReply(){
  replyingToMessageInfo = null;
  document.getElementById('replyBar').style.display = 'none';
}
document.getElementById('replyBarCancel').addEventListener('click', () => { cancelReply(); cancelEdit(); });

// ── 수정 ──
async function startEdit(messageId){
  const el = document.querySelector('[data-message-id="' + messageId + '"]');
  if (!el) return;
  // 화면에 이미 복호화되어 보이는 텍스트를 그대로 가져옴(edited-tag 문구는 제외)
  const clone = el.cloneNode(true);
  clone.querySelectorAll('.bubble-edited-tag, .bubble-reply-quote, .bubble-favorite-star, .bubble-action-trigger').forEach((n) => n.remove());
  const currentText = clone.textContent.trim();
  editingMessageId = messageId;
  document.getElementById('replyBarLabel').textContent = '✏️ 메시지 수정 중';
  document.getElementById('replyBarText').textContent = currentText;
  document.getElementById('replyBar').style.display = 'flex';
  const input = document.getElementById('chatInput');
  input.value = currentText;
  input.focus();
}
function cancelEdit(){
  if (!editingMessageId) return;
  editingMessageId = null;
  document.getElementById('chatInput').value = '';
  document.getElementById('replyBar').style.display = 'none';
}

function applyMessageEdited(payload){
  const el = document.querySelector('[data-message-id="' + payload.id + '"]');
  const cached = messageCache.get(payload.id);
  if (!el || !cached) return;
  (async () => {
    const text = roomIsSecure ? await safeDecryptText(payload.content) : payload.content;
    // 기존 텍스트 span만 갈아끼움(다른 요소는 그대로 둠)
    el.querySelectorAll('.bubble-reply-quote, .bubble-favorite-star, .bubble-action-trigger').forEach((n) => n.dataset.keep = '1');
    Array.from(el.childNodes).forEach((n) => { if (!(n.nodeType === 1 && n.dataset && n.dataset.keep)) n.remove(); });
    const textSpan = document.createElement('span');
    textSpan.textContent = text;
    const editTag = document.createElement('span');
    editTag.className = 'bubble-edited-tag';
    editTag.textContent = '(수정됨)';
    const star = el.querySelector('.bubble-favorite-star');
    const actionBtn = el.querySelector('.bubble-action-trigger');
    if (star) el.insertBefore(textSpan, star); else if (actionBtn) el.insertBefore(textSpan, actionBtn); else el.appendChild(textSpan);
    textSpan.after(editTag);
    cached.previewText = (text || '').slice(0, 40);
  })();
}

function applyMessageDeleted(payload){
  const el = document.querySelector('[data-message-id="' + payload.id + '"]');
  const cached = messageCache.get(payload.id);
  if (el) { el.className = el.className.split(' ')[0] + ' ' + (el.classList.contains('me') ? 'me' : 'them') + ' deleted'; el.innerHTML = ''; el.textContent = '삭제된 메시지입니다'; }
  if (cached) { cached.deleted = true; cached.previewText = '삭제된 메시지'; }
}

// ── 즐겨찾기 ──
async function toggleFavorite(messageId){
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-favorite-toggle`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ messageId, hotlineId, memberAnonId: accessToken ? undefined : hotlineAnonId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    const el = document.querySelector('[data-message-id="' + messageId + '"]');
    if (data.favorited) {
      myFavoriteMessageIds.add(messageId);
      if (el && !el.querySelector('.bubble-favorite-star')) {
        const star = document.createElement('span'); star.className = 'bubble-favorite-star'; star.textContent = '⭐';
        const actionBtn = el.querySelector('.bubble-action-trigger');
        if (actionBtn) el.insertBefore(star, actionBtn); else el.appendChild(star);
      }
    } else {
      myFavoriteMessageIds.delete(messageId);
      const star = el && el.querySelector('.bubble-favorite-star');
      if (star) star.remove();
    }
  } catch (e) { console.error('[hotline-room] 즐겨찾기 처리 실패', e); alert('즐겨찾기 처리에 실패했어요.'); }
}

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-message-delete`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ messageId: id, memberAnonId: accessToken ? undefined : hotlineAnonId }),

    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

  } catch (e) { console.error('[hotline-room] 삭제 실패', e); alert('삭제하지 못했어요.'); }
});

async function loadKeepNotes(){
  const list = document.getElementById('keepList');
  list.innerHTML = '<div class="panel-empty">불러오는 중…</div>';
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-keep-list`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ hotlineId, memberAnonId: accessToken ? undefined : hotlineAnonId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    if (!data.notes || data.notes.length === 0) { list.innerHTML = '<div class="panel-empty">저장한 메모가 없어요.</div>'; return; }
    const rows = await Promise.all(data.notes.map(async (n) => {
      let text;
      if (n.note_text) text = roomIsSecure ? await safeDecryptText(n.note_text) : n.note_text;
      else if (n.hotline_messages) text = n.hotline_messages.sender_nickname + ': ' + (n.hotline_messages.message_type === 'text' ? (roomIsSecure ? await safeDecryptText(n.hotline_messages.content) : n.hotline_messages.content) : '(' + n.hotline_messages.message_type + ')');
      else text = '(삭제된 메시지)';
      return `<div class="panel-item"><div class="panel-item-text">${text}<div class="panel-item-meta">${new Date(n.created_at).toLocaleDateString('ko-KR')}</div></div><button class="panel-item-del" data-note-id="${n.id}">✕</button></div>`;
    }));
    list.innerHTML = rows.join('');
    list.querySelectorAll('.panel-item-del').forEach((btn) => {
      btn.addEventListener('click', async () => {
        await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-keep-delete`, {
          method: 'POST', headers: authHeaders(),
          body: JSON.stringify({ noteId: btn.dataset.noteId, memberAnonId: accessToken ? undefined : hotlineAnonId }),
        });
        loadKeepNotes();
      });
    });
  } catch (e) { console.error('[hotline-room] 메모함 조회 실패', e); list.innerHTML = '<div class="panel-empty">불러오지 못했어요.</div>'; }
}

let currentGoals = [];
function renderGoalsStrip(){
  const strip = document.getElementById('goalsStrip');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const chips = currentGoals.map((g) => {
    const target = new Date(g.target_date); target.setHours(0, 0, 0, 0);
    const diffDays = Math.round((target - today) / 86400000);
    let label;
    if (g.mode === 'countdown') label = diffDays >= 0 ? ('D-' + diffDays) : ('D+' + Math.abs(diffDays));
    else label = diffDays <= 0 ? ('D+' + Math.abs(diffDays)) : ('D-' + diffDays); // countup인데 아직 그날 전이면 역시 D- 로 보여줌
    return `<div class="goal-chip"><span class="goal-days">${label}</span><span>${g.title}</span><button class="goal-del" data-goal-id="${g.id}">✕</button></div>`;
  }).join('');
  strip.innerHTML = chips + '<button type="button" class="goal-add-chip" id="goalAddChip">+ 목표추가</button>';
  document.getElementById('goalAddChip').addEventListener('click', openGoalModal);
  strip.querySelectorAll('.goal-del').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 목표를 삭제할까요?')) return;
      try {
        await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-goal-delete`, {
          method: 'POST', headers: authHeaders(),
          body: JSON.stringify({ goalId: btn.dataset.goalId, memberAnonId: accessToken ? undefined : hotlineAnonId }),
        });
        currentGoals = currentGoals.filter((g) => g.id !== btn.dataset.goalId);
        renderGoalsStrip();
      } catch (e) { console.error('[hotline-room] 목표 삭제 실패', e); }
    });
  });
}

// ── 음성입력(받아쓰기) — 브라우저 내장 Web Speech API, 서버 필요 없음 ──
(function setupVoiceInput(){
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('voiceInputBtn');
  if (!SpeechRecognitionCtor) { btn.style.display = 'none'; return; } // 지원 안 하는 브라우저(주로 구형 Safari)는 버튼 자체를 숨김
  const recognition = new SpeechRecognitionCtor();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.continuous = false;
  let listening = false;

  recognition.addEventListener('result', (e) => {
    const transcript = e.results[0][0].transcript;
    const input = document.getElementById('chatInput');
    input.value = (input.value ? input.value + ' ' : '') + transcript;
  });
  recognition.addEventListener('end', () => { listening = false; btn.classList.remove('listening'); });
  recognition.addEventListener('error', () => { listening = false; btn.classList.remove('listening'); });

  btn.addEventListener('click', () => {
    if (listening) { recognition.stop(); return; }
    try { recognition.start(); listening = true; btn.classList.add('listening'); }
    catch (e) { console.error('[hotline-room] 음성입력 시작 실패', e); }
  });
})();

}

function extractYoutubeId(url){
  const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return match ? match[1] : null;
}

// ── 유튜브/음원파일 공통으로 다루는 재생 제어 함수들 ──
function musicGetCurrentTime(){
  if (musicSourceType === 'youtube') return (ytPlayer && ytPlayer.getCurrentTime) ? ytPlayer.getCurrentTime() : 0;
  if (musicSourceType === 'audio') return musicAudioEl.currentTime || 0;
  return 0;
}
function musicGetDuration(){
  if (musicSourceType === 'youtube') return (ytPlayer && ytPlayer.getDuration) ? ytPlayer.getDuration() : 0;
  if (musicSourceType === 'audio') return musicAudioEl.duration || 0;
  return 0;
}
function musicSeekTo(sec){
  if (musicSourceType === 'youtube' && ytPlayer) ytPlayer.seekTo(sec, true);
  else if (musicSourceType === 'audio') musicAudioEl.currentTime = sec;
}
function musicPlay(){
  if (musicSourceType === 'youtube' && ytPlayer) ytPlayer.playVideo();
  else if (musicSourceType === 'audio') musicAudioEl.play().catch(() => {}); // 브라우저 자동재생 제한 대비
}
function musicPause(){
  if (musicSourceType === 'youtube' && ytPlayer) ytPlayer.pauseVideo();
  else if (musicSourceType === 'audio') musicAudioEl.pause();
}

async function applyMusicSync(payload){
  if (payload.action !== 'stop' && (payload.youtubeId || payload.audioUrl) && musicSourceType === 'youtube' && !ytPlayerReady) {
    pendingMusicState = payload; return; // 유튜브 플레이어가 아직 준비 안 됐으면, 준비되는 대로 적용
  }
  if (payload.action === 'stop' || (!payload.youtubeId && !payload.audioUrl)) {
    currentMusicYoutubeId = null; currentMusicAudioUrl = null; musicSourceType = null;
    document.getElementById('musicPlayerWrap').style.display = 'none';
    document.getElementById('musicEmptyState').style.display = 'block';
    return;
  }

  if (payload.youtubeId && payload.youtubeId !== currentMusicYoutubeId) {
    currentMusicYoutubeId = payload.youtubeId; currentMusicAudioUrl = null; musicSourceType = 'youtube';
    if (!ytPlayerReady) { pendingMusicState = payload; return; }
    ytPlayer.loadVideoById(payload.youtubeId);
    document.getElementById('musicYoutubePlayer').style.display = 'block';
    document.getElementById('musicAudioVisual').style.display = 'none';
    document.getElementById('musicPlayerWrap').style.display = 'block';
    document.getElementById('musicEmptyState').style.display = 'none';
  } else if (payload.audioUrl && payload.audioUrl !== currentMusicAudioUrl) {
    currentMusicAudioUrl = payload.audioUrl; currentMusicYoutubeId = null; musicSourceType = 'audio';
    // 암호화 상품이면 재생 전에 복호화함(사진/동영상 메시지와 같은 방식)
    const src = await resolveMediaUrl(payload.audioUrl, 'audio/mpeg');
    if (src) musicAudioEl.src = src;
    document.getElementById('musicYoutubePlayer').style.display = 'none';
    document.getElementById('musicAudioVisual').style.display = 'flex';
    document.getElementById('musicPlayerWrap').style.display = 'block';
    document.getElementById('musicEmptyState').style.display = 'none';
  }

  document.getElementById('musicNowLabel').textContent = (payload.setByNickname || '누군가') + '님이 튼 노래';

  // 네트워크 지연 보정: 신호를 보낸 시점 이후로 흐른 시간만큼 위치를 앞으로 당겨줌
  let targetPosition = payload.positionSeconds || 0;
  if (payload.isPlaying && payload.updatedAt) {
    const elapsed = (Date.now() - new Date(payload.updatedAt).getTime()) / 1000;
    if (elapsed > 0 && elapsed < 30) targetPosition += elapsed;
  }
  try { if (Math.abs(musicGetCurrentTime() - targetPosition) > 1.5) musicSeekTo(targetPosition); } catch (e) {}

  if (payload.isPlaying) { musicPlay(); document.getElementById('musicPlayPauseBtn').textContent = '⏸️'; isMusicPlaying = true; }
  else { musicPause(); document.getElementById('musicPlayPauseBtn').textContent = '▶️'; isMusicPlaying = false; }
}

async function sendMusicSync(action, extra){
  try {
    await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-music-sync`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ hotlineId, action, memberAnonId: accessToken ? undefined : hotlineAnonId, ...extra }),
    });
  } catch (e) { console.error('[hotline-room] 음악 동기화 실패', e); }
}

document.getElementById('navMusic').addEventListener('click', () => { showState('stateMusic'); updateNavActive('navMusic'); });

document.getElementById('musicLoadBtn').addEventListener('click', async () => {
  const url = document.getElementById('musicUrlInput').value.trim();
  const videoId = extractYoutubeId(url);
  if (!videoId) { alert('올바른 유튜브 링크가 아니에요.'); return; }
  await sendMusicSync('load', { youtubeId: videoId });
  document.getElementById('musicUrlInput').value = '';
});

// 2026-08-22 신설: 음원 파일 직접 올려서 같이 듣기
document.getElementById('musicFileBtn').addEventListener('click', () => document.getElementById('musicFileInput').click());
document.getElementById('musicFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (file.size > 30 * 1024 * 1024) { alert('음원 파일이 너무 커요 (최대 30MB).'); return; }

  const btn = document.getElementById('musicFileBtn');
  const original = btn.textContent;
  btn.textContent = '올리는 중…'; btn.disabled = true;
  try {
    let base64Data;
    if (roomIsSecure) {
      const arrayBuffer = await file.arrayBuffer();
      const encryptedBytes = await e2eeEncryptBytes(roomKey, arrayBuffer);
      base64Data = e2eeBytesToStandardBase64(encryptedBytes);
    } else {
      base64Data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    const uploadRes = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-file-upload`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hotlineId, base64Data, contentType: file.type || 'audio/mpeg', fileName: file.name, fileType: 'audio' }),
    });
    const uploadData = await uploadRes.json();
    if (!uploadRes.ok) throw new Error(uploadData.error);
    await sendMusicSync('load', { audioUrl: uploadData.url });
  } catch (e) {
    console.error('[hotline-room] 음원 업로드 실패', e);
    alert('음원 파일을 올리지 못했어요: ' + (e.message || ''));
  } finally {
    btn.textContent = original; btn.disabled = false;
  }
});

document.getElementById('musicChangeBtn').addEventListener('click', async () => {
  await sendMusicSync('stop', {});
  document.getElementById('musicPlayerWrap').style.display = 'none';
  document.getElementById('musicEmptyState').style.display = 'block';
});

document.getElementById('musicPlayPauseBtn').addEventListener('click', async () => {
  const pos = musicGetCurrentTime();
  await sendMusicSync(isMusicPlaying ? 'pause' : 'play', { positionSeconds: pos });
});

document.getElementById('musicSeekBar').addEventListener('mousedown', () => { musicSeekBarDragging = true; });
document.getElementById('musicSeekBar').addEventListener('touchstart', () => { musicSeekBarDragging = true; });
document.getElementById('musicSeekBar').addEventListener('change', async () => {
  musicSeekBarDragging = false;
  const duration = musicGetDuration() || 100;
  const pos = (document.getElementById('musicSeekBar').value / 100) * duration;
  await sendMusicSync('seek', { positionSeconds: pos });
});

// 재생 중인 사람의 화면에서, 다른 사람이 조작 안 해도 진행바가 자연스럽게 흘러가도록
setInterval(() => {
  if (!musicSourceType || musicSeekBarDragging) return;
  try {
    const cur = musicGetCurrentTime();
    const dur = musicGetDuration();
    if (dur > 0) document.getElementById('musicSeekBar').value = (cur / dur) * 100;
  } catch (e) {}
}, 1000);

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  await uploadAndSendFile(file);
});

function detectFileType(mime){
  if (mime.startsWith('image/')) return 'photo';
  if (mime.startsWith('video/')) return 'video';
  return 'document';
}

async function uploadAndSendFile(file){
  const fileType = detectFileType(file.type);
  // 2026-08-22 신설: 사진이면 업로드 전에 압축(카톡과 비슷한 방식) — 용량 제한에 덜 걸리고 빨라짐
  if (fileType === 'photo') file = await aliascallCompressImage(file);
  const limitMb = fileType === 'video' ? 80 : fileType === 'photo' ? 8 : 20;
  if (file.size > limitMb * 1024 * 1024) { alert(`파일이 너무 커요 (최대 ${limitMb}MB).`); return; }

  try {
    let base64Data;
    if (roomIsSecure) {
      // 2026-08-21 신설: 암호화 상품이면, 업로드 전에 브라우저에서 파일 자체를 암호화함
      const arrayBuffer = await file.arrayBuffer();
      const encryptedBytes = await e2eeEncryptBytes(roomKey, arrayBuffer);
      base64Data = e2eeBytesToStandardBase64(encryptedBytes);
    } else {
      base64Data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    const uploadRes = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-file-upload`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hotlineId, base64Data, contentType: file.type, fileName: file.name, fileType }),
    });
    const uploadData = await uploadRes.json();
    if (!uploadRes.ok) throw new Error(uploadData.error);

    // 파일명도 암호화 상품이면 같이 암호화(문서 목록에 원래 파일명이 그대로 노출되지 않게)
    const fileNamePayload = roomIsSecure ? await e2eeEncryptText(roomKey, file.name) : file.name;

    const msgRes = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-message`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ hotlineId, fileUrl: uploadData.url, fileType, fileName: fileNamePayload, fileSizeBytes: uploadData.fileSizeBytes, originalMimeType: file.type, memberAnonId: accessToken ? undefined : hotlineAnonId }),
    });
    const msgData = await msgRes.json();
    if (!msgRes.ok) throw new Error(msgData.error);

    await appendChatMessage({ id: msgData.messageId, sender_anon_id: mySenderAnonId, message_type: fileType, content: uploadData.url, file_name: fileNamePayload, original_mime_type: file.type });
    renderedMsgIds.add(msgData.messageId);
    showState('stateChat'); updateNavActive('navChat');
  } catch (e) {
    console.error('[hotline-room] 파일 전송 실패', e);
    alert('파일을 보내지 못했어요: ' + (e.message || ''));
  }
}

function updateNavActive(id){
  document.querySelectorAll('.bottom-nav-btn').forEach((b) => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('navChat').addEventListener('click', () => {
  if (activeCall) endCall();
  showState('stateChat'); updateNavActive('navChat');
});
document.getElementById('navVoice').addEventListener('click', () => { showState('stateCall'); updateNavActive('navVoice'); startCall('voice'); });
document.getElementById('navVideo').addEventListener('click', () => { showState('stateCall'); updateNavActive('navVideo'); startCall('video'); });

let activeCall = null;
let localStream = null;
let callChannel = null;
let peers = {};
let isMuted = false;

async function startCall(mode){
  if (activeCall) return;
  activeCall = mode;
  document.getElementById('callStatus').textContent = '연결 중…';
  document.getElementById('tilesGrid').innerHTML = '';
  document.getElementById('muteBtn').textContent = '🎤';
  isMuted = false;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: mode === 'video',
    });
  } catch (e) {
    alert('마이크(또는 카메라) 권한이 필요합니다.');
    activeCall = null;
    showState('stateChat'); updateNavActive('navChat');
    return;
  }

  if (mode === 'video') {
    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('localTile').style.display = 'block';
  }

  callChannel = sb.channel('hotline-call-' + hotlineId, { config: { presence: { key: mySenderAnonId } } });

  callChannel
    .on('presence', { event: 'sync' }, () => {
      const state = callChannel.presenceState();
      Object.keys(state).forEach((anonId) => {
        if (anonId !== mySenderAnonId && !peers[anonId]) connectToPeer(anonId);
      });
    })
    .on('presence', { event: 'leave' }, ({ key }) => { if (key !== mySenderAnonId) removePeer(key); })
    .on('broadcast', { event: 'signal' }, ({ payload }) => {
      if (payload.to !== mySenderAnonId) return;
      handleSignal(payload);
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await callChannel.track({ nickname: myNickname, mode });
        document.getElementById('callStatus').textContent = '통화 중';
      }
    });

  fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-message`, {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({ hotlineId, callLog: (myNickname) + '님이 ' + (mode === 'video' ? '영상' : '음성') + '통화를 시작했어요', memberAnonId: accessToken ? undefined : hotlineAnonId }),
  }).catch(() => {});
}

function connectToPeer(anonId){
  const pc = new RTCPeerConnection(RTC_CONFIG);
  peers[anonId] = { pc, pendingCandidates: [] };

  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

  pc.onicecandidate = (e) => {
    if (e.candidate) callChannel.send({ type: 'broadcast', event: 'signal', payload: { to: anonId, from: mySenderAnonId, kind: 'ice-candidate', candidate: e.candidate } });
  };
  pc.ontrack = (e) => renderPeerTile(anonId, e.streams[0]);
  pc.onconnectionstatechange = () => {
    if (['failed', 'closed'].includes(pc.connectionState)) removePeer(anonId);
  };

  if (mySenderAnonId < anonId) {
    pc.createOffer().then((offer) => pc.setLocalDescription(offer)).then(() => {
      callChannel.send({ type: 'broadcast', event: 'signal', payload: { to: anonId, from: mySenderAnonId, kind: 'offer', sdp: pc.localDescription } });
    });
  }

  ensureTilePlaceholder(anonId);
}

async function handleSignal(payload){
  const { from, kind } = payload;
  if (!peers[from]) {
    const pc = new RTCPeerConnection(RTC_CONFIG);
    peers[from] = { pc, pendingCandidates: [] };
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
    pc.onicecandidate = (e) => { if (e.candidate) callChannel.send({ type: 'broadcast', event: 'signal', payload: { to: from, from: mySenderAnonId, kind: 'ice-candidate', candidate: e.candidate } }); };
    pc.ontrack = (e) => renderPeerTile(from, e.streams[0]);
    pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) removePeer(from); };
    ensureTilePlaceholder(from);
  }

  const entry = peers[from];
  const pc = entry.pc;

  if (kind === 'offer') {
    await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
    for (const c of entry.pendingCandidates) { try { await pc.addIceCandidate(c); } catch (e) {} }
    entry.pendingCandidates = [];
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    callChannel.send({ type: 'broadcast', event: 'signal', payload: { to: from, from: mySenderAnonId, kind: 'answer', sdp: pc.localDescription } });
  } else if (kind === 'answer') {
    if (pc.signalingState === 'have-local-offer') {
      await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
      for (const c of entry.pendingCandidates) { try { await pc.addIceCandidate(c); } catch (e) {} }
      entry.pendingCandidates = [];
    }
  } else if (kind === 'ice-candidate') {
    if (pc.remoteDescription) { try { await pc.addIceCandidate(payload.candidate); } catch (e) {} }
    else entry.pendingCandidates.push(payload.candidate);
  }
}

function ensureTilePlaceholder(anonId){
  if (document.getElementById('tile-' + anonId)) return;
  const tile = document.createElement('div');
  tile.className = 'peer-tile';
  tile.id = 'tile-' + anonId;
  tile.innerHTML = '<div class="avatar-fallback">🎧</div><div class="tile-label">' + (memberNicknames[anonId] || '참가자') + '</div>';
  document.getElementById('tilesGrid').appendChild(tile);
}

function renderPeerTile(anonId, stream){
  const tile = document.getElementById('tile-' + anonId);
  if (!tile) return;
  tile.innerHTML = '';
  if (activeCall === 'video') {
    const vid = document.createElement('video');
    vid.autoplay = true; vid.playsInline = true; vid.srcObject = stream;
    tile.appendChild(vid);
  } else {
    const audioEl = document.createElement('audio');
    audioEl.autoplay = true; audioEl.srcObject = stream;
    tile.appendChild(audioEl);
    const fallback = document.createElement('div');
    fallback.className = 'avatar-fallback'; fallback.textContent = '🎧';
    tile.appendChild(fallback);
  }
  const label = document.createElement('div');
  label.className = 'tile-label'; label.textContent = memberNicknames[anonId] || '참가자';
  tile.appendChild(label);
}

function removePeer(anonId){
  if (peers[anonId]) { try { peers[anonId].pc.close(); } catch (e) {} delete peers[anonId]; }
  const tile = document.getElementById('tile-' + anonId);
  if (tile) tile.remove();
}

async function measureRelayBytes(pc){
  try {
    const stats = await pc.getStats();
    let selectedPairId = null;
    const candidates = {};
    stats.forEach((r) => {
      if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated) selectedPairId = r.id;
      if (r.type === 'local-candidate' || r.type === 'remote-candidate') candidates[r.id] = r;
    });
    if (!selectedPairId) return 0;
    let bytes = 0;
    stats.forEach((r) => {
      if (r.id === selectedPairId) {
        const local = candidates[r.localCandidateId];
        const remote = candidates[r.remoteCandidateId];
        const usedRelay = (local && local.candidateType === 'relay') || (remote && remote.candidateType === 'relay');
        if (usedRelay) bytes = (r.bytesSent || 0) + (r.bytesReceived || 0);
      }
    });
    return bytes;
  } catch (e) { return 0; }
}

async function endCall(){
  if (!activeCall) return;
  const mode = activeCall;

  let totalBytes = 0;
  for (const anonId in peers) {
    totalBytes += await measureRelayBytes(peers[anonId].pc);
    peers[anonId].pc.close();
  }
  peers = {};

  if (totalBytes > 0) {
    fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-report-usage`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hotlineId, reportedByAnonId: mySenderAnonId, bytesRelayed: totalBytes }),
    }).then((r) => r.json()).then((d) => {
      if (d.isOverCap) alert('이 핫라인의 이번 결제주기 사용량 한도를 초과했어요. 추가결제가 필요할 수 있습니다.');
    }).catch(() => {});
  }

  if (callChannel) { try { callChannel.untrack(); sb.removeChannel(callChannel); } catch (e) {} callChannel = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  document.getElementById('localTile').style.display = 'none';
  document.getElementById('tilesGrid').innerHTML = '';
  activeCall = null;

  fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-message`, {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({ hotlineId, callLog: (myNickname) + '님이 ' + (mode === 'video' ? '영상' : '음성') + '통화를 종료했어요', memberAnonId: accessToken ? undefined : hotlineAnonId }),
  }).catch(() => {});
}
document.getElementById('hangupBtn').addEventListener('click', async () => {
  await endCall();
  showState('stateChat'); updateNavActive('navChat');
});
document.getElementById('muteBtn').addEventListener('click', () => {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach((t) => (t.enabled = !isMuted));
  const btn = document.getElementById('muteBtn');
  btn.textContent = isMuted ? '🔇' : '🎤';
  btn.classList.toggle('active-off', isMuted);
});

init();
</script>
