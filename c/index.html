<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aliascall — 코드로 연락하기</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!--
  2026-09-28 신설: aliascall.com/c — 임시연락처 코드 넣는 곳
  명함에 "안 찍히면 aliascall.com/c 에서 코드 입력" 이라고 적혀 있습니다.
  ⚠ 폴더 이름이 c 이고 파일이 index.html 이라 aliascall.com/c 로 열립니다(GitHub Pages).
  ⚠ aliascall.com/c?B7K42Q 처럼 코드를 붙여 오면 바로 찾아 들어갑니다.
-->
<style>
*{ box-sizing:border-box; }
body{ margin:0; background:#B8D3BE; color:#12302E; font-family:'Inter',system-ui,sans-serif; min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:20px; word-break:keep-all; }
.card{ background:#fff; border-radius:20px; padding:28px 22px; max-width:380px; width:100%; text-align:center; }
h1{ font-size:21px; margin:0 0 8px; }
p{ font-size:13.5px; line-height:1.7; color:#3E5654; margin:0 0 18px; }
input{ width:100%; border:2px solid #DCE3DE; border-radius:14px; padding:14px; font-size:26px; font-weight:700; text-align:center;
       letter-spacing:6px; text-transform:uppercase; font-family:'Space Grotesk',monospace; }
input:focus{ outline:none; border-color:#1F6F6B; }
button{ width:100%; margin-top:12px; border:none; border-radius:14px; padding:16px; min-height:52px; font-size:16px; font-weight:800; background:#1F6F6B; color:#fff; cursor:pointer; }
button:disabled{ opacity:.5; }
.err{ display:none; margin-top:12px; font-size:13px; color:#8E2F22; background:#FBEAE7; border-radius:10px; padding:10px; }
.err.show{ display:block; }
small{ display:block; margin-top:16px; font-size:11.5px; color:#5C6664; line-height:1.6; }
</style>
</head>
<body>
<div class="card">
  <h1 id="t">코드로 연락하기</h1>
  <p id="d">받으신 명함이나 메시지의 6자리 코드를 넣어주세요. 앱 설치나 가입은 필요 없습니다.</p>
  <label for="code" style="position:absolute;width:1px;height:1px;overflow:hidden;">코드</label>
  <input id="code" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="B7K42Q">
  <button type="button" id="go">연락하기</button>
  <div class="err" id="err"></div>
  <small id="s">서로의 전화번호는 드러나지 않습니다.</small>
</div>
<script>
const sb = supabase.createClient('https://qmwaraittiurkynszjts.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2FyYWl0dGl1cmt5bnN6anRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODQ5OTUsImV4cCI6MjEwMjM2MDk5NX0.9Qr2vFzDCSKS54N6C5QN44BvCzIPTMQyVz7nX3GqT9Y');
const EN = (localStorage.getItem('aliascall_lang') || navigator.language || '').indexOf('en') === 0;
const TX = EN ? { t:'Contact with a code', d:'Enter the 6-character code from the card or message. No app or sign-up needed.',
                  go:'Contact', bad:'Please check the code — it has 6 letters and numbers.', none:'We could not find that code.',
                  s:'Neither side sees the other’s phone number.' }
              : { t:'코드로 연락하기', d:'받으신 명함이나 메시지의 6자리 코드를 넣어주세요. 앱 설치나 가입은 필요 없습니다.',
                  go:'연락하기', bad:'코드를 확인해주세요. 영문과 숫자 6자리입니다.', none:'그 코드를 찾지 못했습니다. 다시 확인해주세요.',
                  s:'서로의 전화번호는 드러나지 않습니다.' };
document.getElementById('t').textContent = TX.t; document.getElementById('d').textContent = TX.d;
document.getElementById('go').textContent = TX.go; document.getElementById('s').textContent = TX.s;
if (EN) document.documentElement.lang = 'en';

function clean(v){ return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
async function go(){
  const err = document.getElementById('err'); err.classList.remove('show');
  const c = clean(document.getElementById('code').value);
  if (c.length !== 6) { err.textContent = TX.bad; err.classList.add('show'); return; }
  const b = document.getElementById('go'); b.disabled = true;
  try {
    const r = await sb.rpc('temp_card_public', { p_token: null, p_code: c, p_finder: null });
    if (r.error || !r.data || !r.data.token) throw new Error('none');
    location.replace('/aliascall_connect.html?t=' + encodeURIComponent(r.data.token));
  } catch (e) { err.textContent = TX.none; err.classList.add('show'); b.disabled = false; }
}
document.getElementById('go').addEventListener('click', go);
document.getElementById('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
/* aliascall.com/c?B7K42Q 로 왔으면 바로 */
const q = clean(location.search.replace(/^\?/, '').replace(/^code=/i, ''));
if (q.length === 6) { document.getElementById('code').value = q; go(); }
</script>
</body>
</html>
