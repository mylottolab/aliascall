*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; word-break:keep-all; }
@media (min-width:760px){ body{ display:flex; justify-content:center; background:linear-gradient(180deg,#9FC2A6,#B8D3BE); } .app-shell{ max-width:430px; width:100%; box-shadow:0 0 60px rgba(0,0,0,.15); min-height:100vh; background:var(--paper); } }
h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; font-weight:600; }
.mono{ font-family:'IBM Plex Mono',monospace; }

header{ padding:20px 24px 6px; display:flex; align-items:center; gap:9px; }
.back-btn{ background:none; border:none; font-size:18px; color:var(--ink); cursor:pointer; padding:2px 4px 2px 0; }
.brand-mark{ width:28px; height:28px; border-radius:8px; background:var(--teal); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; font-family:'Space Grotesk',sans-serif; }
.brand-name{ font-size:16px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--coral); }

main{ max-width:400px; margin:0 auto; padding:20px 24px 60px; }
.page-title{ font-size:22px; margin-bottom:16px; }

.login-needed{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px; display:none; }
.empty-state{ text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 10px; }

.hl-item{ background:var(--card); border-radius:16px; padding:18px; margin-bottom:16px; }
.hl-item-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.hl-item-callsign{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; color:var(--coral); background:var(--coral-tint); padding:3px 9px; border-radius:14px; }
.hl-item-expiry{ font-size:10.5px; color:var(--ink-soft); }
.hl-item-title{ font-size:16px; font-weight:600; margin-bottom:4px; }
.hl-item-meta{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }

.invite-row{ display:flex; gap:6px; margin-bottom:14px; }
.key-missing-box{ background:rgba(201,162,75,.12); border:1px dashed var(--brass); border-radius:10px; padding:11px 12px; font-size:11.5px; color:var(--ink-soft); margin-bottom:14px; line-height:1.5; }

/* 2026-08-23 신설: 만료 후 파일삭제 예정 경고 배너 */
.expiry-warning{ background:rgba(193,72,58,.1); border:1.5px solid var(--danger); border-radius:12px; padding:13px 14px; margin-bottom:14px; }
.expiry-warning-stage{ font-size:10.5px; font-weight:700; color:var(--danger); margin-bottom:5px; }
.expiry-warning-msg{ font-size:12px; color:var(--ink); line-height:1.5; margin-bottom:10px; }
.expiry-warning-btn{ width:100%; background:var(--danger); color:#fff; border:none; border-radius:8px; padding:9px; font-size:12px; font-weight:700; cursor:pointer; }
.invite-row input{ flex:1; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:11.5px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); background:var(--teal-tint); }
.invite-row button{ background:var(--teal); color:#fff; border:none; border-radius:10px; padding:0 16px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }

.usage-bar-track{ background:var(--line); border-radius:20px; height:6px; overflow:hidden; margin-bottom:4px; }
.usage-bar-fill{ background:var(--teal); height:100%; border-radius:20px; }
.usage-label{ font-size:10.5px; color:var(--ink-soft); margin-bottom:14px; }

.section-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:14px 0 8px; }
.request-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-top:1px solid var(--line); }
.request-nick{ font-size:13px; font-weight:600; }
.request-btns{ display:flex; gap:6px; flex-shrink:0; }
.req-btn{ border:none; border-radius:8px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer; }
.req-btn.approve{ background:var(--found); color:#fff; }
.req-btn.reject{ background:var(--danger); color:#fff; }

.member-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line); font-size:12.5px; }
.member-badge{ font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:8px; background:var(--found-tint); color:var(--found); }

/* 2026-08-25 신설: 언어 전환 버튼 */
.lang-toggle{ margin-left:auto; background:var(--card,#fff); color:inherit; border:1.5px solid var(--line); border-radius:20px; padding:6px 13px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0; }

.sub-badge.danger{ background:#FCE9E6; color:var(--danger); }

.sub-meta b{ color:var(--ink); }
.sub-bar{ height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:12px; }
.sub-bar i{ display:block; height:100%; background:var(--teal); }
.sub-bar i.warn{ background:#D9A441; }
.sub-bar i.danger{ background:var(--danger); }
.sub-tools{ display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; }
.sub-tools input{ flex:1; min-width:140px; border:1.5px solid var(--line); border-radius:9px; padding:9px 11px; font-size:13px; font-family:inherit; }
.sub-tools button{ border:none; border-radius:9px; padding:9px 14px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; background:var(--teal); color:#fff; white-space:nowrap; }
.sub-tools button:disabled{ opacity:.45; cursor:default; }
.sub-tools button.ghost{ background:var(--teal-tint); color:var(--teal-deep); }
.new-room-box{ display:none; background:var(--teal-tint); border-radius:11px; padding:12px; margin-bottom:12px; }
.new-room-box.show{ display:block; }
.new-room-box label{ font-size:11.5px; color:var(--ink-soft); display:block; margin-bottom:5px; }
.new-room-box input{ width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:9px; padding:9px 11px; font-size:13px; font-family:inherit; margin-bottom:8px; }
.room-row{ display:flex; align-items:center; gap:9px; padding:10px 2px; border-top:1px solid var(--line); }
.room-row.dim{ opacity:.55; }
.room-info{ flex:1; min-width:0; }
.room-name{ font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.room-sub{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.room-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.room-dot.on{ background:var(--found,#2E7D4F); }
.room-dot.off{ background:var(--line); }
.room-acts{ display:flex; gap:5px; flex-shrink:0; }
.room-acts button{ border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:6px 9px; font-size:11px; cursor:pointer; font-family:inherit; color:var(--ink); white-space:nowrap; }
.rooms-more{ text-align:center; font-size:12px; color:var(--teal); background:none; border:none; cursor:pointer; padding:10px; width:100%; font-family:inherit; }
.sub-status{ font-size:11.5px; color:var(--ink-soft); min-height:15px; margin-top:6px; }

/* 2026-08-27 신설(v59): 의뢰인에게 보일 이름 */
.set-name-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
.set-name-hint{ font-size:10.5px; color:var(--ink-soft); line-height:1.5; margin-top:4px; }

  if (!iso) return T('roomNever');
  const diff = Date.now() - new Date(iso).getTime();
  const day = Math.floor(diff / 86400000);
  if (day <= 0) return (LANG === 'en') ? 'today' : '오늘';
  if (day === 1) return (LANG === 'en') ? 'yesterday' : '어제';
  if (day < 30) return (LANG === 'en') ? (day + ' days ago') : (day + '일 전');
  const mon = Math.floor(day / 30);
  return (LANG === 'en') ? (mon + ' months ago') : (mon + '개월 전');
}

// 활성 = 최근 N개월 안에 대화가 있었고 접어두지 않은 방
// ⚠ 판정 기준(개월)은 관리자 환경설정에서 바뀔 수 있어 서버 값을 그대로 씁니다.
let activeMonths = 3;
function isRoomActive(r){
  if (r.archived_at) return false;
  if (!r.last_activity_at) return false;
  return (Date.now() - new Date(r.last_activity_at).getTime()) < activeMonths * 30 * 86400000;
}

async function loadSubscriptions(){
  try {
    const { data: setting } = await sb.rpc('get_setting_number', { p_key: 'active_room_months', p_default: 3 });
    if (setting) activeMonths = Number(setting) || 3;
  } catch (e) { /* 기본값 3 사용 */ }

  const { data: subs, error } = await sb.rpc('my_subscriptions_summary');
  if (error) { console.error('[subs] 조회 실패', error); return; }
  subsCache = subs || [];
  if (subsCache.length === 0) { document.getElementById('subsSection').style.display = 'none'; return; }

  // 구독에 속한 방 전부 (한 번에 받아서 화면에서 나눔 — 요청 수를 줄이기 위함)
  const ids = subsCache.map((s) => s.id);
  const { data: rooms } = await sb.from('hotlines')
    .select('id, subscription_id, invite_token, client_label, title, last_activity_at, archived_at, created_at')
    .in('subscription_id', ids)
    .order('last_activity_at', { ascending: false });

  roomsBySub = {};
  (rooms || []).forEach((r) => {
    if (!roomsBySub[r.subscription_id]) roomsBySub[r.subscription_id] = [];
    roomsBySub[r.subscription_id].push(r);
  });

  document.getElementById('subsSection').style.display = 'block';
  renderSubscriptions();
}

function renderSubscriptions(){
  const box = document.getElementById('subsList');
  box.innerHTML = '';
  subsCache.forEach((sub) => box.appendChild(renderSubCard(sub)));
}

function renderSubCard(sub){
  if (!subViewState[sub.id]) subViewState[sub.id] = { keyword: '', showArchived: false, shown: ROOMS_PAGE };
  const st = subViewState[sub.id];

  const limit = (sub.max_rooms || 0) + (sub.extra_rooms || 0);
  const active = sub.active_rooms || 0;
  const expired = new Date(sub.expires_at) < new Date() || sub.status !== 'active';
  const ratio = limit > 0 ? Math.min(100, Math.round(active / limit * 100)) : 0;
  const level = expired ? 'danger' : (ratio >= 100 ? 'danger' : ratio >= 80 ? 'warn' : '');

  const card = document.createElement('div');
  card.className = 'sub-card';

  // ── 머리 ──
  const top = document.createElement('div');
  top.className = 'sub-top';
  const name = document.createElement('div');
  name.className = 'sub-name';
  name.textContent = sub.business_name || proTierLabel(sub.tier);
  top.appendChild(name);
  const badge = document.createElement('span');
  badge.className = 'sub-badge' + (level ? ' ' + level : '');
  badge.textContent = expired ? T('subExpired').split('.')[0] : `${T('subActive')} ${active}/${limit}`;
  top.appendChild(badge);
  card.appendChild(top);

  const meta = document.createElement('div');
  meta.className = 'sub-meta';
  const locale = (LANG === 'en') ? 'en-US' : 'ko-KR';
  meta.innerHTML =
    `<span>${T('subExpires')} <b>${new Date(sub.expires_at).toLocaleDateString(locale)}</b></span>` +
    `<span>${T('subUsage')} <b>${sub.usage_cap_gb}GB</b></span>` +
    `<span>${T('subArchived')} <b>${sub.archived_rooms || 0}</b></span>`;
  card.appendChild(meta);

  const bar = document.createElement('div');
  bar.className = 'sub-bar';
  bar.innerHTML = `<i class="${level}" style="width:${ratio}%"></i>`;
  card.appendChild(bar);

  // ── 2026-08-27(v59): 의뢰인에게 보일 내 이름 ──
  // ⚠ 방마다 따로 받으면 30번 입력해야 하고 실수로 달라질 수 있어, 구독에 한 번만 등록합니다.
  const nameBox = document.createElement('div');
  nameBox.className = 'sub-tools';
  nameBox.style.alignItems = 'flex-start';
  const nameWrap = document.createElement('div');
  nameWrap.style.flex = '1';
  nameWrap.style.minWidth = '150px';
  const nameLbl = document.createElement('div');
  nameLbl.className = 'set-name-label';
  nameLbl.textContent = T('displayNameLabel');
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.maxLength = 20;
  nameInput.placeholder = T('displayNamePlaceholder');
  nameInput.value = sub.display_name || '';
  nameInput.style.width = '100%';
  nameInput.style.boxSizing = 'border-box';
  const nameHint = document.createElement('div');
  nameHint.className = 'set-name-hint';
  nameHint.textContent = T('displayNameHint');
  nameWrap.appendChild(nameLbl); nameWrap.appendChild(nameInput); nameWrap.appendChild(nameHint);
  nameBox.appendChild(nameWrap);
  const nameBtn = document.createElement('button');
  nameBtn.type = 'button'; nameBtn.className = 'ghost';
  nameBtn.textContent = T('displayNameSave');
  nameBtn.addEventListener('click', async () => {
    nameBtn.disabled = true;
    const { data, error } = await sb.rpc('set_subscription_display_name', {
      p_subscription_id: sub.id, p_name: nameInput.value,
    });
    if (error || !data?.ok) { alert(data?.error || T('archiveFail')); nameBtn.disabled = false; return; }
    sub.display_name = data.display_name;
    nameHint.textContent = T('displayNameSaved');
    setTimeout(() => { nameHint.textContent = T('displayNameHint'); }, 1500);
    nameBtn.disabled = false;
  });
  nameBox.appendChild(nameBtn);
  card.appendChild(nameBox);

  // ── 도구줄 ──
  const tools = document.createElement('div');
  tools.className = 'sub-tools';

  const search = document.createElement('input');
  search.type = 'text';
  search.placeholder = T('roomSearch');
  search.value = st.keyword;
  search.addEventListener('input', () => {
    st.keyword = search.value;
    st.shown = ROOMS_PAGE;
    redrawRooms(sub, card);
  });
  tools.appendChild(search);

  const newBtn = document.createElement('button');
  newBtn.type = 'button';
  newBtn.textContent = T('newRoomBtn');
  newBtn.disabled = expired || active >= limit;
  tools.appendChild(newBtn);

  if (expired) {
    const renew = document.createElement('button');
    renew.type = 'button'; renew.className = 'ghost';
    renew.textContent = T('renewSub');
    renew.addEventListener('click', () => { window.location.href = `aliascall_hotline_purchase.html?tier=${sub.tier}`; });
    tools.appendChild(renew);
  }
  card.appendChild(tools);

  // ── 새 방 만들기 ──
  const nb = document.createElement('div');
  nb.className = 'new-room-box';
  nb.innerHTML =
    `<label>${T('newRoomLabel')}</label>` +
    `<input type="text" placeholder="${T('newRoomPlaceholder')}" maxlength="40">`;
  const nbActs = document.createElement('div');
  nbActs.className = 'sub-tools';
  const okBtn = document.createElement('button');
  okBtn.type = 'button'; okBtn.textContent = T('newRoomCreate');
  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button'; cancelBtn.className = 'ghost'; cancelBtn.textContent = T('newRoomCancel');
  nbActs.appendChild(okBtn); nbActs.appendChild(cancelBtn);
  nb.appendChild(nbActs);
  card.appendChild(nb);

  newBtn.addEventListener('click', () => {
    nb.classList.add('show');
    nb.querySelector('input').focus();
  });
  cancelBtn.addEventListener('click', () => nb.classList.remove('show'));

  const status = document.createElement('div');
  status.className = 'sub-status';

  okBtn.addEventListener('click', async () => {
    okBtn.disabled = true;
    status.textContent = T('loading');
    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-room-create`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ subscriptionId: sub.id, clientLabel: nb.querySelector('input').value.trim() }),
      });
      const data = await res.json();
      if (!res.ok) {
        // ⚠ 서버가 reason을 함께 주므로 안내를 갈라서 보여줍니다.
        status.textContent = (data.reason === 'room_limit') ? T('limitFull')
                           : (data.reason === 'expired') ? T('subExpired')
                           : (data.error || T('createFail'));
        okBtn.disabled = false;
        return;
      }
      nb.classList.remove('show');
      nb.querySelector('input').value = '';
      status.textContent = '';
      await loadSubscriptions();
    } catch (e) {
      console.error('[subs] 방 생성 실패', e);
      status.textContent = T('createFail');
    }
    okBtn.disabled = false;
  });

  const roomsBox = document.createElement('div');
  roomsBox.className = 'rooms-box';
  card.appendChild(roomsBox);
  card.appendChild(status);

  drawRooms(sub, roomsBox);
  return card;
}

function redrawRooms(sub, card){
  drawRooms(sub, card.querySelector('.rooms-box'));
}

function drawRooms(sub, box){
  const st = subViewState[sub.id];
  const all = roomsBySub[sub.id] || [];
  box.innerHTML = '';

  if (all.length === 0) {
    const e = document.createElement('div');
    e.className = 'sub-status';
    e.textContent = T('roomsNone');
    box.appendChild(e);
    return;
  }

  const kw = st.keyword.trim().toLowerCase();
  let list = all.filter((r) => {
    if (!st.showArchived && r.archived_at) return false;
    if (!kw) return true;
    return String(r.client_label || r.title || '').toLowerCase().includes(kw);
  });

  if (list.length === 0) {
    const e = document.createElement('div');
    e.className = 'sub-status';
    e.textContent = T('roomsNoMatch');
    box.appendChild(e);
  }

  list.slice(0, st.shown).forEach((r) => box.appendChild(renderRoomRow(sub, r)));

  if (list.length > st.shown) {
    const more = document.createElement('button');
    more.type = 'button'; more.className = 'rooms-more';
    more.textContent = `+ ${list.length - st.shown}`;
    more.addEventListener('click', () => { st.shown += ROOMS_PAGE; drawRooms(sub, box); });
    box.appendChild(more);
  }

  const archivedCount = all.filter((r) => r.archived_at).length;
  if (archivedCount > 0) {
    const tog = document.createElement('button');
    tog.type = 'button'; tog.className = 'rooms-more';
    tog.textContent = st.showArchived ? T('hideArchived') : `${T('showArchived')} (${archivedCount})`;
    tog.addEventListener('click', () => { st.showArchived = !st.showArchived; st.shown = ROOMS_PAGE; drawRooms(sub, box); });
    box.appendChild(tog);
  }
}

function renderRoomRow(sub, r){
  const row = document.createElement('div');
  row.className = 'room-row' + (r.archived_at ? ' dim' : '');

  const dot = document.createElement('span');
  dot.className = 'room-dot ' + (isRoomActive(r) ? 'on' : 'off');
  row.appendChild(dot);

  const info = document.createElement('div');
  info.className = 'room-info';
  const nm = document.createElement('div');
  nm.className = 'room-name';
  nm.textContent = r.client_label || r.title || T('roomUnnamed');
  const sb2 = document.createElement('div');
  sb2.className = 'room-sub';
  sb2.textContent = `${T('roomLastTalk')} ${relTime(r.last_activity_at)}`
    + (r.archived_at ? ` · ${T('subArchived')}` : '');
  info.appendChild(nm); info.appendChild(sb2);
  row.appendChild(info);

  const acts = document.createElement('div');
  acts.className = 'room-acts';

  const openBtn = document.createElement('button');
  openBtn.type = 'button'; openBtn.textContent = T('roomOpen');
  openBtn.addEventListener('click', () => {
    window.location.href = `aliascall_hotline_room.html?hotline=${r.id}`;
  });
  acts.appendChild(openBtn);

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button'; copyBtn.textContent = T('roomCopy');
  copyBtn.addEventListener('click', () => {
    const url = `${window.location.origin}/aliascall_hotline_join.html?t=${r.invite_token}`;
    navigator.clipboard.writeText(url).then(() => {
      const o = copyBtn.textContent;
      copyBtn.textContent = T('copied');
      setTimeout(() => { copyBtn.textContent = o; }, 1400);
    });
  });
  acts.appendChild(copyBtn);

  const renameBtn = document.createElement('button');
  renameBtn.type = 'button'; renameBtn.textContent = T('roomRename');
  renameBtn.addEventListener('click', async () => {
    const v = prompt(T('renamePrompt'), r.client_label || '');
    if (v === null) return;
    const { data, error } = await sb.rpc('set_room_label', { p_hotline_id: r.id, p_label: v });
    if (error || !data?.ok) { alert(data?.error || T('archiveFail')); return; }
    r.client_label = v.trim() || null;
    nm.textContent = r.client_label || T('roomUnnamed');
  });
  acts.appendChild(renameBtn);

  const arcBtn = document.createElement('button');
  arcBtn.type = 'button';
  arcBtn.textContent = r.archived_at ? T('roomUnarchive') : T('roomArchive');
  arcBtn.addEventListener('click', async () => {
    const next = !r.archived_at;
    const { data, error } = await sb.rpc('set_room_archived', { p_hotline_id: r.id, p_archived: next });
    if (error || !data?.ok) { alert(data?.error || T('archiveFail')); return; }
    await loadSubscriptions();
  });
  acts.appendChild(arcBtn);

  row.appendChild(acts);
  return row;
}

async function loadHotlines(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { document.getElementById('loginNeeded').style.display = 'block'; document.getElementById('content').style.display = 'none'; return; }

  // 2026-08-26(v51): 전문관리용 구독을 먼저 그림
  await loadSubscriptions();

  // ⚠ 구독에 속한 방(subscription_id 있음)은 위 구독 카드 안에 들어가므로 여기서 제외합니다.
  //   기존 8종만 이 목록에 남습니다.
  const { data: hotlines, error } = await sb.from('hotlines').select('*')
    .eq('owner_user_id', session.user.id).is('subscription_id', null)
    .order('created_at', { ascending: false });
  const listEl = document.getElementById('hlList');
  const legacyHead = document.getElementById('legacyHead');
  if (error) { listEl.innerHTML = '<div class="empty-state">' + T('loadFail') + error.message + '</div>'; return; }
  if (!hotlines || hotlines.length === 0) {
    // 구독이 있으면 "핫라인이 없다"는 안내가 오히려 혼란스러우므로 목록 자체를 숨깁니다.
    listEl.innerHTML = subsCache.length > 0 ? '' : '<div class="empty-state">' + T('empty') + '</div>';
    legacyHead.style.display = 'none';
    return;
  }
  legacyHead.style.display = subsCache.length > 0 ? 'block' : 'none';

  const html = await Promise.all(hotlines.map((h) => renderHotlineItem(h)));
  listEl.innerHTML = html.join('');
  wireHotlineItems();
}

async function renderHotlineItem(h){
  const [{ data: members }, { data: requests }] = await Promise.all([
    sb.from('hotline_members').select('*').eq('hotline_id', h.id).eq('status', 'approved'),
    sb.from('hotline_join_requests').select('*').eq('hotline_id', h.id).eq('status', 'pending').order('requested_at', { ascending: true }),
  ]);

  const usagePercent = h.usage_cap_gb > 0 ? Math.min(100, Math.round((h.usage_used_gb / h.usage_cap_gb) * 100)) : 0;
  const expiresLabel = new Date(h.expires_at).toLocaleDateString(LANG === 'en' ? 'en-US' : 'ko-KR', { year: 'numeric', month: 'numeric', day: 'numeric' });

  // 2026-08-23 신설: 만료됐는데 아직 연장 안 한 핫라인 — 30일 뒤 파일 자동삭제 예정 안내
  // (3단계로 나눠서, 시간이 갈수록 더 급하게 알림 — 카톡 "구독 3회 알림"과 비슷한 취지)
  const daysSinceExpiry = Math.floor((Date.now() - new Date(h.expires_at).getTime()) / 86400000);
  let expiryWarningHtml = '';
  if (daysSinceExpiry >= 0 && daysSinceExpiry < 30) {
    const daysLeft = 30 - daysSinceExpiry;
    let stage, message;
    // 2026-08-25: 남은 일수가 문장 중간에 들어가 어순이 달라지므로 언어별로 따로 씀
    const dayWord = daysLeft === 1 ? 'day' : 'days';
    if (daysSinceExpiry < 10) {
      stage = T('stage1');
      message = (LANG === 'en')
        ? `This hotline has expired. If you don't renew within ${daysLeft} ${dayWord}, the photos, videos and voice files shared so far will be deleted.`
        : `핫라인이 만료됐어요. ${daysLeft}일 안에 연장하지 않으면 그동안의 사진·동영상·음성 파일이 삭제됩니다.`;
    } else if (daysSinceExpiry < 20) {
      stage = T('stage2');
      message = (LANG === 'en')
        ? `You still haven't renewed. Your files will be deleted in ${daysLeft} ${dayWord}.`
        : `아직 연장하지 않으셨어요. ${daysLeft}일 후 파일이 삭제됩니다.`;
    } else {
      stage = T('stage3');
      message = (LANG === 'en')
        ? `Your files will be permanently deleted in ${daysLeft} ${dayWord}. Renew now if you want to keep them.`
        : `${daysLeft}일 후 파일이 영구 삭제됩니다. 보관하고 싶으시면 지금 연장해주세요.`;
    }
    expiryWarningHtml = `
      <div class="expiry-warning">
        <div class="expiry-warning-stage">${stage}</div>
        <div class="expiry-warning-msg">${message}</div>
        <button class="expiry-warning-btn" onclick="location.href='aliascall_hotline_purchase.html?tier=${h.tier}'">${T('renewBtn')}</button>
      </div>`;
  }

  // 2026-08-21 신설: 암호화(Secure) 상품 여부에 따라 링크 구성이 달라짐 — 암호화 상품은
  // 이 브라우저에 저장해둔 열쇠(localStorage)가 있어야 완전한 링크를 만들 수 있음
  const secure = h.tier.endsWith('_secure');
  const cachedKey = secure ? (localStorage.getItem('aliascall_hotline_key_' + h.id) || '') : '';
  const inviteUrl = secure
    ? (cachedKey ? `${window.location.origin}/aliascall_hotline_join.html?t=${h.invite_token}#k=${cachedKey}` : '')
    : `${window.location.origin}/aliascall_hotline_join.html?t=${h.invite_token}`;
  const roomUrl = secure
    ? (cachedKey ? `aliascall_hotline_room.html?hotline=${h.id}#k=${cachedKey}` : '')
    : `aliascall_hotline_room.html?hotline=${h.id}`;

  const requestsHtml = (requests || []).length === 0 ? '' : `
    <div class="section-label">${LANG === 'en' ? `📋 Pending (${requests.length})` : `📋 대기 중 (${requests.length}명)`}</div>
    ${requests.map((r) => `
      <div class="request-row">
        <span class="request-nick">${r.nickname}</span>
        <span class="request-btns">
          <button class="req-btn approve" data-action="approve" data-req="${r.id}" data-hotline="${h.id}">${T('approve')}</button>
          <button class="req-btn reject" data-action="reject" data-req="${r.id}" data-hotline="${h.id}">${T('reject')}</button>
        </span>
      </div>
    `).join('')}
  `;

  const membersHtml = (members || []).length === 0 ? '' : `
    <div class="section-label">${LANG === 'en' ? 'Participants' : '참가자'} (${members.length}/${h.max_participants})</div>
    ${members.map((m) => `
      <div class="member-row">
        <span style="flex:1;">${m.nickname}</span>
        ${m.role === 'owner' ? `<span class="member-badge">${T('ownerBadge')}</span>` : (h.tier === 'hotline_everybody' ? `<button class="req-btn reject" data-action="remove-member" data-hotline="${h.id}" data-anon="${m.member_anon_id}" data-nick="${m.nickname}">${T('removeBtn')}</button>` : '')}
      </div>
    `).join('')}
  `;

  // 암호화 상품인데 이 브라우저에 저장된 키가 없으면 — 링크/입장 버튼 대신 키 입력창을 보여줌
  const linkSectionHtml = (secure && !cachedKey) ? `
    <div class="key-missing-box">
      ${T('keyMissing')}
      <div class="invite-row" style="margin-top:8px;">
        <input type="text" placeholder="${T('keyPlaceholder')}" data-key-input="${h.id}">
        <button data-action="save-key" data-hotline="${h.id}">${T('keySave')}</button>
      </div>
    </div>
  ` : `
    <div class="invite-row">
      <input type="text" readonly value="${inviteUrl}">
      <button data-action="copy-invite" data-url="${inviteUrl}">${T('copy')}</button>
    </div>
    <button class="req-btn approve" style="width:100%; margin-bottom:12px; padding:9px;" onclick="window.location.href='${roomUrl}'">${T('openRoom')}</button>
  `;

  return `
    <div class="hl-item" data-hotline-id="${h.id}">
      <div class="hl-item-head">
        <span class="hl-item-callsign">${tierLabel(h.tier)}</span>
        <span class="hl-item-expiry">~${expiresLabel}</span>
      </div>
      <div class="hl-item-title">${h.title || tierLabel(h.tier)}</div>
      <div class="hl-item-meta">${(members || []).length} / ${h.max_participants}${LANG === 'en' ? ' joined' : '명 참가 중'}</div>

      ${expiryWarningHtml}

      ${linkSectionHtml}

      <div class="usage-bar-track"><div class="usage-bar-fill" style="width:${usagePercent}%;"></div></div>
      <div class="usage-label">${LANG === 'en' ? 'Usage' : '사용량'} ${h.usage_used_gb.toFixed(1)}GB / ${h.usage_cap_gb}GB (${usagePercent}%)</div>

      ${requestsHtml}
      ${membersHtml}
    </div>
  `;
}

function wireHotlineItems(){
  document.querySelectorAll('[data-action="copy-invite"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.url).then(() => {
        const original = btn.textContent;
        btn.textContent = T('copied');
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    });
  });

  // 2026-08-21 신설: 암호화 상품의 열쇠(키)를 이 브라우저에 저장 — 다른 기기/브라우저에서
  // 처음 접속했을 때, 결제 성공시 받았던 키를 여기 붙여넣으면 초대링크/대화방이 다시 열림
  document.querySelectorAll('[data-action="save-key"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.querySelector(`[data-key-input="${btn.dataset.hotline}"]`);
      const key = (input.value || '').trim().replace(/^#?k=/, ''); // 혹시 전체 링크를 통째로 붙여넣어도 되게, k= 부분만 추출
      if (!key) { alert(T('alertNeedKey')); return; }
      localStorage.setItem('aliascall_hotline_key_' + btn.dataset.hotline, key);
      loadHotlines();
    });
  });

  document.querySelectorAll('[data-action="approve"], [data-action="reject"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const decision = btn.dataset.action === 'approve' ? 'approve' : 'reject';
      btn.disabled = true;
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-decide-join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
          body: JSON.stringify({ requestId: btn.dataset.req, decision }),
        });
        const data = await res.json();
        if (!res.ok) { alert(T('alertActionFail')); btn.disabled = false; return; }
        loadHotlines(); // 목록 새로고침
      } catch (e) {
        console.error('[hotline] 승인/거절 실패', e);
        alert(T('alertActionFailRetry'));
        btn.disabled = false;
      }
    });
  });

  // 2026-08-21 신설: "상대방 내보내기" — 핫라인 에브리바디(상대방 교체) 기능
  document.querySelectorAll('[data-action="remove-member"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const confirmMsg = (LANG === 'en')
    ? `Remove ${btn.dataset.nick}? A new invite link will be issued and the old one will stop working.`
    : `${btn.dataset.nick}님을 내보내시겠어요? 초대 링크가 새로 발급되며, 예전 링크는 더 이상 쓸 수 없습니다.`;
  if (!confirm(confirmMsg)) return;
      btn.disabled = true;
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-remove-member`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
          body: JSON.stringify({ hotlineId: btn.dataset.hotline, memberAnonId: btn.dataset.anon }),
        });
        const data = await res.json();
        if (!res.ok) { alert(T('alertActionFail')); btn.disabled = false; return; }
        alert(T('alertRemoved'));
        loadHotlines();
      } catch (e) {
        console.error('[hotline] 상대방 내보내기 실패', e);
        alert(T('alertActionFailRetry'));
        btn.disabled = false;
      }
    });
  });
}

// 새 신청이 들어오면 실시간으로 목록 갱신
async function subscribeJoinRequests(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  sb.channel('hotline-manage-requests')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'hotline_join_requests' }, () => {
      loadHotlines(); // RLS가 "내 핫라인" 것만 걸러서 전달해줌
    })
    .subscribe();
}

(async () => {
  await loadHotlines();
  subscribeJoinRequests();
})();
</script>
