  $('gUp').onclick = function(){ move(-1); }; $('gDn').onclick = function(){ move(1); };
}
async function galUpload(fs){
  var room = SHMAX - SH.length; if (fs.length > room) { toast(room + '장까지 더 올릴 수 있어요. 앞의 ' + room + '장만 올려요.'); fs = fs.slice(0, room); }
  var b = $('gAdd'); b.disabled = true; var done = 0;
  for (var i = 0; i < fs.length; i++) {
    b.textContent = '올리는 중… ' + (i + 1) + ' / ' + fs.length;
    try {
      var img = await new Promise(function(res, rej){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = rej; im.src = URL.createObjectURL(fs[i]); });
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var blob = await new Promise(function(res){ c.toBlob(res, 'image/jpeg', 0.85); });
      var path = ME.id + '/g-' + DK.id.slice(0, 8) + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6) + '.jpg';
      var up = await sb.storage.from('dangol').upload(path, blob, { contentType: 'image/jpeg' }); if (up.error) throw up.error;
      var r = await rpc('dg_shot_add', { p_desk: DK.id, p_path: path, p_span: (SH.length + done === 0 ? '2x2' : '1x1'), p_caption: null });
      if (!r.ok) throw r; done++;
    } catch (e) { toast(e && e.error === 'gallery_full' ? '갤러리가 가득 찼어요.' : '사진을 올리지 못했어요: ' + ((e && (e.message || e.error)) || '')); break; }
  }
  if (done) toast(done + '장을 올렸어요. 손님 화면에 바로 보여요. 사진을 누르면 크기를 바꿀 수 있어요.');
  gallery();
}

/* ── 가게 꾸미기 ───────────────────────────────────────── */
var PHOTO = undefined;
function settings(){
  if (poll) clearInterval(poll);
  var d = DK; if (FAQ === null) FAQ = (d.items || []).slice(); if (PHOTO === undefined) PHOTO = d.photo || '';
  var rows = FAQ.length ? FAQ : [{ q: '영업시간이 어떻게 되나요?', a: '' }, { q: '주차할 수 있나요?', a: '' }, { q: '예약은 어떻게 하나요?', a: '' }];
  $('pane').innerHTML = '<div class="card"><b class="h">📷 가게 사진</b>' + (PHOTO ? '<img class="photo" src="' + esc(photoUrl(PHOTO)) + '" alt="가게 사진">' : '<p>가게 앞 · 간판 · 대표 메뉴 사진을 올리면 손님이 믿고 물어봐요.</p>') +
      '<input type="file" id="ph" accept="image/*"></div>' +
    '<div class="card"><b class="h">🏪 가게 소개</b><label>가게 이름 *</label><input id="sn" maxlength="30">' +
      '<label>업종</label><select id="sc">' + CATS.map(function(c){ return '<option' + (c === d.category ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
      addrBlock('sa', d.address, d.address_detail) +
      '<label>소개</label><textarea id="si" maxlength="400"></textarea>' +
      '<div class="row"><div><label>영업시간</label><input id="sh" maxlength="80"></div><div><label>지역</label><input id="sr" maxlength="40"></div></div></div>' +
    '<div class="card"><b class="h">📢 가게 공지 · ⏰ 자동 답장</b>' +
      '<label>가게 공지 한 줄 (손님 화면 맨 위 · 비우면 안 보여요)</label><input id="xn" maxlength="100" placeholder="예) 오늘 재료 소진으로 6시 마감합니다">' +
      '<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="xb" style="width:auto"> 🔕 <b>지금 바쁨</b> — 손님이 물으면 자동으로 안내해요</label>' +
      '<textarea id="xbm" maxlength="200" style="min-height:56px" placeholder="(비우면) 지금 손님이 많아 답이 조금 늦을 수 있어요. 문의는 잘 받았어요. 곧 답해 드릴게요!"></textarea>' +
      '<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="xh" style="width:auto"> 🌙 <b>영업시간 밖</b>에는 자동으로 안내해요</label>' +
      '<div class="row"><div><label>여는 시각</label><input id="xo" type="time"></div><div><label>닫는 시각</label><input id="xc" type="time"></div></div>' +
      '<label>쉬는 요일</label><div class="row" id="xd" style="gap:6px">' + ['일','월','화','수','목','금','토'].map(function(n, i){ return '<label style="flex:none;display:flex;gap:4px;align-items:center;color:var(--ink);font-weight:700"><input type="checkbox" value="' + i + '" style="width:auto">' + n + '</label>'; }).join('') + '</div>' +
      '<textarea id="xom" maxlength="200" style="min-height:56px" placeholder="(비우면) 지금은 영업시간이 아니에요 (11:00~21:00). 문의는 잘 받았고, 영업시간에 답해 드릴게요."></textarea>' +
      '<p style="font-size:13px">자동 안내는 같은 손님에게 3시간에 한 번만 나가요. 문의는 그대로 받은편지함에 남으니 나중에 답해 주세요.</p></div>' +
    '<div class="card"><b class="h">🙋 자주 묻는 질문</b><p>손님이 묻기 전에 먼저 보는 답이에요. 같은 질문에 여러 번 답하지 않으셔도 됩니다. (30개까지)</p>' +
      '<label>인사말 (선택)</label><textarea id="sg" maxlength="200" style="min-height:60px" placeholder="예) 어서 오세요! 궁금한 점은 아래에서 먼저 찾아보세요."></textarea>' +
      '<div id="fr" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn g" id="fadd" type="button">＋ 질문 더하기</button></div>' +
    '<button class="btn c" id="save" type="button">저장하기</button>' +
    '<button class="btn g" id="closeDesk" type="button" style="font-size:14px">이 단골창구 닫기</button>';
  $('sn').value = d.name || ''; $('si').value = d.intro || ''; $('sh').value = d.hours || ''; $('sr').value = d.region || ''; $('sg').value = d.greeting || '';
  addrWire('sa', 'sr');
  $('xn').value = d.notice || ''; $('xb').checked = !!d.busy; $('xbm').value = d.busy_msg || ''; $('xh').checked = !!d.hours_on;
  $('xo').value = d.open_time || ''; $('xc').value = d.close_time || ''; $('xom').value = d.off_msg || '';
  (d.off_days || []).forEach(function(i){ var c = $('xd').querySelector('input[value="' + i + '"]'); if (c) c.checked = true; });
  var fr = $('fr');
  rows.forEach(function(r, i){
    var x = document.createElement('div'); x.className = 'faqrow';
    x.innerHTML = '<input data-k="q" maxlength="80" placeholder="질문"><textarea data-k="a" maxlength="600" style="min-height:60px" placeholder="답 (예: 매일 11시~21시, 월요일 휴무)"></textarea><button type="button" class="x" data-del="' + i + '">✕ 지우기</button>';
    x.querySelector('[data-k=q]').value = r.q || ''; x.querySelector('[data-k=a]').value = r.a || ''; fr.appendChild(x);
  });
  fr.querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){ FAQ = readFaq(); FAQ.splice(Number(b.dataset.del), 1); keep(); settings(); }; });
  $('fadd').onclick = function(){ FAQ = readFaq(); if (FAQ.length < 30) FAQ.push({ q: '', a: '' }); keep(); settings(); };
  $('ph').onchange = upload;
  $('save').onclick = save;
  $('closeDesk').onclick = function(){
    var b = this; if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '정말 닫을까요? 한 번 더 누르면 닫혀요 (남은 기간은 돌려드리지 않아요)'; return; }
    rpc('dg_owner_close_desk', { p_desk: d.id }).then(function(){ toast('단골창구를 닫았어요.'); location.replace('dangol_owner.html'); });
  };
}
function readFaq(){ return Array.prototype.map.call(document.querySelectorAll('#fr .faqrow'), function(x){ return { q: x.querySelector('[data-k=q]').value.trim(), a: x.querySelector('[data-k=a]').value.trim() }; }); }
function keep(){ DK.name = $('sn').value; DK.category = $('sc').value; DK.intro = $('si').value; DK.hours = $('sh').value; DK.region = $('sr').value; DK.greeting = $('sg').value; DK.address = $('saa').value; DK.address_detail = $('sad').value;
  DK.notice = $('xn').value; DK.busy = $('xb').checked; DK.busy_msg = $('xbm').value; DK.hours_on = $('xh').checked; DK.open_time = $('xo').value; DK.close_time = $('xc').value; DK.off_msg = $('xom').value;
  DK.off_days = [].map.call($('xd').querySelectorAll('input:checked'), function(c){ return +c.value; }); }
async function upload(){
  var f = this.files && this.files[0]; if (!f) return;
  toast('사진을 올리는 중…');
  try {
    var img = await new Promise(function(res, rej){ var i = new Image(); i.onload = function(){ res(i); }; i.onerror = rej; i.src = URL.createObjectURL(f); });
    var s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var blob = await new Promise(function(res){ c.toBlob(res, 'image/jpeg', 0.85); });
    var path = ME.id + '/' + DK.id + '-' + Date.now() + '.jpg';
    var up = await sb.storage.from('dangol').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
    if (up.error) throw up.error;
    keep(); FAQ = readFaq(); PHOTO = path; settings(); toast('사진을 올렸어요. [저장하기]를 눌러 주세요.');
  } catch (e) { toast('사진을 올리지 못했어요: ' + (e.message || e)); }
}
async function save(){
  keep(); FAQ = readFaq();
  if (String(DK.address || '').trim().length < 5) { toast('가게 주소를 넣어 주세요. 손님이 찾아오는 데 필요해요.'); $('saa').focus(); return; }
  var b = $('save'); b.disabled = true;
  try {
    var ra = await rpc('dg_set_address', { p_desk: DK.id, p_address: String(DK.address).trim(), p_address_detail: String(DK.address_detail || '').trim() });
    if (!ra.ok) throw ra;
    var r = await rpc('dg_update', { p_desk: DK.id, p_name: DK.name, p_category: DK.category, p_intro: DK.intro, p_hours: DK.hours, p_region: DK.region,
      p_photo: PHOTO || null, p_greeting: DK.greeting, p_items: FAQ.filter(function(x){ return x.q && x.a; }) });
    if (!r.ok) throw r;
    if (DK.hours_on && (!DK.open_time || !DK.close_time)) throw { error: 'need_hours' };
    var rx = await rpc('dg_set_extras', { p_desk: DK.id, p_notice: DK.notice || null, p_busy: !!DK.busy, p_busy_msg: DK.busy_msg || null,
      p_hours_on: !!DK.hours_on, p_open: DK.open_time || null, p_close: DK.close_time || null, p_off: DK.off_days || [], p_off_msg: DK.off_msg || null });
    if (!rx.ok) throw rx;
    toast('저장했어요. 자주 묻는 질문 ' + r.count + '개가 손님 화면에 보여요.');
    DESKS = await rpc('dg_owner_desks'); DK = DESKS.filter(function(x){ return x.id === DK.id; })[0] || DESKS[0]; FAQ = null; PHOTO = undefined; main();
  } catch (e) { toast(em(e)); b.disabled = false; }
}

boot().catch(function(e){ A.innerHTML = '<div class="card"><b class="h">' + esc(em(e)) + '</b></div>'; });
})();
</script>
<script>/* 🌗 주야간 바꾸기 단추 (2026-11-16) — 고른 값은 이 휴대폰에만 기억합니다 */
(function(){ var R = document.documentElement;
  function dark(){ var t = R.getAttribute('data-theme'); return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
  var b = document.createElement('button'); b.type = 'button'; b.id = 'dgTheme';
  b.style.cssText = 'flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line,#DCE3DE);background:var(--card,#fff);color:var(--ink,#12302E);font-size:18px;line-height:1;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)';
  function paint(){ var d = dark(); b.textContent = d ? '☀️' : '🌙'; b.title = b.ariaLabel = d ? '주간 모드로' : '야간 모드로'; }
  b.onclick = function(){ var t = dark() ? 'light' : 'dark'; R.setAttribute('data-theme', t); try { localStorage.setItem('dg_theme', t); } catch (e) {} paint(); };
  paint(); var top = document.querySelector('.top');
  /* ✕ 2026-11-17 닫기 — 한 휴대폰으로 손님 · 사장님을 오가므로, 언제든 첫 화면(사장님 / 고객님 고르기)으로 */
  var cl = document.createElement('a'); cl.id = 'dgClose';
  cl.textContent = window.__dgEN ? '✕ Close' : '✕ 닫기';
  cl.style.cssText = b.style.cssText + ';width:auto;padding:0 14px;font-size:14px;font-weight:800;text-decoration:none;margin-right:auto';
  cl.href = /(^|\.)dangol\.org$/.test(location.hostname) ? 'index.html' : 'javascript:void 0';
  if (!/(^|\.)dangol\.org$/.test(location.hostname)) cl.onclick = function(e){ e.preventDefault(); if (history.length > 1) history.back(); else location.replace('index.html'); };
  if (top) { b.style.marginLeft = 'auto'; top.appendChild(b); }
  else { var bar = document.createElement('div');   /* 위쪽 띠가 없는 화면: 맨 위 오른쪽에 한 줄 */
    bar.style.cssText = 'max-width:640px;margin:0 auto -6px;padding:max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));display:flex;justify-content:flex-end;align-items:center';
    b.style.width = b.style.height = '34px'; b.style.fontSize = '16px'; cl.style.height = '34px'; bar.appendChild(cl); bar.appendChild(b); document.body.insertBefore(bar, document.body.firstChild); }
})();
</script>
