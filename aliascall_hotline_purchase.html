<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliascall — 이용권</title>
<!--
  2026-10-01 — 예전 회선 8종 결제 화면은 닫았습니다.
  앱과 웹 모두 같은 이용권 화면(aliascall_plans.html)에서 같은 상품 · 같은 값으로 삽니다.
  예전 주소로 들어와도(즐겨찾기 · 옛 링크) 이용권 화면으로 바로 보냅니다.
    ?cat=pro / ?cat=ad / ?tier=pro_*  → 프로 상품이 보이는 곳으로
  옛 결제 함수(aliascall-hotline-inicis-* · -paypal-*)는 이미 진행 중이던 결제를 마무리할 수 있게 그대로 둡니다.
-->
<script>
(function(){
  var q = location.search || '';
  var pro = /cat=(pro|ad)/.test(q) || /tier=pro_/.test(q);
  location.replace('aliascall_plans.html' + (pro ? '#pro' : ''));
})();
</script>
</head>
<body style="font-family:sans-serif;padding:30px;text-align:center;">
  <a href="aliascall_plans.html">이용권 화면으로 이동 ›</a>
</body>
</html>
