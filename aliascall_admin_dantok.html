<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>단톡방 관리</title>
<!-- 💬 2026-11-22 종합관리자 · 단톡방 관리 — 방 목록 · 신고 · 멈춤/재개 · 기간 늘리기 (baroka/sql/24_dantok_admin.sql) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{ --bg:#F4F6F8; --card:#fff; --ink:#16212E; --soft:#5A6878; --line:#DDE3EA; --acc:#5B4BD6; --bad:#B4412F; --ok:#1F8A4C; }
*{ box-sizing:border-box; } [hidden]{ display:none !important; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:14px; }
header{ background:var(--acc); color:#fff; padding:12px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header h1{ margin:0; font-size:17px; } header .who{ margin-left:auto; font-size:12.5px; opacity:.85; }
header button{ background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:8px; padding:6px 11px; font-size:12.5px; cursor:pointer; }
main{ max-width:1300px; margin:0 auto; padding:14px; }
.bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
.bar button{ border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px; font-weight:800; cursor:pointer; }
.bar button.on{ background:var(--acc); color:#fff; border-color:var(--acc); }
.bar input{ border:1px solid var(--line); border-radius:8px; padding:7px 9px; font:inherit; }
.tbl{ overflow:auto; background:#fff; border:1px solid var(--line); border-radius:12px; }
table{ border-collapse:collapse; width:100%; min-width:980px; } th,td{ padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; } th{ background:#EFEDFC; font-size:12.5px; }
.tag{ display:inline-block; border-radius:20px; padding:1px 8px; font-size:11.5px; font-weight:800; }
.t-active{ background:#E3F4EA; color:var(--ok); } .t-suspended{ background:#FBEAE6; color:var(--bad); } .t-closed{ background:#EEF1F4; color:var(--soft); } .t-off{ background:#FFF3D6; color:#9A6400; }
td button{ border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 9px; font-size:12px; cursor:pointer; margin:2px 0; }
.rep{ font-size:12px; color:var(--bad); } .small{ font-size:12px; color:var(--soft); }
.err{ display:none; background:#FBEAE6; color:var(--bad); border-radius:10px; padding:10px 14px; margin-bottom:12px; }
#login{ position:fixed; inset:0; background:rgba(22,33,46,.55); display:none; align-items:center; justify-content:center; z-index:10; }
#login .box{ background:#fff; border-radius:16px; padding:22px; width:min(360px,92vw); display:flex; flex-direction:column; gap:10px; }
#login input{ border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; } #login button{ background:var(--acc); color:#fff; border:none; border-radius:8px; padding:11px; font-weight:800; cursor:pointer; }
:root{ --teal-tint:#EFEDFC; }
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.card .k{font-size:12px;color:var(--soft)}.card .v{font-size:20px;font-weight:800}.t-blocked{background:#FBEAE6;color:var(--bad)}</style></head>
<body>
<div id="login"><div class="box"><b style="font-size:17px">단톡방 관리</b><div style="font-size:13px;color:var(--soft)">가림 관리자 계정으로 로그인해 주세요(관리자 화면과 같은 계정).</div>
  <input id="lEmail" type="email" placeholder="관리자 이메일" autocomplete="username">
  <input id="lPw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button type="button" id="lGo">로그인</button><div class="err" id="loginErr"></div></div></div>
<header><h1>💬 단톡방 관리</h1><span class="who" id="who"></span><button type="button" id="reload">새로 고침</button><button type="button" id="logout">로그아웃</button></header>
<main>
<div class="err" id="err"></div>
<div class="cards" id="cards"></div>
<div class="bar"><button type="button" class="on" data-f="rep">🚩 신고 들어온 방</button><button type="button" data-f="active">운영 중</button><button type="button" data-f="blocked">멈춤</button><button type="button" data-f="">전체</button>
<input id="q" placeholder="방 이름 · 코드 · 방장 찾기"><span class="small" id="cnt"></span></div>
<div class="tbl"><table><thead><tr><th>방</th><th>상태</th><th>이용 기간</th><th>방장</th><th>인원 · 글</th><th>저장 공간</th><th>신고</th><th>할 일</th></tr></thead><tbody id="tb"><tr><td colspan="8">불러오는 중…</td></tr></tbody></table></div>
<p class="small">· 신고가 들어오면 신고된 글과 사유를 보고 [⛔ 멈춤]을 누르세요. 멈춘 방은 「운영 규칙 때문에 멈췄어요」로 나오고 글을 쓸 수 없습니다.<br>· 확인을 마친 신고는 [신고 처리함]을 누르면 목록에서 빠집니다. 방 내용은 개인정보라 이 화면에 보이지 않고, 신고된 글 한 줄만 보입니다.</p>
</main>
<script>
let SB = null, ME = null, D = null, F = 'rep';
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const kst = (t) => t ? new Date(new Date(t).getTime() + 9 * 3600e3).toISOString().slice(0, 10) : '';
const gb = (b) => (Number(b || 0) / 1073741824).toFixed(2) + 'GB';
function loginId(e){ const loc = String(e || '').split('@')[0]; try { return decodeURIComponent(loc); } catch (x) { return loc; } }
function alertBox(t){ el('err').textContent = t; el('err').style.display = t ? 'block' : 'none'; }
async function load(){
  alertBox('');
  const r = await SB().rpc('admin_dt_report');
  if (r.error) { alertBox(/not_admin/.test(r.error.message) ? '관리자 권한이 없는 계정입니다.' : /admin_dt|function/.test(r.error.message) ? '서버에 단톡방 관리 함수가 아직 없습니다. 24_dantok_admin.sql 을 가림 서버에서 Run 해 주세요.' : r.error.message); return; }
  D = r.data; const t = D.totals;
  el('cards').innerHTML = [['전체 방', t.rooms + '개'], ['운영 중', t.active + '개'], ['7일 새 방', t.new7 + '개'], ['참여한 사람', t.people + '명'], ['7일 글', t.msgs7 + '개'], ['열린 신고', t.reports + '건'], ['결제', t.paid + '건']]
    .map((c) => '<div class="card"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>').join('');
  paint();
  try { if (parent !== window) parent.postMessage({ type: 'weave_dt', reports: t.reports }, 'https://aliascall.com'); } catch (x) {}
}
function paint(){
  const q = el('q').value.trim().toLowerCase();
  const rows = (D.rooms || []).filter((d) => (F === 'rep' ? d.reports > 0 : !F || d.status === F) && (!q || (d.name + ' ' + d.code + ' ' + loginId(d.owner_login) + ' ' + (d.owner_nick || '')).toLowerCase().includes(q)));
  el('cnt').textContent = rows.length + '개';
  el('tb').innerHTML = rows.length ? rows.map((d) => {
    const off = d.status === 'active' && new Date(d.until) < new Date();
    return '<tr><td><b>' + esc(d.name) + '</b><br><span class="small">코드 ' + esc(d.code) + ' · ' + kst(d.created_at) + ' 개설' + (d.ends_on ? ' · ' + esc(d.ends_on) + ' 닫힘 예정' : '') + '</span></td>' +
      '<td><span class="tag t-' + (off ? 'off' : d.status) + '">' + (off ? '기간 끝' : { active: '운영', blocked: '멈춤', closed: '닫음' }[d.status] || d.status) + '</span></td>' +
      '<td>' + kst(d.until) + '</td><td>' + esc(d.owner_nick || '') + '<br><span class="small">' + esc(loginId(d.owner_login)) + '</span></td>' +
      '<td>' + d.people + '명 · ' + d.msgs + '개<br><span class="small">마지막 ' + kst(d.last_msg_at) + '</span></td><td>' + gb(d.used_bytes) + ' / ' + gb(d.quota_bytes) + '</td>' +
      '<td>' + (d.reports ? '<b class="rep">' + d.reports + '건</b>' + (d.report_list || []).map((x) => '<div class="rep">· ' + esc(x.reason || '') + (x.nick ? ' — ' + esc(x.nick) : '') + (x.body ? '<br><span class="small">「' + esc(x.body) + '」</span>' : '') + ' <span class="small">' + kst(x.at) + '</span></div>').join('') : '<span class="small">없음</span>') + '</td>' +
      '<td>' + (d.status === 'blocked' ? '<button data-a="active" data-id="' + d.id + '">재개</button>' : '<button data-a="blocked" data-id="' + d.id + '">⛔ 멈춤</button>') +
      (d.reports ? '<br><button data-d="1" data-id="' + d.id + '">신고 처리함</button>' : '') + '<br><button data-m="12" data-id="' + d.id + '">+1년</button></td></tr>';
  }).join('') : '<tr><td colspan="8" class="small">' + (F === 'rep' ? '신고 들어온 방이 없습니다. 👍' : '없습니다.') + '</td></tr>';
}
el('tb').addEventListener('click', async (e) => { const b = e.target.closest('button'); if (!b) return; const id = b.dataset.id; let r;
  if (b.dataset.d) r = await SB().rpc('admin_dt_done', { p_room: id });
  else r = await SB().rpc('admin_dt_set', { p_room: id, p_status: b.dataset.a || null, p_months: b.dataset.m ? 12 : null });
  if (r.error) return alertBox(r.error.message); load(); });
document.querySelectorAll('.bar [data-f]').forEach((b) => b.onclick = () => { document.querySelectorAll('.bar [data-f]').forEach((x) => x.classList.toggle('on', x === b)); F = b.dataset.f; paint(); });
el('q').oninput = paint; el('reload').onclick = load;

const FN_URL = "https://qmwaraittiurkynszjts.supabase.co", ANON_KEY = () => "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2FyYWl0dGl1cmt5bnN6anRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODQ5OTUsImV4cCI6MjEwMjM2MDk5NX0.9Qr2vFzDCSKS54N6C5QN44BvCzIPTMQyVz7nX3GqT9Y";
const sb = window.supabase.createClient(FN_URL, ANON_KEY(), { auth: { storageKey: 'aliascall-admin-auth' } });
SB = () => sb;
async function START(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { el('login').style.display = 'flex'; return; }
  const { data: ok, error } = await sb.rpc('is_global_admin');
  if (error || ok !== true) { await sb.auth.signOut(); el('login').style.display = 'flex'; el('loginErr').textContent = '관리자 권한이 없는 계정입니다.'; el('loginErr').style.display = 'block'; return; }
  ME = session.user; el('login').style.display = 'none'; el('who').textContent = session.user.email || ''; load();
}
el('lGo').addEventListener('click', async () => {
  el('loginErr').style.display = 'none';
  const { error } = await sb.auth.signInWithPassword({ email: el('lEmail').value.trim(), password: el('lPw').value });
  if (error) { el('loginErr').textContent = '로그인 실패: ' + error.message; el('loginErr').style.display = 'block'; return; }
  START();
});
el('lPw').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('lGo').click(); });
el('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
START();

</script>
</body>
</html>
