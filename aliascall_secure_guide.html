<style>

*{box-sizing:border-box;}
body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; word-break:keep-all; }

main{ max-width:640px; margin:0 auto; padding:28px 20px 70px; }

/* 목차는 줄바꿈해서 한눈에 다 보이게 (가로 스크롤이면 뒤가 잘린 줄 모릅니다) */

.category-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.category-card{ background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px; }
.category-card .h{ font-size:13px; font-weight:700; margin-bottom:5px; }
.category-card .d{ font-size:11.5px; color:var(--ink-soft); line-height:1.5; }

.highlight-box .tag{ display:inline-block; font-size:10.5px; font-weight:700; background:var(--brass); padding:3px 10px; border-radius:8px; margin-bottom:10px; }
.highlight-box h3{ font-size:18px; margin-bottom:8px; }
.highlight-box p{ font-size:13px; color:rgba(255,255,255,.85); line-height:1.6; margin:0 0 6px; }
.dodont-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0; }
.dodont-col .head{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:14px; margin-bottom:10px; }
.dodont-col.do .head{ color:var(--found); }
.dodont-col.dont .head{ color:var(--danger); }
.dodont-item{ display:flex; gap:9px; align-items:flex-start; padding:10px 12px; border-radius:10px; margin-bottom:8px; font-size:12.5px; line-height:1.5; }
.dodont-col.do .dodont-item{ background:var(--found-tint); }
.dodont-col.dont .dodont-item{ background:var(--danger-tint); }
.dodont-item .icon{ flex-shrink:0; font-size:14px; }
@media (max-width:520px){ .dodont-grid{ grid-template-columns:1fr; } .category-grid{ grid-template-columns:1fr; } }
.tip-callout{ background:var(--amber-tint); border-left:4px solid var(--amber); border-radius:0 10px 10px 0; padding:14px 16px; font-size:12.5px; line-height:1.6; margin-top:14px; }

const LANG_KEYS = ['aliascall_lang', 'aliascall_language', 'ac_lang', 'lang'];
function detectLang(){
  try { const q = new URLSearchParams(location.search).get('lang');
        if (q) return q.toLowerCase().indexOf('en') === 0 ? 'en' : 'ko'; } catch (e) {}
  for (const k of LANG_KEYS) {
    try { const v = localStorage.getItem(k);
          if (v) return String(v).toLowerCase().indexOf('en') === 0 ? 'en' : 'ko'; } catch (e) {}
  }
  return (navigator.language || 'ko').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en';
}
let LANG = detectLang();
function T(k){ const d = I18N[LANG] || I18N.ko; return d[k] !== undefined ? d[k] : (I18N.ko[k] !== undefined ? I18N.ko[k] : k); }
function applyI18n(){
  document.documentElement.lang = LANG;
  document.title = T('docTitle');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = T(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', T(el.dataset.i18nAria)); });
}
applyI18n();
document.getElementById('langToggleBtn').addEventListener('click', () => {
  LANG = (LANG === 'ko') ? 'en' : 'ko';
  LANG_KEYS.forEach((k) => { try { localStorage.setItem(k, LANG); } catch (e) {} });
  applyI18n();
});
</script>
