<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aliascall — 핫라인 참가</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="aliascall_e2ee.js"></script>
<script src="aliascall_push.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12302E; --ink-soft:#3E5654; --paper:#B8D3BE; --card:#FFFFFF;
  --teal:#1F6F6B; --teal-deep:#123F3D; --teal-tint:#E4EFEE;
  --coral:#E8734A; --coral-tint:#FDEAE1;
  --line:#DCE3DE; --danger:#C1483A; --found:#2E7D4F;
  --brass:#C9A24B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; word-break:keep-all; }
@media (min-width:760px){ body{ display:flex; justify-content:center; background:linear-gradient(180deg,#9FC2A6,#B8D3BE); } .app-shell{ max-width:430px; width:100%; box-shadow:0 0 60px rgba(0,0,0,.15); min-height:100vh; background:var(--paper); } }
h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; font-weight:600; }
.mono{ font-family:'IBM Plex Mono',monospace; }

header{ padding:20px 24px 6px; display:flex; align-items:center; gap:9px; }
/* 2026-08-25 신설: 언어 전환 버튼 */
.lang-toggle{ margin-left:auto; background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:20px; padding:6px 13px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0; }
.lang-toggle:active{ opacity:.6; }
.brand-mark{ width:28px; height:28px; border-radius:8px; background:var(--teal); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; font-family:'Space Grotesk',sans-serif; }
.brand-name{ font-size:16px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--coral); }

main{ max-width:400px; margin:0 auto; padding:20px 24px 60px; }

.state{ display:none; }
.state.show{ display:block; }

.hl-card{ background:var(--card); border-radius:18px; padding:26px 22px; text-align:center; }
.hl-callsign{ display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--coral); background:var(--coral-tint); padding:5px 12px; border-radius:20px; margin-bottom:14px; }
.hl-dot{ width:6px; height:6px; border-radius:50%; background:var(--coral); animation:hlPulse 1.8s ease-in-out infinite; }
@keyframes hlPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
.hl-title{ font-size:20px; margin-bottom:6px; }
.hl-meta{ font-size:12.5px; color:var(--ink-soft); margin-bottom:22px; }

.nickname-input{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; font-size:14px; margin-bottom:14px; text-align:center; }
.join-btn{ width:100%; background:var(--teal); color:#fff; border:none; border-radius:12px; padding:15px; font-weight:700; font-size:14px; cursor:pointer; }
.join-btn:disabled{ opacity:.5; }

.waiting-spinner{ width:52px; height:52px; border-radius:50%; background:var(--teal-tint); display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto 18px; animation:waitPulse 1.6s ease-in-out infinite; }
@keyframes waitPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(31,111,107,.25); } 50%{ box-shadow:0 0 0 14px rgba(31,111,107,0); } }

.result-icon{ font-size:40px; margin-bottom:12px; }
.error-box{ background:var(--danger); color:#fff; border-radius:12px; padding:16px; font-size:13px; text-align:center; }
</style>
</head>
<body>
<div class="app-shell">

<header>
  <div class="brand-mark">A</div>
  <div class="brand-name">Alias<em>call</em></div>
  <button type="button" class="lang-toggle" id="langToggleBtn" data-i18n="langToggle" data-i18n-aria="langAria" aria-label="언어 바꾸기">EN</button>
</header>

<main>
  <div class="state show" id="stateLoading">
    <p style="text-align:center; color:var(--ink-soft); font-size:13px; margin-top:40px;" data-i18n="loading">불러오는 중…</p>
  </div>

  <div class="state" id="stateError">
    <div class="error-box" id="errorMsg" data-i18n="errInvalidLink">유효하지 않은 초대 링크입니다.</div>
  </div>

  <div class="state" id="stateEntry">
    <div class="hl-card">
      <div class="hl-callsign"><span class="hl-dot"></span><span id="hlCallsignText">LINE</span></div>
      <div class="hl-title" id="hlTitle" data-i18n="roomTitleDefault">핫라인</div>
      <div class="hl-meta" id="hlMeta" data-i18n="metaChecking">인원 확인 중…</div>
      <input type="text" class="nickname-input" id="nicknameInput" placeholder="사용하실 별명을 입력하세요" data-i18n-placeholder="nicknamePlaceholder" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="join-btn" id="joinBtn" data-i18n="joinBtn">참가 신청하기</button>
      <p style="font-size:11px; color:var(--ink-soft); margin-top:12px; line-height:1.5;" id="entryNote" data-i18n="entryNote">별명 외 개인정보는 필요 없습니다. 개설자가 승인하면 바로 대화에 참여할 수 있어요.</p>
    </div>
  </div>

  <div class="state" id="stateWaiting">
    <div class="hl-card">
      <div class="waiting-spinner">⏳</div>
      <h3 style="margin-bottom:6px;" data-i18n="waitingTitle">대기 중이에요</h3>
      <p style="font-size:13px; color:var(--ink-soft);" data-i18n-html="waitingDesc">개설자가 승인하면 바로 대화가 시작됩니다.<br>이 화면을 닫지 말고 잠시만 기다려주세요.</p>
    </div>
  </div>

  <div class="state" id="stateApproved">
    <div class="hl-card">
      <div class="result-icon">✓</div>
      <h3 style="margin-bottom:6px; color:var(--found);" data-i18n="approvedTitle">참가가 승인됐어요</h3>
      <p style="font-size:13px; color:var(--ink-soft); margin-bottom:18px;" data-i18n="approvedDesc">이제 대화에 참여할 수 있습니다.</p>
      <button class="join-btn" id="enterRoomBtn" data-i18n="enterRoomBtn">대화방 입장하기</button>
    </div>
  </div>

  <div class="state" id="stateRejected">
    <div class="hl-card">
      <div class="result-icon">✕</div>
      <h3 style="margin-bottom:6px; color:var(--danger);" data-i18n="rejectedTitle">참가가 거절됐어요</h3>
      <p style="font-size:13px; color:var(--ink-soft);" data-i18n="rejectedDesc">개설자에게 직접 문의해주세요.</p>
    </div>
  </div>
</main>

</div>

<script>
const SUPABASE_URL = "https://qmwaraittiurkynszjts.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2FyYWl0dGl1cmt5bnN6anRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODQ5OTUsImV4cCI6MjEwMjM2MDk5NX0.9Qr2vFzDCSKS54N6C5QN44BvCzIPTMQyVz7nX3GqT9Y";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =====================================================================
// 2026-08-25 신설: 다국어(한국어/영어)
// =====================================================================
const I18N = {
  ko: {
    docTitle: 'Aliascall — 핫라인 참가',
    langToggle: 'EN', langAria: '언어 바꾸기',
    loading: '불러오는 중…',
    errInvalidLink: '유효하지 않은 초대 링크입니다.',
    errBadAccess: '올바르지 않은 접근입니다. 초대 링크를 다시 확인해주세요.',
    errFull: '정원이 가득 찼습니다.',
    errNoKey: '이 초대링크에 암호화 열쇠가 빠져있어요. 링크를 보낸 분에게 전체 링크(#로 시작하는 부분까지)를 다시 요청해주세요.',
    errLoadFail: '불러오지 못했어요. 잠시 후 다시 시도해주세요.',
    roomTitleDefault: '핫라인',
    metaChecking: '인원 확인 중…',
    nicknamePlaceholder: '사용하실 별명을 입력하세요',
    joinBtn: '참가 신청하기',
    entryNote: '별명 외 개인정보는 필요 없습니다. 개설자가 승인하면 바로 대화에 참여할 수 있어요.',
    entryNoteAuto: '별명 외 개인정보는 필요 없습니다. 별명을 입력하시면 바로 대화가 시작됩니다.',
    waitingTitle: '대기 중이에요',
    waitingDesc: '개설자가 승인하면 바로 대화가 시작됩니다.<br>이 화면을 닫지 말고 잠시만 기다려주세요.',
    approvedTitle: '참가가 승인됐어요',
    approvedDesc: '이제 대화에 참여할 수 있습니다.',
    enterRoomBtn: '대화방 입장하기',
    rejectedTitle: '참가가 거절됐어요',
    rejectedDesc: '개설자에게 직접 문의해주세요.',
    alertNeedNickname: '별명을 입력해주세요.',
    alertJoinFail: '신청에 실패했어요.',
    alertJoinFailRetry: '신청에 실패했어요. 잠시 후 다시 시도해주세요.',
  },
  en: {
    docTitle: 'Aliascall — Join a hotline',
    langToggle: '한국어', langAria: 'Change language',
    loading: 'Loading…',
    errInvalidLink: 'This invite link is not valid.',
    errBadAccess: 'Invalid access. Please check the invite link again.',
    errFull: 'This hotline is full.',
    errNoKey: 'This invite link is missing its encryption key. Ask whoever sent it for the full link, including the part that starts with #.',
    errLoadFail: "Couldn't load. Please try again in a moment.",
    roomTitleDefault: 'Hotline',
    metaChecking: 'Checking capacity…',
    nicknamePlaceholder: 'Enter the nickname you want to use',
    joinBtn: 'Request to join',
    entryNote: 'No personal details beyond a nickname are needed. Once the owner approves you, you can join the conversation right away.',
    entryNoteAuto: 'No personal details beyond a nickname are needed. Enter a nickname and the conversation starts right away.',
    waitingTitle: 'Waiting for approval',
    waitingDesc: 'The conversation starts as soon as the owner approves you.<br>Please keep this screen open for a moment.',
    approvedTitle: "You're approved",
    approvedDesc: 'You can now join the conversation.',
    enterRoomBtn: 'Enter the room',
    rejectedTitle: 'Your request was declined',
    rejectedDesc: 'Please contact the owner directly.',
    alertNeedNickname: 'Please enter a nickname.',
    alertJoinFail: "Couldn't send your request.",
    alertJoinFailRetry: "Couldn't send your request. Please try again in a moment.",
  },
};

// ⚠ 서버가 돌려주는 tierLabel은 한국어라, 영어 화면에서는 tier 코드로 직접 만들어 씀.
const TIER_LABEL_EN = {
  hotline_1to1: 'Hotline (2)', hotline_everybody: 'Everybody (2)',
  economy_4: 'Economy (4)', premium_4: 'Premium (4)',
  hotline_1to1_secure: 'Hotline Secure (2)', hotline_everybody_secure: 'Everybody Secure (2)',
  economy_4_secure: 'Economy Secure (4)', premium_4_secure: 'Premium Secure (4)',
};

const LANG_KEYS = ['aliascall_lang', 'aliascall_language', 'ac_lang', 'lang'];
let LANG = (typeof window.getAliascallLang === 'function')
  ? window.getAliascallLang()
  : ((navigator.language || 'ko').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en');
function T(k){ const d = I18N[LANG] || I18N.ko; return d[k] !== undefined ? d[k] : (I18N.ko[k] !== undefined ? I18N.ko[k] : k); }
// 서버 오류 문구는 한국어라, 영어 화면에서는 이 파일 문구를 씀
function srvErr(msg, key){ return (LANG === 'ko' && msg) ? msg : T(key); }
function applyI18n(){
  document.documentElement.lang = LANG;
  document.title = T('docTitle');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = T(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = T(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', T(el.dataset.i18nAria)); });
}
applyI18n();
document.getElementById('langToggleBtn').addEventListener('click', () => {
  LANG = (LANG === 'ko') ? 'en' : 'ko';
  if (typeof window.setAliascallLang === 'function') window.setAliascallLang(LANG);
  else LANG_KEYS.forEach((k) => { try { localStorage.setItem(k, LANG); } catch (e) {} });
  location.reload(); // #k=(열쇠) 조각은 새로고침해도 그대로 유지됨
});


function getInviteToken(){
  return new URLSearchParams(window.location.search).get('t');
}

// 참가자 브라우저의 익명 식별값 — 발견자(finderAnonId)와는 별개 네임스페이스로 저장
function getHotlineAnonId(){
  let id = localStorage.getItem('aliascall_hotline_anon_id');
  if (!id) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
    localStorage.setItem('aliascall_hotline_anon_id', id);
  }
  return id;
}
const hotlineAnonId = getHotlineAnonId();

function showState(name){
  document.querySelectorAll('.state').forEach((el) => el.classList.remove('show'));
  document.getElementById(name).classList.add('show');
}

let inviteToken = null;
let decisionChannel = null;
let pollInterval = null;

async function init(){
  inviteToken = getInviteToken();
  if (!inviteToken) {
    document.getElementById('errorMsg').textContent = T('errBadAccess');
    showState('stateError');
    return;
  }

  // 먼저 이미 신청/승인된 적 있는지 확인 (재방문 케이스)
  try {
    const statusRes = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-check-join-status`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inviteToken, memberAnonId: hotlineAnonId }),
    });
    const statusData = await statusRes.json();
    if (statusRes.ok) {
      if (statusData.status === 'approved') { showState('stateApproved'); return; }
      if (statusData.status === 'pending') { enterWaitingState(); return; }
      if (statusData.status === 'rejected') { showState('stateRejected'); return; }
    }
  } catch (e) { console.warn('[hotline] 상태 확인 실패(계속 진행)', e); }

  // 신규 방문 — 핫라인 정보 조회해서 입력 화면 표시
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-lookup-by-token`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inviteToken }),
    });
    const data = await res.json();
    if (!res.ok) { document.getElementById('errorMsg').textContent = srvErr(data.error, 'errInvalidLink'); showState('stateError'); return; }

    // 2026-08-25: 서버의 tierLabel은 한국어라 영어일 땐 tier 코드로 직접 만듦
    document.getElementById('hlCallsignText').textContent = (LANG === 'en' && TIER_LABEL_EN[data.tier]) ? TIER_LABEL_EN[data.tier] : data.tierLabel;
    document.getElementById('hlTitle').textContent = data.title; // 방 이름은 개설자가 지은 것이라 번역하지 않음
    document.getElementById('hlMeta').textContent = (LANG === 'en')
      ? `${data.currentMemberCount} / ${data.maxParticipants} joined`
      : `${data.currentMemberCount} / ${data.maxParticipants}명 참가 중`;
    if (data.isFull) {
      document.getElementById('errorMsg').textContent = T('errFull');
      showState('stateError');
      return;
    }
    // 2026-08-21 신설: 암호화 상품인데 링크에 열쇠(#k=)가 없으면 대화를 절대 못 여니 미리 안내
    if (data.tier && data.tier.endsWith('_secure') && !e2eeReadKeyFromUrlFragment()) {
      document.getElementById('errorMsg').textContent = T('errNoKey');
      showState('stateError');
      return;
    }
    // 2026-08-26(v51): 전문관리용 방은 자동 승인이라 "승인을 기다리라"는 안내가 맞지 않음
    if (data.autoApprove) {
      const note = document.getElementById('entryNote');
      note.setAttribute('data-i18n', 'entryNoteAuto');
      note.textContent = T('entryNoteAuto');
    }
    showState('stateEntry');
  } catch (e) {
    console.error('[hotline] 조회 실패', e);
    document.getElementById('errorMsg').textContent = T('errLoadFail');
    showState('stateError');
  }
}

document.getElementById('joinBtn').addEventListener('click', async () => {
  const nickname = document.getElementById('nicknameInput').value.trim();
  if (!nickname) { alert(T('alertNeedNickname')); return; }

  const btn = document.getElementById('joinBtn');
  btn.disabled = true;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-request-join`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inviteToken, memberAnonId: hotlineAnonId, nickname }),
    });
    const data = await res.json();
    if (!res.ok) { alert(srvErr(data.error, 'alertJoinFail')); btn.disabled = false; return; }

    if (data.status === 'approved') { showState('stateApproved'); return; }
    if (data.status === 'rejected') { showState('stateRejected'); return; }
    enterWaitingState();
  } catch (e) {
    console.error('[hotline] 신청 실패', e);
    alert(T('alertJoinFailRetry'));
    btn.disabled = false;
  }
});

function enterWaitingState(){
  showState('stateWaiting');

  // 실시간 방송으로 승인/거절 결과를 즉시 감지
  decisionChannel = sb.channel('hotline-join-' + inviteToken + '-' + hotlineAnonId, { config: { broadcast: { self: false } } });
  decisionChannel
    .on('broadcast', { event: 'decision' }, ({ payload }) => {
      if (payload.decision === 'approve') showState('stateApproved');
      else showState('stateRejected');
      cleanupWaiting();
    })
    .subscribe();

  // 놓쳤을 경우를 대비한 폴링 안전장치
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/aliascall-hotline-check-join-status`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ inviteToken, memberAnonId: hotlineAnonId }),
      });
      const data = await res.json();
      if (res.ok && data.status === 'approved') { showState('stateApproved'); cleanupWaiting(); }
      else if (res.ok && data.status === 'rejected') { showState('stateRejected'); cleanupWaiting(); }
    } catch (e) { /* 무시하고 다음 폴링에서 재시도 */ }
  }, 5000);
}

function cleanupWaiting(){
  if (decisionChannel) { try { sb.removeChannel(decisionChannel); } catch (e) {} decisionChannel = null; }
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
}

document.getElementById('enterRoomBtn').addEventListener('click', () => {
  // 2026-08-21: 초대링크의 #k=(암호화 키)가 있으면 그대로 대화방까지 이어서 전달함
  // (URL의 #뒷부분은 서버로 안 가고 브라우저 안에서만 유지되는 부분이라, 그냥 이어붙이면 됨)
  window.location.href = 'aliascall_hotline_room.html?t=' + encodeURIComponent(inviteToken) + window.location.hash;
});

init();
</script>
</body>
</html>
