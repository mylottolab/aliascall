<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliascall — 충전소</title>
<!--
  🔴 2026-09-28 — 충전소(포인트)를 닫았습니다.
  포인트는 모두 없앴습니다. QR 인쇄는 무료이고, 나머지는 이용권 하나에 들어 있습니다.
  옛 충전 화면은 GitHub 기록에 남아 있습니다(되살릴 일이 있으면 History 에서).
  ⚠ 이 주소로 들어오는 옛 링크가 있을 수 있어 파일은 남겨둡니다.
-->
<style>
body{ margin:0; background:#B8D3BE; color:#12302E; font-family:'Inter',system-ui,sans-serif; min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:20px; word-break:keep-all; }
.card{ background:#fff; border-radius:20px; padding:30px 24px; max-width:380px; width:100%; text-align:center; }
h1{ font-size:20px; margin:0 0 10px; }
p{ font-size:14px; line-height:1.75; color:#3E5654; margin:0 0 20px; }
a{ display:block; border-radius:12px; padding:14px; font-weight:700; text-decoration:none; margin-top:8px; }
a.p{ background:#1F6F6B; color:#fff; } a.s{ background:#E4EFEE; color:#123F3D; }
</style>
</head>
<body>
<div class="card">
  <h1 id="t">충전소가 문을 닫았습니다</h1>
  <p id="d">포인트 없이 쓰실 수 있게 바꿨습니다. QR 태그 인쇄는 무료이고, 나머지 기능은 이용권 하나에 모두 들어 있습니다.</p>
  <a class="p" id="go" href="aliascall_plans.html">이용권 보기</a>
  <a class="s" id="home" href="index.html">첫 화면으로</a>
</div>
<script>
(function(){
  var en = (localStorage.getItem('aliascall_lang') || '').indexOf('en') === 0;
  if (!en) return;
  document.documentElement.lang = 'en';
  document.getElementById('t').textContent = 'Points have been retired';
  document.getElementById('d').textContent = 'You no longer need points. Printing QR tags is free, and everything else comes with one plan.';
  document.getElementById('go').textContent = 'See plans';
  document.getElementById('home').textContent = 'Home';
})();
</script>
</body>
</html>
