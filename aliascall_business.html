<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Aliascall</title>
<meta name="description" id="pageDesc" content="번호를 주고받지 않고 문의하세요.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#12302E; --ink-soft:#3E5654; --paper:#B8D3BE; --card:#FFFFFF;
  --teal:#1F6F6B; --teal-deep:#123F3D; --teal-tint:#E4EFEE;
  --coral:#E8734A; --coral-tint:#FDEAE1;
  --line:#DCE3DE; --danger:#C1483A; --found:#2E7D4F; --brass:#C9A24B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; word-break:keep-all; }
h1,h2{ font-family:'Space Grotesk',sans-serif; margin:0; }

.topbar{ background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:10px; }
.topbar .logo{ font-size:15px; font-weight:700; font-family:'Space Grotesk',sans-serif; text-decoration:none; color:var(--ink); }
.topbar .logo em{ font-style:normal; color:var(--coral); }
.topbar .spacer{ flex:1; }
.topbar a.dir{ font-size:11.5px; color:var(--ink-soft); text-decoration:none; }

.wrap{ max-width:560px; margin:0 auto; padding:20px 16px 50px; }

.card{ background:#fff; border-radius:16px; padding:20px; margin-bottom:14px; }
.biz-cat{ display:inline-block; font-size:11px; font-weight:700; background:var(--teal-tint); color:var(--teal-deep); border-radius:20px; padding:4px 11px; }
.biz-name{ font-size:23px; font-weight:700; margin:10px 0 6px; font-family:'Space Grotesk',sans-serif; }
.biz-verified{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--found); font-weight:700; margin-bottom:12px; }
.biz-intro{ font-size:13.5px; line-height:1.8; color:var(--ink); white-space:pre-wrap; }
.biz-meta{ margin-top:14px; padding-top:13px; border-top:1px solid var(--line); }
.biz-row{ display:flex; gap:10px; font-size:12.5px; padding:5px 0; }
.biz-row .k{ flex:0 0 62px; color:var(--ink-soft); }
.biz-row .v{ flex:1; }

.ask{ background:var(--teal-deep); color:#fff; border-radius:16px; padding:20px; }
.ask h2{ font-size:16px; margin-bottom:7px; }
.ask p{ font-size:12.5px; line-height:1.75; color:#CFE0DD; margin:0 0 14px; }
.ask input{ width:100%; box-sizing:border-box; border:none; border-radius:11px; padding:13px 14px; font-size:14px; font-family:inherit; margin-bottom:9px; }
.ask button{ width:100%; border:none; border-radius:11px; padding:14px; background:var(--coral); color:#fff; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; }
.ask button:disabled{ opacity:.5; cursor:default; }
.ask .note{ font-size:11px; color:#9FBDB9; line-height:1.7; margin-top:11px; }
.ask .err{ font-size:12px; color:#FFC9BC; margin-top:10px; display:none; }
.ask .err.show{ display:block; }

.state{ text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:13px; line-height:1.9; }
.state a{ color:var(--teal-deep); font-weight:700; }

.done{ text-align:center; padding:22px 16px; }
.done .ic{ font-size:38px; }
.done h2{ font-size:18px; margin:10px 0 6px; }
.done p{ font-size:12.5px; color:var(--ink-soft); line-height:1.8; margin:0 0 16px; }
.done a.go{ display:block; background:var(--teal-deep); color:#fff; border-radius:11px; padding:14px; font-size:15px; font-weight:700; text-decoration:none; }

footer{ margin-top:22px; text-align:center; font-size:11px; color:var(--ink-soft); line-height:1.8; }
footer a{ color:var(--teal-deep); }
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" href="index.html">Alias<em>call</em></a>
  <span class="spacer"></span>
  <a class="dir" href="aliascall_directory.html">업체 목록 ›</a>
</div>

<div class="wrap" id="wrap">
  <div class="state" id="loadingState">불러오는 중…</div>
</div>

<script>
const SUPABASE_URL = "https://qmwaraittiurkynszjts.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2FyYWl0dGl1cmt5bnN6anRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODQ5OTUsImV4cCI6MjEwMjM2MDk5NX0.9Qr2vFzDCSKS54N6C5QN44BvCzIPTMQyVz7nX3GqT9Y";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ⚠ 이 페이지를 볼 사람은 Aliascall 계정이 없습니다.
//   앱을 깔지 않았고, 그냥 업체가 뿌린 링크를 눌러 들어온 분입니다.
//   그래서 로그인·가입을 요구하지 않고 별명 하나로 문의할 수 있게 합니다.
function getAnonId(){
  let id = localStorage.getItem('aliascall_hotline_anon_id');
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID()
          : String(Date.now()) + Math.random().toString(16).slice(2));
    localStorage.setItem('aliascall_hotline_anon_id', id);
  }
  return id;
}

function esc(v){ return String(v == null ? '' : v); }

function slugFromUrl(){
  // ⚠ /b/김상익법률사무소 형태와 ?b=김상익법률사무소 둘 다 받습니다.
  //   서버 설정 없이도 동작해야 해서 물음표 형태를 함께 지원합니다.
  const q = new URLSearchParams(window.location.search).get('b');
  if (q) return decodeURIComponent(q);
  const m = window.location.pathname.match(/\/b\/([^\/]+)\/?$/);
  return m ? decodeURIComponent(m[1]) : '';
}

async function init(){
  const wrap = document.getElementById('wrap');
  const slug = slugFromUrl();
  if (!slug) {
    wrap.innerHTML = '<div class="state">주소가 올바르지 않습니다.<br><a href="aliascall_directory.html">업체 목록 보기 ›</a></div>';
    return;
  }

  let biz = null;
  try {
    const { data, error } = await sb.rpc('get_business_page', { p_slug: slug });
    if (error) throw error;
    biz = (data && data[0]) || null;
  } catch (e) {
    console.error('[biz] 불러오기 실패', e);
    wrap.innerHTML = '<div class="state">잠시 후 다시 시도해주세요.</div>';
    return;
  }

  if (!biz) {
    // ⚠ 없는 주소인지, 공개를 내린 것인지 구분해서 알려주지 않습니다.
    //   "저 업체는 심사에서 떨어졌구나" 같은 추측을 남기지 않기 위함입니다.
    wrap.innerHTML = '<div class="state">지금은 문의를 받지 않는 업체입니다.<br><a href="aliascall_directory.html">다른 업체 보기 ›</a></div>';
    return;
  }

  document.getElementById('pageTitle').textContent = biz.business_name + ' — Aliascall';
  document.getElementById('pageDesc').setAttribute('content',
    biz.business_name + ' · 번호를 주고받지 않고 문의하실 수 있습니다.');

  wrap.innerHTML = '';

  // ── 업체 정보 ──
  const card = document.createElement('div');
  card.className = 'card';
  const cat = document.createElement('span');
  cat.className = 'biz-cat';
  cat.textContent = esc(biz.category_label);
  card.appendChild(cat);

  const nm = document.createElement('h1');
  nm.className = 'biz-name';
  nm.textContent = esc(biz.business_name);
  card.appendChild(nm);

  // ⚠ 자격증 자체는 절대 공개하지 않습니다.
  //   면허증에는 면허번호·주민등록번호·주소가 들어 있어 도용 위험이 큽니다.
  //   관리자가 확인했다는 표시만 보여줍니다.
  const vf = document.createElement('div');
  vf.className = 'biz-verified';
  vf.textContent = biz.license_needed
    ? '✅ 사업자등록 · 자격 확인 완료'
    : '✅ 사업자등록 확인 완료';
  card.appendChild(vf);

  if (biz.intro) {
    const it = document.createElement('div');
    it.className = 'biz-intro';
    it.textContent = esc(biz.intro);
    card.appendChild(it);
  }

  if (biz.region || biz.hours) {
    const meta = document.createElement('div');
    meta.className = 'biz-meta';
    if (biz.region) {
      const r = document.createElement('div');
      r.className = 'biz-row';
      r.innerHTML = '<span class="k">지역</span><span class="v"></span>';
      r.querySelector('.v').textContent = esc(biz.region);
      meta.appendChild(r);
    }
    if (biz.hours) {
      const h = document.createElement('div');
      h.className = 'biz-row';
      h.innerHTML = '<span class="k">운영시간</span><span class="v"></span>';
      h.querySelector('.v').textContent = esc(biz.hours);
      meta.appendChild(h);
    }
    card.appendChild(meta);
  }
  wrap.appendChild(card);

  // ── 문의하기 ──
  // ⛔ 예약 폼·주문서·결제는 절대 넣지 않습니다(변호사 확인 완료).
  //   여기가 하는 일은 "대화창을 열어주는 것"까지입니다.
  //   그 선을 넘으면 전자상거래법상 '통신판매중개'가 되어
  //   신고 의무와 소비자 분쟁 책임이 생깁니다.
  const ask = document.createElement('div');
  ask.className = 'ask';
  ask.innerHTML =
    '<h2>💬 문의하기</h2>' +
    '<p>전화번호를 주고받지 않습니다. 별명만 남기시면 바로 대화가 시작됩니다.</p>' +
    '<input type="text" id="nickInput" maxlength="20" placeholder="사용하실 별명" ' +
    'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' +
    '<button type="button" id="askBtn">문의 시작하기</button>' +
    '<div class="err" id="askErr"></div>' +
    '<div class="note">별명 외 개인정보는 필요 없습니다. ' +
    (biz.auto_approve ? '바로 대화가 열립니다.' : '업체가 확인하면 대화가 열립니다.') +
    '</div>';
  wrap.appendChild(ask);

  const footer = document.createElement('footer');
  footer.innerHTML = '실제 번호를 노출하지 않는 안전한 연결 서비스입니다.<br>' +
    '<a href="index.html">Aliascall이 궁금하신가요? ›</a>';
  wrap.appendChild(footer);

  document.getElementById('askBtn').addEventListener('click', () => sendInquiry(biz));
  document.getElementById('nickInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendInquiry(biz);
  });
}

async function sendInquiry(biz){
  const btn = document.getElementById('askBtn');
  const err = document.getElementById('askErr');
  const nick = document.getElementById('nickInput').value.trim();
  err.classList.remove('show');

  if (!nick) { err.textContent = '별명을 입력해주세요.'; err.classList.add('show'); return; }

  btn.disabled = true;
  btn.textContent = '연결 중…';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/aliascall-hotline-public-inquiry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ listingKey: biz.listing_key, visitorAnonId: getAnonId(), nickname: nick }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      err.textContent = data.error || '지금은 문의를 받지 못합니다. 잠시 후 다시 시도해주세요.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = '문의 시작하기';
      return;
    }

    // ⚠ 대화방 주소를 이 브라우저에 남겨둡니다.
    //   안 그러면 탭을 닫는 순간 돌아갈 길이 사라집니다.
    const roomUrl = 'aliascall_hotline_room.html?t=' + encodeURIComponent(data.inviteToken);
    try {
      const raw = localStorage.getItem('aliascall_my_lines');
      let list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) list = [];
      list = list.filter((x) => x && x.hotlineId !== data.hotlineId);
      list.unshift({
        hotlineId: data.hotlineId, title: biz.business_name, isOwner: false,
        token: data.inviteToken, lastVisitedAt: new Date().toISOString(),
      });
      localStorage.setItem('aliascall_my_lines', JSON.stringify(list.slice(0, 30)));
    } catch (e) { /* 기록 실패해도 대화는 됩니다 */ }

    const wrap = document.getElementById('wrap');
    wrap.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'card done';
    d.innerHTML =
      '<div class="ic">✅</div>' +
      '<h2>' + (data.needsApproval ? '문의를 보냈습니다' : '대화가 열렸습니다') + '</h2>' +
      '<p>' + (data.needsApproval
        ? '업체가 확인하면 대화를 시작하실 수 있습니다.<br>아래 링크를 저장해두시면 언제든 다시 들어오실 수 있습니다.'
        : '아래에서 바로 대화를 시작하세요.<br>이 링크를 저장해두시면 언제든 다시 들어오실 수 있습니다.') + '</p>' +
      '<a class="go" href="' + roomUrl + '">대화방으로 이동 ›</a>';
    wrap.appendChild(d);
  } catch (e) {
    console.error('[biz] 문의 실패', e);
    err.textContent = '연결에 실패했습니다. 잠시 후 다시 시도해주세요.';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = '문의 시작하기';
  }
}

init();
</script>
</body>
</html>
