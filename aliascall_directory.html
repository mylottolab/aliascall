<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업체 목록 — Aliascall</title>
<meta name="description" content="번호를 주고받지 않고 문의할 수 있는 업체들입니다.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#12302E; --ink-soft:#3E5654; --paper:#B8D3BE; --card:#FFFFFF;
  --teal:#1F6F6B; --teal-deep:#123F3D; --teal-tint:#E4EFEE;
  --coral:#E8734A; --coral-tint:#FDEAE1;
  --line:#DCE3DE; --found:#2E7D4F;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; word-break:keep-all; }
h1,h2{ font-family:'Space Grotesk',sans-serif; margin:0; }

.topbar{ background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:10px; }
.topbar .logo{ font-size:15px; font-weight:700; font-family:'Space Grotesk',sans-serif; text-decoration:none; color:var(--ink); }
.topbar .logo em{ font-style:normal; color:var(--coral); }

.wrap{ max-width:620px; margin:0 auto; padding:20px 16px 50px; }
h1{ font-size:21px; margin-bottom:6px; }
.desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.75; margin-bottom:16px; }

.find{ display:flex; gap:8px; margin-bottom:12px; }
.find input{ flex:1; border:1.5px solid var(--line); border-radius:11px; padding:11px 13px; font-size:13.5px; font-family:inherit; }
.find button{ border:none; border-radius:11px; padding:11px 18px; background:var(--teal-deep); color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }

.cats{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
.cats button{ border:1.5px solid var(--line); background:#fff; border-radius:20px; padding:7px 13px; font-size:12px; cursor:pointer; font-family:inherit; color:var(--ink); }
.cats button.on{ border-color:var(--teal-deep); background:var(--teal-tint); color:var(--teal-deep); font-weight:700; }

.biz{ display:block; background:#fff; border-radius:14px; padding:15px; margin-bottom:10px; text-decoration:none; color:var(--ink); }
.biz-t{ display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.biz-n{ flex:1; font-size:15.5px; font-weight:700; font-family:'Space Grotesk',sans-serif; }
.biz-c{ font-size:10.5px; font-weight:700; background:var(--teal-tint); color:var(--teal-deep); border-radius:20px; padding:3px 9px; white-space:nowrap; }
.biz-v{ font-size:11px; color:var(--found); font-weight:700; margin-bottom:7px; }
.biz-i{ font-size:12.5px; color:var(--ink-soft); line-height:1.7;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.biz-r{ font-size:11px; color:var(--ink-soft); margin-top:7px; }

.state{ text-align:center; padding:44px 20px; color:var(--ink-soft); font-size:13px; line-height:1.9; }
.state a{ color:var(--teal-deep); font-weight:700; }

footer{ margin-top:26px; text-align:center; font-size:11px; color:var(--ink-soft); line-height:1.8; }
footer a{ color:var(--teal-deep); }
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" href="index.html">Alias<em>call</em></a>
</div>

<div class="wrap">
  <h1>업체 목록</h1>
  <div class="desc">
    번호를 주고받지 않고 문의하실 수 있는 곳들입니다.<br>
    사업자등록과 필요한 자격을 확인한 업체만 올라옵니다.
  </div>

  <div class="find">
    <input type="text" id="kw" placeholder="상호로 찾기…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button type="button" id="findBtn">찾기</button>
  </div>

  <div class="cats" id="cats"></div>
  <div id="list"><div class="state">불러오는 중…</div></div>

  <footer>
    실제 번호를 노출하지 않는 안전한 연결 서비스입니다.<br>
    <a href="index.html">Aliascall이 궁금하신가요? ›</a>
  </footer>
</div>

<script>
const SUPABASE_URL = "https://qmwaraittiurkynszjts.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2FyYWl0dGl1cmt5bnN6anRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODQ5OTUsImV4cCI6MjEwMjM2MDk5NX0.9Qr2vFzDCSKS54N6C5QN44BvCzIPTMQyVz7nX3GqT9Y";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ⚠ 이 목록을 볼 사람은 Aliascall 계정이 없습니다.
//   로그인 없이 그대로 보이게 하고, 문의는 업체 페이지에서 별명만으로 합니다.
let cats = [];
let curCat = null;

async function loadCats(){
  try {
    const { data } = await sb.from('business_categories')
      .select('code, label_ko, sort_order').order('sort_order');
    cats = data || [];
  } catch (e) { console.warn('[dir] 업종 조회 실패', e); }

  const box = document.getElementById('cats');
  box.innerHTML = '';
  const all = document.createElement('button');
  all.type = 'button'; all.className = 'on'; all.textContent = '전체';
  all.addEventListener('click', () => { curCat = null; markCat(all); loadList(); });
  box.appendChild(all);

  cats.forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = c.label_ko;
    b.addEventListener('click', () => { curCat = c.code; markCat(b); loadList(); });
    box.appendChild(b);
  });
}
function markCat(el){
  document.querySelectorAll('#cats button').forEach((x) => x.classList.remove('on'));
  el.classList.add('on');
}

async function loadList(){
  const list = document.getElementById('list');
  list.innerHTML = '<div class="state">불러오는 중…</div>';
  const kw = document.getElementById('kw').value.trim();

  let rows = [];
  try {
    const { data, error } = await sb.rpc('list_public_businesses', {
      p_category: curCat, p_keyword: kw || null, p_limit: 100,
    });
    if (error) throw error;
    rows = data || [];
  } catch (e) {
    console.error('[dir] 목록 조회 실패', e);
    list.innerHTML = '<div class="state">잠시 후 다시 시도해주세요.</div>';
    return;
  }

  list.innerHTML = '';
  if (rows.length === 0) {
    // ⚠ 아직 등록 업체가 없을 수 있습니다. 빈 화면만 보이면 서비스가 죽은 줄 압니다.
    list.innerHTML = '<div class="state">' +
      (kw || curCat ? '조건에 맞는 업체가 없습니다.' :
       '아직 등록된 업체가 없습니다.<br>곧 하나둘 올라올 예정입니다.') +
      '<br><a href="index.html">Aliascall 둘러보기 ›</a></div>';
    return;
  }

  rows.forEach((r) => {
    const a = document.createElement('a');
    a.className = 'biz';
    // ⚠ 상호를 주소로 씁니다. 한글이라 반드시 부호화해야 합니다.
    a.href = 'aliascall_business.html?b=' + encodeURIComponent(r.slug || '');

    const t = document.createElement('div');
    t.className = 'biz-t';
    const n = document.createElement('span');
    n.className = 'biz-n'; n.textContent = r.business_name || '';
    const c = document.createElement('span');
    c.className = 'biz-c'; c.textContent = r.category_label || '';
    t.appendChild(n); t.appendChild(c);
    a.appendChild(t);

    // ⚠ 자격증 자체는 절대 공개하지 않습니다. 확인했다는 표시만 남깁니다.
    const v = document.createElement('div');
    v.className = 'biz-v';
    v.textContent = r.license_verified ? '✅ 사업자등록 · 자격 확인' : '✅ 사업자등록 확인';
    a.appendChild(v);

    if (r.intro) {
      const i = document.createElement('div');
      i.className = 'biz-i'; i.textContent = r.intro;
      a.appendChild(i);
    }
    if (r.region) {
      const rg = document.createElement('div');
      rg.className = 'biz-r'; rg.textContent = '📍 ' + r.region;
      a.appendChild(rg);
    }
    list.appendChild(a);
  });
}

document.getElementById('findBtn').addEventListener('click', loadList);
document.getElementById('kw').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadList(); });

(async function init(){
  await loadCats();
  loadList();
})();
</script>
</body>
</html>
